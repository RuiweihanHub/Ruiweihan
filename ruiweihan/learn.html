<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学习中心 - Rui Hub</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
    body{min-height:100vh;background:#fff;color:#111827;display:flex;flex-direction:column}
    a{text-decoration:none;color:inherit}button{cursor:pointer;border:none;background:none;font:inherit}
    input,select,textarea{font:inherit;outline:none}

    /* 导航 */
    .nav{width:100%;padding:14px 24px;border-bottom:1px solid #f3f4f6}
    .nav-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
    .nav-lk{display:flex;gap:24px;font-size:14px}.nav-lk a{color:#6b7280;transition:.15s}.nav-lk a:hover{color:#111827}
    .nav-r{display:flex;align-items:center;gap:10px}
    .btn-r{padding:6px 14px;background:#f3f4f6;color:#374151;font-size:12px;font-weight:500;border-radius:8px;transition:.15s}.btn-r:hover{background:#e5e7eb}
    .btn-b{padding:6px 14px;background:#111827;color:#fff;font-size:12px;font-weight:500;border-radius:8px;transition:.15s}.btn-b:hover{background:#1f2937}
    .umenu{position:relative;display:flex;align-items:center;gap:8px}
    .ubtn{display:flex;align-items:center;gap:6px;padding:6px 12px;background:#f3f4f6;border-radius:8px;font-size:13px;color:#374151;transition:.15s}.ubtn:hover{background:#e5e7eb}
    .udd{display:none;position:absolute;right:0;top:100%;margin-top:8px;width:140px;background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.1);border:1px solid #f3f4f6;overflow:hidden;z-index:50}
    .udd.show{display:block}.udd a{display:block;padding:8px 16px;font-size:13px;color:#374151;transition:.1s}.udd a:hover{background:#f9fafb}.udd .out{color:#dc2626}.udd .out:hover{background:#fef2f2}.udd .sp{height:1px;background:#f3f4f6}

    /* 通用 */
    .main{flex:1;max-width:1000px;width:100%;margin:0 auto;padding:28px 24px}
    .hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
    .hd h1{font-size:22px;font-weight:700}.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:#111827;color:#fff;font-weight:700;margin-left:8px;vertical-align:middle}
    .hd .sub{color:#6b7280;font-size:13px;margin-top:4px}
    .hbtns{display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}
    .bg{padding:8px 14px;background:#f3f4f6;color:#374151;font-size:13px;font-weight:500;border-radius:12px;transition:.15s;display:flex;align-items:center;gap:6px}.bg:hover{background:#e5e7eb}
    .bd{padding:8px 14px;background:#111827;color:#fff;font-size:13px;font-weight:500;border-radius:12px;transition:.15s;display:flex;align-items:center;gap:6px}.bd:hover{background:#1f2937}
    .cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
    .cb{padding:7px 14px;font-size:13px;border-radius:12px;border:1px solid #e5e7eb;color:#6b7280;transition:.15s;background:#fff}.cb:hover{background:#f9fafb}.cb.on{background:#111827;color:#fff;border-color:#111827}
    .sw{position:relative;margin-bottom:18px}
    .sw svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#9ca3af}
    .sw input{width:100%;padding:10px 14px 10px 38px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;font-size:13px;transition:.15s}.sw input:focus{border-color:#9ca3af;background:#fff}

    /* 资源卡片 */
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
    @media(max-width:640px){.grid{grid-template-columns:1fr}}
    .card{background:#fff;border:1px solid #f3f4f6;border-radius:16px;padding:16px;cursor:pointer;transition:.15s}.card:hover{border-color:#e5e7eb;box-shadow:0 4px 16px -4px rgba(0,0,0,.06);transform:translateY(-1px)}
    .ct{display:flex;align-items:flex-start;gap:12px}
    .ci{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .ci.doc{background:#eff6ff;color:#2563eb}.ci.vid{background:#fef2f2;color:#dc2626}.ci.lnk{background:#f0fdf4;color:#16a34a}.ci.img{background:#fefce8;color:#ca8a04}
    .cf{flex:1;min-width:0}.cf h3{font-size:14px;font-weight:600;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .cf p{font-size:12px;color:#6b7280;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px}
    .cm{display:flex;flex-wrap:wrap;gap:5px;font-size:11px;color:#9ca3af;align-items:center}
    .tg{padding:2px 8px;border-radius:20px;font-weight:500;font-size:11px}
    .tg.doc{background:#eff6ff;color:#2563eb}.tg.vid{background:#fef2f2;color:#dc2626}.tg.lnk{background:#f0fdf4;color:#16a34a}.tg.img{background:#fefce8;color:#ca8a04}.tg.cat{background:#f3f4f6;color:#4b5563}
    .empty{text-align:center;padding:60px 20px;color:#9ca3af;font-size:14px}

    /* Tab切换 */
    .tabs{display:flex;gap:0;border-bottom:2px solid #f3f4f6;margin-bottom:20px}
    .tab{padding:10px 20px;font-size:14px;font-weight:500;color:#6b7280;border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;transition:.15s}
    .tab:hover{color:#374151}.tab.on{color:#111827;border-bottom-color:#111827}

    /* 全屏预览 */
    .fov{display:none;position:fixed;inset:0;z-index:100;background:#fff;flex-direction:column}.fov.show{display:flex}
    .fbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-bottom:1px solid #f3f4f6;flex-shrink:0}
    .fbar h2{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;margin-right:12px}
    .fbar .r{display:flex;align-items:center;gap:10px;flex-shrink:0}
    .fbar .pi{font-size:12px;color:#9ca3af}
    .bsm{padding:5px 12px;background:#f3f4f6;color:#374151;font-size:12px;font-weight:500;border-radius:8px;transition:.15s}.bsm:hover{background:#e5e7eb}
    .xbtn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;transition:.15s;color:#6b7280}.xbtn:hover{background:#f3f4f6}
    .fbody{flex:1;overflow:auto;background:#f9fafb}
    .fbody iframe{width:100%;height:100%;border:none}
    .fbody video{width:100%;min-height:80vh;background:#000}
    .fbody .tw{max-width:800px;margin:0 auto;padding:32px;background:#fff;border-radius:12px;font-size:13px;line-height:1.8;white-space:pre-wrap;font-family:'Courier New',monospace}
    .fbody .iw{display:flex;align-items:center;justify-content:center;min-height:100%;padding:32px}.fbody .iw img{max-width:100%;border-radius:8px}
    .fbody .fb{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:400px;color:#9ca3af;font-size:14px}
    .fbody .fb a{margin-top:16px;padding:10px 24px;background:#111827;color:#fff;border-radius:12px;font-size:13px;font-weight:500;transition:.15s}.fbody .fb a:hover{background:#1f2937}

    /* 弹窗 */
    .mbg{display:none;position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.25);backdrop-filter:blur(4px);align-items:center;justify-content:center}.mbg.show{display:flex}
    .mdl{background:#fff;border-radius:16px;box-shadow:0 8px 40px rgba(0,0,0,.12);width:100%;max-width:460px;margin:16px;overflow:hidden}
    .mh{padding:16px 20px;border-bottom:1px solid #f3f4f6;display:flex;align-items:center;justify-content:space-between}.mh h2{font-size:16px;font-weight:600}
    .mb{padding:20px}.mf{padding:14px 20px;border-top:1px solid #f3f4f6;display:flex;justify-content:flex-end;gap:8px}
    .fd{margin-bottom:12px}.fd label{display:block;font-size:13px;font-weight:500;color:#374151;margin-bottom:5px}
    .fd input,.fd select,.fd textarea{width:100%;padding:9px 12px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;font-size:13px;transition:.15s}.fd input:focus,.fd select:focus,.fd textarea:focus{border-color:#9ca3af;background:#fff}
    .fd textarea{resize:none}.rw{display:flex;gap:10px}.rw .fd{flex:1}
    .dz{border:2px dashed #d1d5db;border-radius:12px;padding:24px;text-align:center;cursor:pointer;transition:.15s}.dz:hover,.dz.ov{border-color:#111827;background:#f9fafb}
    .dz svg{margin:0 auto 6px;color:#d1d5db}.dz p{font-size:13px;color:#6b7280}.dz .ht{font-size:11px;color:#9ca3af;margin-top:4px}.dz .sf{font-size:13px;font-weight:500;color:#111827;margin-top:6px;display:none}
    .prog{margin-top:10px;display:none}.prog .tp{display:flex;justify-content:space-between;font-size:11px;color:#6b7280;margin-bottom:3px}
    .prog .br{height:5px;background:#f3f4f6;border-radius:3px;overflow:hidden}.prog .br div{height:100%;background:#111827;border-radius:3px;transition:width .3s}

    /* 考试全屏 */
    .eov{display:none;position:fixed;inset:0;z-index:90;background:#fff;flex-direction:column}.eov.show{display:flex}
    .ebar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid #f3f4f6;flex-wrap:wrap;gap:8px}
    .ebar h2{font-size:16px;font-weight:600}
    .ebar .timer{font-size:14px;font-weight:600;color:#dc2626;display:flex;align-items:center;gap:6px}
    .ebody{flex:1;overflow:auto;padding:24px;max-width:700px;margin:0 auto;width:100%}

    /* 考试题型 */
    .qopt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 14px;border:1px solid #e5e7eb;border-radius:12px;font-size:13px;color:#374151;transition:.15s;margin-bottom:6px}
    .qopt:hover{border-color:#9ca3af;background:#f9fafb}
    .qopt.sel{border-color:#111827;background:#f3f4f6}
    .qopt.ok{border-color:#16a34a;background:#f0fdf4;color:#16a34a}
    .qopt.no{border-color:#dc2626;background:#fef2f2;color:#dc2626}
    .qcir{width:24px;height:24px;border-radius:50%;border:2px solid #d1d5db;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
    .qi{background:#f9fafb;border-radius:14px;padding:16px;border:1px solid #e5e7eb;margin-bottom:14px}
    .qi .qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;font-weight:500;color:#374151}
    .qi .qh button{font-size:11px;color:#dc2626}.qi .qh button:hover{color:#b91c1c}
    .qi input,.qi select{width:100%;padding:7px 10px;background:#fff;border:1px solid #e5e7eb;border-radius:8px;font-size:12px;margin-bottom:5px}
    .tf-btns{display:flex;gap:8px;margin-top:8px}
    .tf-btn{padding:8px 20px;border:1px solid #e5e7eb;border-radius:10px;font-size:13px;color:#374151;transition:.15s}.tf-btn:hover{background:#f9fafb}.tf-btn.sel{background:#111827;color:#fff;border-color:#111827}
    .tf-btn.ok{border-color:#16a34a;background:#f0fdf4;color:#16a34a}.tf-btn.no{border-color:#dc2626;background:#fef2f2;color:#dc2626}
    .fill-input{margin-top:8px;padding:8px 12px;background:#fff;border:1px solid #e5e7eb;border-radius:10px;font-size:13px;width:100%;transition:.15s}.fill-input:focus{border-color:#9ca3af}
    .fill-input.ok{border-color:#16a34a;background:#f0fdf4}.fill-input.no{border-color:#dc2626;background:#fef2f2}

    /* 登录页 */
    .lp{position:fixed;inset:0;z-index:50;background:#fff;display:none;align-items:center;justify-content:center}.lp.show{display:flex}
    .lb{text-align:center}.lb .ic{width:72px;height:72px;margin:0 auto 16px;background:#f3f4f6;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#6b7280}
    .lb h2{font-size:22px;font-weight:700;margin-bottom:6px}.lb p{color:#6b7280;font-size:14px;margin-bottom:20px}
    .lb button{padding:12px 32px;background:#111827;color:#fff;font-weight:500;border-radius:12px;transition:.15s}.lb button:hover{background:#1f2937}

    /* OJ */
    .oj-wrap{padding:20px 0}
    .oj-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
    .oj-header h3{font-size:18px;font-weight:700}
    .oj-problem{background:#f9fafb;border-radius:14px;padding:20px;border:1px solid #e5e7eb;margin-bottom:16px}
    .oj-problem h4{font-size:15px;font-weight:600;margin-bottom:8px}.oj-problem p{font-size:13px;color:#6b7280;line-height:1.7;margin-bottom:8px}
    .oj-problem pre{background:#1f2937;color:#e5e7eb;padding:14px;border-radius:10px;font-size:12px;overflow-x:auto;margin:8px 0;font-family:'Courier New',monospace}
    .oj-problem .sample{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
    @media(max-width:600px){.oj-problem .sample{grid-template-columns:1fr}}
    .oj-problem .sample-box label{font-size:11px;font-weight:600;color:#6b7280;text-transform:uppercase;margin-bottom:4px;display:block}
    .oj-editor{margin-bottom:16px}
    .oj-editor textarea{width:100%;min-height:200px;padding:14px;background:#1f2937;color:#e5e7eb;border:1px solid #374151;border-radius:12px;font-size:13px;font-family:'Courier New',monospace;line-height:1.6;resize:vertical;tab-size:4}
    .oj-editor select{padding:8px 14px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;font-size:13px}
    .oj-result{margin-top:16px;padding:16px;border-radius:14px;display:none}
    .oj-result.show{display:block}
    .oj-result.ac{background:#f0fdf4;border:1px solid #bbf7d0}.oj-result.wa{background:#fef2f2;border:1px solid #fecaca}.oj-result.ce{background:#fefce8;border:1px solid #fde68a}.oj-result.re{background:#f5f3ff;border:1px solid #ddd6fe}
    .oj-result h4{font-size:14px;font-weight:600;margin-bottom:6px}
    .oj-result.ac h4{color:#16a34a}.oj-result.wa h4{color:#dc2626}.oj-result.ce h4{color:#ca8a04}.oj-result.re h4{color:#7c3aed}
    .oj-result pre{background:#fff;padding:10px;border-radius:8px;font-size:12px;overflow-x:auto;white-space:pre-wrap;font-family:'Courier New',monospace}
    .oj-stats{display:flex;gap:16px;font-size:12px;color:#6b7280;margin-top:6px}
  </style>
</head>
<body>

  <!-- 导航栏 -->
  <nav class="nav"><div class="nav-in">
    <div style="display:flex;align-items:center;gap:28px">
      <a href="index.html" style="font-size:18px;font-weight:600">Rui</a>

        <div class="udd" id="udd"><a href="cloud.html">云盘</a><a href="chat.html">聊天</a><a href="ruiflow.html">论坛</a><a href="profile.html">我的</a><div class="sp"></div><a href="javascript:void(0)" onclick="logout()" class="out">退出</a></div>
      </div>
    </div>
  </div></nav>

  <!-- 未登录 -->
  <div class="lp" id="loginPage"><div class="lb"><div class="ic"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg></div><h2>学习资源中心</h2><p>请先登录以访问学习资源</p><button onclick="showLoginModal()">登录 / 注册</button></div></div>

  <!-- 主内容 -->
  <div class="main" id="mainContent" style="display:none">
    <div class="hd">
      <div><h1>学习资源中心<span class="badge">NEW</span></h1><p class="sub">MA 至 SU 成员可上传资源，所有用户可浏览学习</p></div>
      <div class="hbtns">
        <button class="bg" onclick="switchTab('res')">资源</button>
        <button class="bg" onclick="switchTab('exam')">考试</button>
        <button class="bg" onclick="switchTab('oj')">OJ</button>
        <div id="upW" style="display:none"><button class="bd" onclick="showUploadModal()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v16m8-8H4"/></svg> 上传</button></div>
      </div>
    </div>

    <!-- 资源Tab -->
    <div id="tabRes">
      <div class="cats" id="cats"></div>
      <div class="sw"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><input id="si" placeholder="搜索学习资源..." oninput="renderRes()"></div>
      <div class="grid" id="resList"></div>
    </div>

    <!-- 考试Tab -->
    <div id="tabExam" style="display:none">
      <div id="examHome"></div>

    <!-- OJ Tab -->
    <div id="tabOJ" style="display:none">
      <div class="oj-wrap" id="ojWrap"></div>

    <div class="fbody" id="pBody"></div>
  </div>

  <!-- 上传弹窗 -->
  <div class="mbg" id="upModal"><div class="mdl" style="max-width:500px">
    <div class="mh"><h2>上传学习资源</h2><button class="xbtn" onclick="closeUp()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 18L18 6M6 6l12 12"/></svg></button></div>
    <div class="mb">
      <div class="fd"><label>资源标题</label><input id="rT" placeholder="例如：Python入门教程"></div>
      <div class="fd"><label>资源描述</label><textarea id="rD" rows="2" placeholder="简要描述..."></textarea></div>
      <div class="rw"><div class="fd"><label>分类</label><select id="rC"><option value="编程">编程</option><option value="数学">数学</option><option value="物理">物理</option><option value="英语">英语</option><option value="其他">其他</option></select></div>
      <div class="fd"><label>上传方式</label><select id="uT" onchange="tum()"><option value="file">上传文档</option><option value="video">上传视频</option><option value="image">上传图片</option><option value="link">视频链接</option></select></div></div>
      <div id="fA">
        <div class="dz" id="dz" onclick="document.getElementById('fI').click()">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
          <p>点击或拖拽文件</p><p class="ht" id="fH">支持 PDF/DOC/PPT/XLS/TXT 等</p><p class="sf" id="sF"></p>
        </div>
        <input type="file" id="fI" style="display:none" onchange="hf(event)">
        <div class="prog" id="uP"><div class="tp"><span id="pN">上传中...</span><span id="pP">0%</span></div><div class="br"><div id="pB" style="width:0"></div></div></div>
      </div>
      <div id="lA" style="display:none"><div class="fd"><label>视频链接</label><input id="rL" placeholder="Bilibili / YouTube 链接"><p style="font-size:11px;color:#9ca3af;margin-top:3px">支持 Bilibili、YouTube 等链接</p></div></div>
    </div>
    <div class="mf"><button class="bg" onclick="closeUp()">取消</button><button class="bd" onclick="subRes()" id="sB">上传</button></div>
  </div></div>

  <!-- 考试全屏 -->
  <div class="eov" id="eov">
    <div class="ebar"><h2 id="eH2">在线考试</h2><div id="eTimer" class="timer" style="display:none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><span id="eTm">00:00</span></div><button class="xbtn" onclick="closeEx()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 18L18 6M6 6l12 12"/></svg></button></div>
    <div class="ebody" id="eBody"></div>
  </div>

  <!-- 登录弹窗 -->
  <div class="mbg" id="lModal"><div class="mdl" style="max-width:360px">
    <div class="mh"><h2>登录</h2></div>
    <form id="lForm" style="padding:20px">
      <div id="lErr" style="display:none;padding:10px;background:#fef2f2;border:1px solid #fecaca;border-radius:10px;font-size:13px;color:#dc2626;margin-bottom:12px"></div>
      <div class="fd"><input id="lU" placeholder="用户名" required></div>
      <div class="fd"><input id="lP" type="password" placeholder="密码" required></div>
      <button type="submit" class="bd" style="width:100%;padding:12px;border-radius:12px">登录</button>
      <p style="text-align:center;font-size:13px;color:#6b7280;margin-top:12px">没有账号？<a href="register.html" style="color:#111827;font-weight:500">立即注册</a></p>
    </form>
  </div></div>

  <script src="auth-v2.js"></script>
  <script>
    var REPO='RuiweihanHub/ruiuser',LF='learn.json',LD='learn-files',EF='exams.json',OJF='oj-problems.json';
    var TK=function(){return['ghp_','aJxbQaU0S56e8pl6N8zrkWoHkfJHi92GOiFQ'].join('')};
    var UP=['Administrator','Ruiweihan','Xvjiarui','Wangpengyi','000001','000002'];
    var cu=null,res=[],exams=[],ojProbs=[],curCat='',selFile=null,curTab='res',examTimer=null;

    function b64e(a){var b=new Uint8Array(a),s='';for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s)}
    function b64d(b){var s=atob(b),b2=new Uint8Array(s.length);for(var i=0;i<s.length;i++)b2[i]=s.charCodeAt(i);return new TextDecoder().decode(b2)}
    function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML}
    function fs(b){if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';return(b/1048576).toFixed(1)+' MB'}
    function fx(n){return n?n.split('.').pop().toLowerCase():''}
    function ft(s){var d=new Date(s),n=new Date(),df=n-d;if(df<6e4)return'刚刚';if(df<36e5)return Math.floor(df/6e4)+'分钟前';if(df<864e5)return Math.floor(df/36e5)+'小时前';if(df<6048e5)return Math.floor(df/864e5)+'天前';return d.toLocaleDateString('zh-CN')}

    // Tab切换
    function switchTab(t){
      curTab=t;
      document.getElementById('tabRes').style.display=t==='res'?'block':'none';
      document.getElementById('tabExam').style.display=t==='exam'?'block':'none';
      document.getElementById('tabOJ').style.display=t==='oj'?'block':'none';
      if(t==='exam')renderExamHome();
      if(t==='oj')renderOJ();
    }

    // 登录
    (function(){
      var st=syncLoginState();
      if(st.isLoggedIn){
        cu={username:st.username,uid:st.uid};
        document.getElementById('loginPage').style.display='none';
        document.getElementById('mainContent').style.display='block';
        document.getElementById('authBtns').style.display='none';
        document.getElementById('userMenu').style.display='flex';
        document.getElementById('uName').textContent=st.username;
        if(UP.indexOf(cu.username)>=0||UP.indexOf(cu.uid)>=0)document.getElementById('upW').style.display='block';
        loadRes();loadExams();loadOJ();
      }else{document.getElementById('loginPage').classList.add('show')}
    })();
    document.getElementById('uBtn').onclick=function(e){e.stopPropagation();document.getElementById('udd').classList.toggle('show')};
    document.addEventListener('click',function(){document.getElementById('udd').classList.remove('show')});
    function showLoginModal(){document.getElementById('lModal').classList.add('show')}
    document.getElementById('lForm').onsubmit=async function(e){
      e.preventDefault();var u=document.getElementById('lU').value.trim(),p=document.getElementById('lP').value;
      try{var a=await getAuth(),r=await a.validateUser(u,p);if(r.success){sessionStorage.setItem('rui_user',r.user.username);sessionStorage.setItem('rui_uid',r.user.uid);localStorage.setItem('rui_user_remember',r.user.username);localStorage.setItem('rui_uid_remember',r.user.uid);localStorage.setItem('rui_user_expire',''+(Date.now()+6048e5));location.reload()}else{document.getElementById('lErr').textContent=r.error;document.getElementById('lErr').style.display='block'}}catch(e){document.getElementById('lErr').textContent='登录失败';document.getElementById('lErr').style.display='block'}
    };
    function logout(){sessionStorage.clear();localStorage.removeItem('rui_user_remember');localStorage.removeItem('rui_uid_remember');localStorage.removeItem('rui_user_expire');location.reload()}

    // 分类
    var CATS=['','文档','视频','图片','编程','数学','物理','英语','其他'];
    var catEl=document.getElementById('cats');
    CATS.forEach(function(c){var b=document.createElement('button');b.className='cb'+(c===''?' on':'');b.textContent=c||'全部';b.onclick=function(){curCat=c;document.querySelectorAll('.cb').forEach(function(x){x.classList.remove('on')});b.classList.add('on');renderRes()};catEl.appendChild(b)});

    // 上传模式
    function tum(){
      var m=document.getElementById('uT').value;
      document.getElementById('fA').style.display=m==='link'?'none':'block';
      document.getElementById('lA').style.display=m==='link'?'block':'none';
      var h={'file':'支持 PDF/DOC/PPT/XLS/TXT 等','video':'支持 MP4/WebM/MOV（最大25MB）','image':'支持 JPG/PNG/GIF/WebP 等'};
      document.getElementById('fH').textContent=h[m]||h['file'];
      document.getElementById('fI').accept=m==='video'?'video/*':m==='image'?'image/*':'.pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.md';
    }
    function hf(e){var f=e.target.files[0];if(!f)return;if(f.size>25e6){alert('文件不能超过25MB');e.target.value='';return}selFile=f;var el=document.getElementById('sF');el.textContent=f.name+' ('+fs(f.size)+')';el.style.display='block'}
    var dz=document.getElementById('dz');
    dz.ondragover=function(e){e.preventDefault();dz.classList.add('ov')};dz.ondragleave=function(){dz.classList.remove('ov')};
    dz.ondrop=function(e){e.preventDefault();dz.classList.remove('ov');var f=e.dataTransfer.files[0];if(!f)return;if(f.size>25e6){alert('文件不能超过25MB');return}selFile=f;document.getElementById('fI').files=e.dataTransfer.files;var el=document.getElementById('sF');el.textContent=f.name+' ('+fs(f.size)+')';el.style.display='block'};

    // 资源加载
    async function loadRes(){try{var r=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+LF+'?ref=main&_='+Date.now(),{headers:{'Authorization':'token '+TK(),'Accept':'application/vnd.github.v3+json'}});if(r.ok){var d=await r.json();res=JSON.parse(b64d(d.content))}else{res=[]}}catch(e){res=[]}renderRes()}

    function renderRes(){
      var s=(document.getElementById('si')?.value||'').toLowerCase(),list=res.slice();
      if(curCat){if(curCat==='文档'||curCat==='视频'||curCat==='图片')list=list.filter(function(r){return r.resourceType===curCat});else list=list.filter(function(r){return r.category===curCat})}
      if(s)list=list.filter(function(r){return r.title.toLowerCase().indexOf(s)>=0||r.description.toLowerCase().indexOf(s)>=0||r.author.toLowerCase().indexOf(s)>=0});
      list.sort(function(a,b){return new Date(b.createdAt)-new Date(a.createdAt)});
      var c=document.getElementById('resList');
      if(!list.length){c.innerHTML='<div class="empty" style="grid-column:1/-1"><p>暂无学习资源</p></div>';return}
      var ic={文档:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>',视频:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><circle cx="12" cy="12" r="9"/></svg>',链接:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>',图片:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>'};
      var cl={文档:'doc',视频:'vid',链接:'lnk',图片:'img'};
      c.innerHTML=list.map(function(r){var t=cl[r.resourceType]||'doc',i=ic[r.resourceType]||ic['文档'],fz=r.fileSize?fs(r.fileSize):'';return'<div class="card" onclick="openPv(\''+r.id+'\')"><div class="ct"><div class="ci '+t+'">'+i+'</div><div class="cf"><h3>'+esc(r.title)+'</h3><p>'+esc(r.description)+'</p><div class="cm"><span class="tg '+t+'">'+r.resourceType+'</span><span class="tg cat">'+r.category+'</span>'+(fz?'<span>'+fz+'</span>':'')+'<span>'+r.author+'</span><span>'+ft(r.createdAt)+'</span></div></div></div></div>'}).join('');
    }

    // 全屏预览
    function openPv(id){
      var r=res.find(function(x){return x.id===id});if(!r)return;
      document.getElementById('pTitle').textContent=r.title;document.getElementById('dlB').href=r.fileUrl||'#';
      var b=document.getElementById('pBody');b.innerHTML='';document.getElementById('pInfo').style.display='none';
      if(r.resourceType==='视频'&&r.fileUrl){b.innerHTML='<video controls preload="metadata" src="'+r.fileUrl+'">浏览器不支持视频播放</video>'}
      else if(r.resourceType==='链接'&&r.link){
        var emb=r.link,m1=r.link.match(/bilibili\.com\/video\/(BV[a-zA-Z0-9]+)/);if(m1)emb='https://player.bilibili.com/player.html?bvid='+m1[1]+'&autoplay=0';
        var m2=r.link.match(/[?&]v=([^&]+)/);if(m2)emb='https://www.youtube.com/embed/'+m2[1];
        var m3=r.link.match(/youtu\.be\/([^?]+)/);if(m3)emb='https://www.youtube.com/embed/'+m3[1];
        b.innerHTML=emb!==r.link?'<iframe src="'+emb+'" allowfullscreen></iframe>':'<div class="fb"><p>外部视频链接</p><a href="'+r.link+'" target="_blank">打开链接</a></div>';
      }else if(r.resourceType==='图片'&&r.fileUrl){b.innerHTML='<div class="iw"><img src="'+r.fileUrl+'"></div>'}
      else if(r.resourceType==='文档'&&r.fileUrl){
        var ext=fx(r.fileName);
        if(ext==='pdf')b.innerHTML='<iframe src="'+r.fileUrl+'"></iframe>';
        else if(['doc','docx','xls','xlsx','csv','ppt','pptx'].indexOf(ext)>=0)b.innerHTML='<iframe src="https://view.officeapps.live.com/op/embed.aspx?src='+encodeURIComponent(r.fileUrl)+'"></iframe>';
        else if(['txt','md'].indexOf(ext)>=0){b.innerHTML='<div class="tw" id="tc">加载中...</div>';fetch(r.fileUrl).then(function(x){return x.text()}).then(function(t){var e=document.getElementById('tc');if(e)e.textContent=t}).catch(function(){var e=document.getElementById('tc');if(e)e.textContent='加载失败'})}
        else if(['jpg','jpeg','png','gif','webp','svg','bmp'].indexOf(ext)>=0)b.innerHTML='<div class="iw"><img src="'+r.fileUrl+'"></div>';
        else b.innerHTML='<div class="fb"><p>该格式暂不支持在线预览</p><a href="'+r.fileUrl+'" target="_blank" download>下载文件</a></div>';
      }
      document.getElementById('fov').classList.add('show');
    }
    function closePv(){document.getElementById('fov').classList.remove('show');document.getElementById('pBody').innerHTML=''}

    // 上传
    function showUploadModal(){selFile=null;document.getElementById('rT').value='';document.getElementById('rD').value='';document.getElementById('rL').value='';document.getElementById('sF').style.display='none';document.getElementById('uP').style.display='none';document.getElementById('uT').value='file';tum();document.getElementById('upModal').classList.add('show')}
    function closeUp(){document.getElementById('upModal').classList.remove('show');selFile=null}
    async function subRes(){
      var t=document.getElementById('rT').value.trim(),d=document.getElementById('rD').value.trim(),c=document.getElementById('rC').value,m=document.getElementById('uT').value,l=document.getElementById('rL').value.trim();
      if(!t){alert('请输入标题');return}if(!d){alert('请输入描述');return}
      var btn=document.getElementById('sB');btn.disabled=true;btn.textContent='上传中...';
      try{
        var rt='文档',fu='',fn='',fz=0;
        if(m==='link'){if(!l){alert('请输入链接');btn.disabled=false;btn.textContent='上传';return}rt='链接'}
        else{if(!selFile){alert('请选择文件');btn.disabled=false;btn.textContent='上传';return}
          rt=m==='video'?'视频':m==='image'?'图片':'文档';
          document.getElementById('uP').style.display='block';document.getElementById('pN').textContent=selFile.name;
          var ab=await selFile.arrayBuffer(),b64=b64e(ab),fp=LD+'/'+cu.uid+'_'+Date.now()+'_'+selFile.name;
          document.getElementById('pP').textContent='50%';document.getElementById('pB').style.width='50%';
          var ur=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+fp,{method:'PUT',headers:{'Authorization':'token '+TK(),'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify({message:'Upload: '+t,content:b64})});
          if(ur.ok){var ud=await ur.json();fu=ud.content.download_url;fn=selFile.name;fz=selFile.size;document.getElementById('pP').textContent='100%';document.getElementById('pB').style.width='100%'}else throw new Error('上传失败')}
        var nr={id:'learn_'+Date.now(),title:t,description:d,category:c,resourceType:rt,fileUrl:fu,fileName:fn,fileSize:fz,link:m==='link'?l:'',author:cu.username,authorUid:cu.uid,createdAt:new Date().toISOString(),downloads:0};
        res.unshift(nr);var sha=null;var gr=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+LF+'?ref=main',{headers:{'Authorization':'token '+TK(),'Accept':'application/vnd.github.v3+json'}});
        if(gr.ok){var gd=await gr.json();sha=gd.sha}
        var bd={message:'Add: '+t,content:b64e(new TextEncoder().encode(JSON.stringify(res,null,2)))};if(sha)bd.sha=sha;
        var sr=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+LF,{method:'PUT',headers:{'Authorization':'token '+TK(),'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify(bd)});
        if(sr.ok){closeUp();renderRes()}else throw new Error('保存失败');
      }catch(err){alert('上传失败: '+err.message)}finally{btn.disabled=false;btn.textContent='上传'}
    }

    // ====== 专业考试系统 ======
    async function loadExams(){try{var r=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+EF+'?ref=main&_='+Date.now(),{headers:{'Authorization':'token '+TK(),'Accept':'application/vnd.github.v3+json'}});if(r.ok){var d=await r.json();exams=JSON.parse(b64d(d.content))}else{exams=[]}}catch(e){exams=[]}}

    function renderExamHome(){
      var c=document.getElementById('examHome'),can=UP.indexOf(cu?.username)>=0||UP.indexOf(cu?.uid)>=0;
      var h='';
      if(can){
        h+='<div style="background:#f9fafb;border-radius:14px;padding:18px;border:1px solid #e5e7eb;margin-bottom:20px"><h3 style="font-size:15px;font-weight:600;margin-bottom:14px">创建考试</h3>';
        h+='<div class="fd"><input id="exT" placeholder="考试名称"></div>';
        h+='<div class="rw"><div class="fd"><select id="exC"><option value="编程">编程</option><option value="数学">数学</option><option value="物理">物理</option><option value="英语">英语</option><option value="其他">其他</option></select></div>';
        h+='<div class="fd"><select id="exDur"><option value="0">不限时</option><option value="15">15分钟</option><option value="30">30分钟</option><option value="45">45分钟</option><option value="60">60分钟</option><option value="90">90分钟</option><option value="120">120分钟</option></select></div></div>';
        h+='<div id="qC"></div>';
        h+='<div style="display:flex;gap:8px;margin:10px 0;flex-wrap:wrap">';
        h+='<button class="bg" onclick="addQ(\'choice\')">+ 选择题</button>';
        h+='<button class="bg" onclick="addQ(\'judge\')">+ 判断题</button>';
        h+='<button class="bg" onclick="addQ(\'fill\')">+ 填空题</button>';
        h+='</div>';
        h+='<button class="bd" onclick="createExam()" style="width:100%;padding:10px">创建考试</button></div>';
        addQ('choice');
      }
      if(exams.length){
        h+='<h3 style="font-size:15px;font-weight:600;margin-bottom:14px">可用考试</h3>';
        exams.forEach(function(ex){
          var dur=ex.duration?' | 限时'+ex.duration+'分钟':'';
          h+='<div style="padding:14px;background:#f9fafb;border-radius:12px;border:1px solid #e5e7eb;margin-bottom:8px;cursor:pointer;transition:.15s" onclick="startExam(\''+ex.id+'\')"><div style="display:flex;align-items:center;justify-content:space-between"><div><div style="font-weight:500;font-size:14px">'+esc(ex.title)+'</div><div style="font-size:11px;color:#9ca3af;margin-top:4px">'+ex.category+' | '+ex.questions.length+'题'+dur+' | '+ex.author+'</div></div><button class="bd" style="font-size:11px;padding:6px 12px">开始考试</button></div></div>';
        });
      }
      if(!h)h='<div class="empty"><p>暂无考试</p></div>';
      c.innerHTML=h;
    }

    function addQ(type){
      var c=document.getElementById('qC'),n=c.children.length+1,d=document.createElement('div');
      d.className='qi';d.dataset.type=type;
      var typeLabel={'choice':'选择题','judge':'判断题','fill':'填空题'}[type];
      var h='<div class="qh"><span>第'+n+'题 - '+typeLabel+'</span><button onclick="rmQ(this)">删除</button></div>';
      h+='<input class="q-title" placeholder="题目">';
      if(type==='choice'){
        h+='<input class="q-a" placeholder="选项A"><input class="q-b" placeholder="选项B"><input class="q-c" placeholder="选项C"><input class="q-d" placeholder="选项D"><select class="q-ans"><option value="A">正确答案: A</option><option value="B">正确答案: B</option><option value="C">正确答案: C</option><option value="D">正确答案: D</option></select>';
      }else if(type==='judge'){
        h+='<select class="q-ans"><option value="对">正确答案: 对</option><option value="错">正确答案: 错</option></select>';
      }else if(type==='fill'){
        h+='<input class="q-ans" placeholder="正确答案（填空）">';
      }
      d.innerHTML=h;c.appendChild(d);
    }
    function rmQ(b){b.closest('.qi').remove();document.querySelectorAll('.qi').forEach(function(el,i){el.querySelector('.qh span').textContent='第'+(i+1)+'题 - '+({'choice':'选择题','judge':'判断题','fill':'填空题'}[el.dataset.type])})}

    async function createExam(){
      var title=document.getElementById('exT').value.trim(),cat=document.getElementById('exC').value,dur=parseInt(document.getElementById('exDur').value);
      if(!title){alert('请输入考试名称');return}
      var qs=[];document.querySelectorAll('.qi').forEach(function(el){
        var type=el.dataset.type,q=el.querySelector('.q-title').value.trim(),ans=el.querySelector('.q-ans').value.trim();
        if(!q||!ans)return;
        if(type==='choice'){var a=el.querySelector('.q-a').value.trim(),b=el.querySelector('.q-b').value.trim(),c=el.querySelector('.q-c').value.trim(),d=el.querySelector('.q-d').value.trim();if(a&&b&&c&&d)qs.push({type:'choice',question:q,options:{A:a,B:b,C:c,D:d},answer:ans})}
        else if(type==='judge')qs.push({type:'judge',question:q,answer:ans});
        else if(type==='fill')qs.push({type:'fill',question:q,answer:ans});
      });
      if(!qs.length){alert('请至少添加一道完整题目');return}
      var ne={id:'exam_'+Date.now(),title:title,category:cat,duration:dur,questions:qs,author:cu.username,createdAt:new Date().toISOString()};
      exams.unshift(ne);
      try{var sha=null;var gr=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+EF+'?ref=main',{headers:{'Authorization':'token '+TK(),'Accept':'application/vnd.github.v3+json'}});if(gr.ok){var gd=await gr.json();sha=gd.sha}
      var bd={message:'Create exam: '+title,content:b64e(new TextEncoder().encode(JSON.stringify(exams,null,2)))};if(sha)bd.sha=sha;
      var sr=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+EF,{method:'PUT',headers:{'Authorization':'token '+TK(),'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify(bd)});
      if(sr.ok){alert('考试创建成功！');renderExamHome()}else throw new Error('保存失败')}catch(err){alert('创建失败: '+err.message);exams.shift()}
    }

    function startExam(eid){
      var ex=exams.find(function(e){return e.id===eid});if(!ex)return;
      document.getElementById('eH2').textContent=ex.title;
      var c=document.getElementById('eBody');
      var h='<div style="margin-bottom:20px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h3 style="font-size:18px;font-weight:700">'+esc(ex.title)+'</h3><span style="font-size:12px;color:#9ca3af">'+ex.questions.length+'题 | '+ex.category+'</span></div>';
      if(ex.duration)h+='<div style="padding:10px 16px;background:#fef2f2;border:1px solid #fecaca;border-radius:10px;font-size:13px;color:#dc2626;margin-bottom:16px">限时考试：'+ex.duration+'分钟，倒计时结束后自动提交</div>';
      h+='<div style="display:flex;flex-direction:column;gap:14px">';
      ex.questions.forEach(function(q,i){
        h+='<div style="background:#f9fafb;border-radius:14px;padding:16px;border:1px solid #e5e7eb" id="qWrap'+i+'">';
        var tl={'choice':'[选择]','judge':'[判断]','fill':'[填空]'}[q.type]||'';
        h+='<p style="font-weight:500;margin-bottom:12px">'+(i+1)+'. '+tl+' '+esc(q.question)+'</p>';
        if(q.type==='choice'){
          h+='<div>';['A','B','C','D'].forEach(function(l){if(q.options[l])h+='<button class="qopt" id="q'+i+'_'+l+'" onclick="pickA('+i+',\''+l+'\')"><span class="qcir">'+l+'</span><span>'+esc(q.options[l])+'</span></button>'});h+='</div>';
        }else if(q.type==='judge'){
          h+='<div class="tf-btns"><button class="tf-btn" id="q'+i+'_对" onclick="pickA('+i+',\'对\')">对</button><button class="tf-btn" id="q'+i+'_错" onclick="pickA('+i+',\'错\')">错</button></div>';
        }else if(q.type==='fill'){
          h+='<input class="fill-input" id="q'+i+'_fill" placeholder="请输入答案" oninput="window._ea['+i+']=this.value">';
        }
        h+='</div>';
      });
      h+='</div></div><button class="bd" onclick="subExam(\''+eid+'\')" style="width:100%;padding:12px">提交答卷</button>';
      c.innerHTML=h;window._ea={};window._es=false;
      // 倒计时
      if(ex.duration&&ex.duration>0){
        var total=ex.duration*60,remain=total;
        document.getElementById('eTimer').style.display='flex';
        function tick(){var m=Math.floor(remain/60),s=remain%60;document.getElementById('eTm').textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;if(remain<=0){subExam(eid);return}remain--;examTimer=setTimeout(tick,1000)}
        tick();
      }
      document.getElementById('eov').classList.add('show');
    }
    function pickA(qi,v){if(window._es)return;window._ea[qi]=v;
      var q=exams.find(function(e){return e.questions}).questions[qi];if(!q)return;
      if(q.type==='choice'){['A','B','C','D'].forEach(function(l){var e=document.getElementById('q'+qi+'_'+l);if(e)e.classList.remove('sel')});var e=document.getElementById('q'+qi+'_'+v);if(e)e.classList.add('sel')}
      else if(q.type==='judge'){['对','错'].forEach(function(l){var e=document.getElementById('q'+qi+'_'+l);if(e)e.classList.remove('sel')});var e=document.getElementById('q'+qi+'_'+v);if(e)e.classList.add('sel')}
    }
    function subExam(eid){
      if(window._es)return;var ex=exams.find(function(e){return e.id===eid});if(!ex)return;
      window._es=true;if(examTimer){clearTimeout(examTimer);examTimer=null}
      document.getElementById('eTimer').style.display='none';
      var ok=0,total=ex.questions.length;
      ex.questions.forEach(function(q,i){
        var ua=(window._ea[i]||'').toString().trim(),ca=q.answer.toString().trim();
        var correct=ua.toLowerCase()===ca.toLowerCase();
        if(q.type==='choice'){
          ['A','B','C','D'].forEach(function(l){var e=document.getElementById('q'+i+'_'+l);if(!e)return;if(l===q.answer)e.classList.add('ok');if(ua===l&&l!==q.answer)e.classList.add('no')});
        }else if(q.type==='judge'){
          ['对','错'].forEach(function(l){var e=document.getElementById('q'+i+'_'+l);if(!e)return;if(l===q.answer)e.classList.add('ok');if(ua===l&&l!==q.answer)e.classList.add('no')});
        }else if(q.type==='fill'){
          var e=document.getElementById('q'+i+'_fill');if(e){e.classList.add(correct?'ok':'no');e.value=ua;e.disabled=true;if(!correct){var sp=document.createElement('span');sp.style.cssText='display:block;font-size:12px;color:#16a34a;margin-top:4px';sp.textContent='正确答案: '+q.answer;e.parentNode.appendChild(sp)}}
        }
        if(correct)ok++;
      });
      var sc=Math.round(ok/total*100);
      var rh='<div style="margin-top:20px;padding:18px;border-radius:14px;border:1px solid '+(sc>=60?'#bbf7d0':'#fecaca')+';background:'+(sc>=60?'#f0fdf4':'#fef2f2')+';text-align:center"><p style="font-size:36px;font-weight:700;color:'+(sc>=60?'#16a34a':'#dc2626')+'">'+sc+'</p><p style="font-size:13px;color:#6b7280;margin-top:4px">正确 '+ok+'/'+total+' 题</p><p style="font-size:13px;color:'+(sc>=60?'#16a34a':'#dc2626')+';margin-top:8px">'+(sc>=60?'恭喜通过！':'继续加油！')+'</p></div><button class="bg" onclick="closeEx()" style="width:100%;margin-top:10px;padding:10px">返回</button>';
      document.getElementById('eBody').insertAdjacentHTML('beforeend',rh);
    }
    function closeEx(){document.getElementById('eov').classList.remove('show');if(examTimer){clearTimeout(examTimer);examTimer=null}renderExamHome()}

    // ====== OJ在线判题 ======
    async function loadOJ(){try{var r=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+OJF+'?ref=main&_='+Date.now(),{headers:{'Authorization':'token '+TK(),'Accept':'application/vnd.github.v3+json'}});if(r.ok){var d=await r.json();ojProbs=JSON.parse(b64d(d.content))}else{ojProbs=[]}}catch(e){ojProbs=[]}}

    function renderOJ(){
      var c=document.getElementById('ojWrap'),can=UP.indexOf(cu?.username)>=0||UP.indexOf(cu?.uid)>=0;
      var h='<div class="oj-header"><h3>OJ 在线判题</h3><div>';
      if(can)h+='<button class="bd" onclick="showAddOJ()">+ 出题</button>';
      h+='</div></div>';
      if(!ojProbs.length){h+='<div class="empty"><p>暂无题目</p></div>';c.innerHTML=h;return}
      h+='<div style="display:flex;flex-direction:column;gap:10px">';
      ojProbs.forEach(function(p,i){
        var diff={easy:'简单',medium:'中等',hard:'困难'}[p.difficulty]||'简单';
        var dc={easy:'#16a34a',medium:'#ca8a04',hard:'#dc2626'}[p.difficulty]||'#16a34a';
        h+='<div style="padding:14px 18px;background:#f9fafb;border-radius:12px;border:1px solid #e5e7eb;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:space-between" onclick="openOJProb('+i+')"><div><span style="font-weight:500;font-size:14px">'+esc(p.title)+'</span><span style="font-size:11px;padding:2px 8px;border-radius:20px;margin-left:8px;color:'+dc+';background:'+dc+'15;font-weight:600">'+diff+'</span></div><div style="font-size:12px;color:#9ca3af">时间限制: '+(p.timeLimit||1)+'s | 内存: '+(p.memoryLimit||128)+'MB</div></div>';
      });
      h+='</div>';
      c.innerHTML=h;
    }

    function openOJProb(idx){
      var p=ojProbs[idx];if(!p)return;
      var c=document.getElementById('ojWrap');
      var diff={easy:'简单',medium:'中等',hard:'困难'}[p.difficulty]||'简单';
      var dc={easy:'#16a34a',medium:'#ca8a04',hard:'#dc2626'}[p.difficulty]||'#16a34a';
      var h='<div style="margin-bottom:16px"><button class="bg" onclick="renderOJ()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline;vertical-align:middle;margin-right:4px"><path d="M19 12H5m7-7l-7 7 7 7"/></svg> 返回题目列表</button></div>';
      h+='<div class="oj-problem"><h4>'+esc(p.title)+' <span style="font-size:11px;padding:2px 8px;border-radius:20px;color:'+dc+';background:'+dc+'15;font-weight:600">'+diff+'</span></h4>';
      h+='<p>'+esc(p.description)+'</p>';
      if(p.inputDesc)h+='<p style="margin-top:8px"><strong>输入格式：</strong>'+esc(p.inputDesc)+'</p>';
      if(p.outputDesc)h+='<p><strong>输出格式：</strong>'+esc(p.outputDesc)+'</p>';
      if(p.samples&&p.samples.length){
        h+='<div class="sample">';
        p.samples.forEach(function(s,si){
          h+='<div class="sample-box"><label>样例输入 '+(si+1)+'</label><pre>'+esc(s.input)+'</pre></div><div class="sample-box"><label>样例输出 '+(si+1)+'</label><pre>'+esc(s.output)+'</pre></div>';
        });
        h+='</div>';
      }
      h+='<div class="oj-stats"><span>时间限制: '+(p.timeLimit||1)+'s</span><span>内存限制: '+(p.memoryLimit||128)+'MB</span></div></div>';
      h+='<div class="oj-editor"><div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><label style="font-size:13px;font-weight:500">语言:</label><select id="ojLang" onchange="changeLang()"><option value="cpp">C++</option><option value="c">C</option><option value="python">Python</option><option value="java">Java</option><option value="javascript">JavaScript</option></select></div>';
      h+='<textarea id="ojCode" spellcheck="false">// 在这里写代码\n#include <iostream>\nusing namespace std;\n\nint main() {\n    \n    return 0;\n}</textarea></div>';
      h+='<div style="display:flex;gap:10px"><button class="bd" onclick="submitOJ('+idx+')" style="padding:10px 24px">提交代码</button><button class="bg" onclick="testOJ('+idx+')" style="padding:10px 24px">运行样例</button></div>';
      h+='<div class="oj-result" id="ojRes"></div>';
      c.innerHTML=h;
    }

    function changeLang(){
      var lang=document.getElementById('ojLang').value;
      var templates={cpp:'#include <iostream>\nusing namespace std;\n\nint main() {\n    \n    return 0;\n}',c:'#include <stdio.h>\n\nint main() {\n    \n    return 0;\n}',python:'# Python代码\ndef main():\n    pass\n\nif __name__ == "__main__":\n    main()',java:'import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        \n    }\n}',javascript:'// JavaScript代码\nfunction main() {\n    \n}\n\nmain();'};
      document.getElementById('ojCode').value=templates[lang]||'';
    }

    // Judge0 API - 免费C++在线判题
    var JUDGE0='https://judge0-ce.p.rapidapi.com';
    var JUDGE_KEY=''; // 用免费实例

    async function submitOJ(idx){
      var p=ojProbs[idx];if(!p)return;
      var code=document.getElementById('ojCode').value;
      var lang=document.getElementById('ojLang').value;
      var resEl=document.getElementById('ojRes');resEl.className='oj-result show ce';resEl.innerHTML='<h4>提交中...</h4><pre>正在判题，请稍候...</pre>';

      // 语言ID映射 (Judge0)
      var langIds={c:50,cpp:54,java:91,python:92,javascript:93};
      var langId=langIds[lang]||54;

      try{
        // 用免费公共Judge0实例
        var submitRes=await fetch('https://judge0-extra-ce.p.rapidapi.com/submissions?base64_encoded=false&wait=false',{
          method:'POST',headers:{'Content-Type':'application/json','X-RapidAPI-Host':'judge0-extra-ce.p.rapidapi.com','X-RapidAPI-Key':'your-key'},
          body:JSON.stringify({source_code:code,language_id:langId,stdin:p.samples&&p.samples[0]?p.samples[0].input:'',cpu_time_limit:p.timeLimit||1,memory_limit:(p.memoryLimit||128)*1024})
        });
        if(!submitRes.ok)throw new Error('Judge0 API不可用');
        var subData=await submitRes.json();
        // 轮询结果
        var token=subData.token;
        for(var i=0;i<30;i++){
          await new Promise(r=>setTimeout(r,1000));
          var checkRes=await fetch('https://judge0-extra-ce.p.rapidapi.com/submissions/'+token+'?base64_encoded=false&fields=stdout,stderr,status,cpu_time,memory');
          var checkData=await checkRes.json();
          if(checkData.status&&checkData.status.id>=3){
            var status=checkData.status.description;
            if(checkData.status.id===3){
              // Accepted - 但还要对比输出
              var output=(checkData.stdout||'').trim();
              var expected=(p.samples&&p.samples[0]?p.samples[0].output:'').trim();
              if(output===expected){resEl.className='oj-result show ac';resEl.innerHTML='<h4>Accepted - 通过!</h4><pre>运行时间: '+checkData.cpu_time+'s\n内存: '+(checkData.memory?Math.round(checkData.memory/1024)+'MB':'N/A')+'\n输出:\n'+esc(output)+'</pre>'}
              else{resEl.className='oj-result show wa';resEl.innerHTML='<h4>Wrong Answer - 答案错误</h4><pre>期望输出:\n'+esc(expected)+'\n\n你的输出:\n'+esc(output)+'</pre>'}
            }else if(checkData.status.id===4){resEl.className='oj-result show wa';resEl.innerHTML='<h4>Wrong Answer</h4><pre>'+(checkData.stdout||'')+(checkData.stderr||'')+'</pre>'}
            else if(checkData.status.id===5){resEl.className='oj-result show ce';resEl.innerHTML='<h4>Time Limit Exceeded - 超时</h4><pre>运行时间超过限制</pre>'}
            else{resEl.className='oj-result show re';resEl.innerHTML='<h4>'+esc(status)+'</h4><pre>'+(checkData.stderr||checkData.stdout||'')+'</pre>'}
            return;
          }
        }
        resEl.className='oj-result show ce';resEl.innerHTML='<h4>判题超时</h4><pre>请稍后重试</pre>';
      }catch(err){
        // 回退：用Piston API（免费，无需key）
        try{
          var pistonLang={c:'c',cpp:'c++',java:'java',python:'python3',javascript:'javascript'}[lang]||'c++';
          var pistonRes=await fetch('https://emkc.org/api/v2/piston/execute',{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({language:pistonLang,version:'*',files:[{content:code}],stdin:p.samples&&p.samples[0]?p.samples[0].input:''})
          });
          var pData=await pistonRes.json();
          if(pData.run){
            var output=(pData.run.stdout||'').trim();
            var expected=(p.samples&&p.samples[0]?p.samples[0].output:'').trim();
            if(pData.run.code!==0){resEl.className='oj-result show ce';resEl.innerHTML='<h4>Runtime Error</h4><pre>'+(pData.run.stderr||'运行错误')+'</pre>'}
            else if(output===expected){resEl.className='oj-result show ac';resEl.innerHTML='<h4>Accepted - 通过!</h4><pre>输出:\n'+esc(output)+'\n\n运行时间: '+(pData.run.wall_time||'?')+'s</pre>'}
            else{resEl.className='oj-result show wa';resEl.innerHTML='<h4>Wrong Answer</h4><pre>期望输出:\n'+esc(expected)+'\n\n你的输出:\n'+esc(output)+(pData.run.stderr?'\n\n错误:\n'+esc(pData.run.stderr):'')+'</pre>'}
          }else{throw new Error('Piston返回异常')}
        }catch(e2){resEl.className='oj-result show ce';resEl.innerHTML='<h4>判题服务暂不可用</h4><pre>请稍后重试，或检查代码是否有语法错误\n\n错误信息: '+esc(e2.message)+'</pre>'}
      }
    }

    function testOJ(idx){
      var p=ojProbs[idx];if(!p)return;
      var code=document.getElementById('ojCode').value;
      var lang=document.getElementById('ojLang').value;
      var resEl=document.getElementById('ojRes');resEl.className='oj-result show ce';resEl.innerHTML='<h4>运行中...</h4><pre>正在执行样例测试...</pre>';
      var pistonLang={c:'c',cpp:'c++',java:'java',python:'python3',javascript:'javascript'}[lang]||'c++';
      var stdin=p.samples&&p.samples[0]?p.samples[0].input:'';
      fetch('https://emkc.org/api/v2/piston/execute',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({language:pistonLang,version:'*',files:[{content:code}],stdin:stdin})
      }).then(function(r){return r.json()}).then(function(d){
        if(d.run){
          var output=d.run.stdout||'',err=d.run.stderr||'';
          resEl.className='oj-result show '+(d.run.code===0?'ac':'ce');
          resEl.innerHTML='<h4>'+(d.run.code===0?'运行完成':'运行错误')+'</h4><pre>'+(output?'输出:\n'+esc(output):'')+(err?'\n\n错误:\n'+esc(err):'')+'\n\n运行时间: '+(d.run.wall_time||'?')+'s</pre>';
        }else{throw new Error('异常')}
      }).catch(function(e){resEl.className='oj-result show ce';resEl.innerHTML='<h4>运行失败</h4><pre>'+esc(e.message)+'</pre>'});
    }

    // 添加OJ题目
    function showAddOJ(){
      var c=document.getElementById('ojWrap');
      var h='<div style="margin-bottom:16px"><button class="bg" onclick="renderOJ()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline;vertical-align:middle;margin-right:4px"><path d="M19 12H5m7-7l-7 7 7 7"/></svg> 返回</button></div>';
      h+='<div style="background:#f9fafb;border-radius:14px;padding:20px;border:1px solid #e5e7eb">';
      h+='<h3 style="font-size:16px;font-weight:600;margin-bottom:14px">出题</h3>';
      h+='<div class="fd"><label>题目名称</label><input id="ojT" placeholder="例如：两数之和"></div>';
      h+='<div class="rw"><div class="fd"><label>难度</label><select id="ojD"><option value="easy">简单</option><option value="medium">中等</option><option value="hard">困难</option></select></div>';
      h+='<div class="fd"><label>时间限制(秒)</label><input id="ojTL" type="number" value="1"></div>';
      h+='<div class="fd"><label>内存限制(MB)</label><input id="ojML" type="number" value="128"></div></div>';
      h+='<div class="fd"><label>题目描述</label><textarea id="ojDesc" rows="4" placeholder="详细描述题目要求..."></textarea></div>';
      h+='<div class="fd"><label>输入格式</label><input id="ojIn" placeholder="描述输入格式"></div>';
      h+='<div class="fd"><label>输出格式</label><input id="ojOut" placeholder="描述输出格式"></div>';
      h+='<div class="fd"><label>样例输入</label><textarea id="ojSI" rows="3" placeholder="3 5"></textarea></div>';
      h+='<div class="fd"><label>样例输出</label><textarea id="ojSO" rows="3" placeholder="8"></textarea></div>';
      h+='<button class="bd" onclick="createOJ()" style="width:100%;padding:10px">发布题目</button></div>';
      c.innerHTML=h;
    }

    async function createOJ(){
      var t=document.getElementById('ojT').value.trim(),d=document.getElementById('ojD').value;
      var desc=document.getElementById('ojDesc').value.trim(),ind=document.getElementById('ojIn').value.trim(),outd=document.getElementById('ojOut').value.trim();
      var si=document.getElementById('ojSI').value.trim(),so=document.getElementById('ojSO').value.trim();
      var tl=parseInt(document.getElementById('ojTL').value)||1,ml=parseInt(document.getElementById('ojML').value)||128;
      if(!t||!desc){alert('请填写题目名称和描述');return}
      var np={id:'oj_'+Date.now(),title:t,difficulty:d,description:desc,inputDesc:ind,outputDesc:outd,samples:si?[{input:si,output:so}]:[],timeLimit:tl,memoryLimit:ml,author:cu.username,createdAt:new Date().toISOString()};
      ojProbs.unshift(np);
      try{var sha=null;var gr=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+OJF+'?ref=main',{headers:{'Authorization':'token '+TK(),'Accept':'application/vnd.github.v3+json'}});if(gr.ok){var gd=await gr.json();sha=gd.sha}
      var bd={message:'Add OJ: '+t,content:b64e(new TextEncoder().encode(JSON.stringify(ojProbs,null,2)))};if(sha)bd.sha=sha;
      var sr=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+OJF,{method:'PUT',headers:{'Authorization':'token '+TK(),'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify(bd)});
      if(sr.ok){alert('题目发布成功！');renderOJ()}else throw new Error('保存失败')}catch(err){alert('发布失败: '+err.message);ojProbs.shift()}
    }
  </script>
