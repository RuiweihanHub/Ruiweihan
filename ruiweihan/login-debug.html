<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>登录诊断 - Rui Hub</title>
  <style>
    body { font-family: system-ui; max-width: 800px; margin: 50px auto; padding: 20px; }
    .card { background: #f5f5f5; padding: 20px; border-radius: 10px; margin: 10px 0; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    pre { background: #1e1e1e; color: #fff; padding: 15px; border-radius: 5px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>🔧 登录状态诊断工具</h1>
  
  <div class="card">
    <h3>当前登录状态</h3>
    <pre id="status">检测中...</pre>
  </div>
  
  <div class="card">
    <h3>存储内容</h3>
    <pre id="storage">检测中...</pre>
  </div>
  
  <div class="card">
    <h3>操作</h3>
    <button onclick="setTestLogin()">设置测试登录（Ruiweihan）</button>
    <button onclick="clearLogin()">清除登录状态</button>
    <button onclick="location.reload()">刷新页面</button>
    <a href="index.html"><button>返回首页</button></a>
  </div>
  
  <div class="card" id="result"></div>

  <script>
    function showStatus() {
      const sessionUser = sessionStorage.getItem('rui_user');
      const sessionUid = sessionStorage.getItem('rui_uid');
      const localUser = localStorage.getItem('rui_user_remember');
      const localUid = localStorage.getItem('rui_uid_remember');
      const expire = localStorage.getItem('rui_user_expire');
      
      const now = Date.now();
      const expireTime = parseInt(expire || '0');
      const isExpired = expire && expireTime > 0 && now > expireTime;
      
      document.getElementById('storage').textContent = JSON.stringify({
        sessionStorage: { rui_user: sessionUser, rui_uid: sessionUid },
        localStorage: { 
          rui_user_remember: localUser, 
          rui_uid_remember: localUid, 
          rui_user_expire: expire,
          expireTime: expireTime ? new Date(expireTime).toLocaleString() : null,
          now: new Date(now).toLocaleString(),
          isExpired: isExpired
        }
      }, null, 2);
      
      if (sessionUser || localUser) {
        if (isExpired) {
          document.getElementById('status').textContent = '⚠️ 登录已过期！请重新登录。';
          document.getElementById('status').parentElement.className = 'card error';
        } else {
          document.getElementById('status').textContent = '✅ 已登录: ' + (sessionUser || localUser);
          document.getElementById('status').parentElement.className = 'card success';
        }
      } else {
        document.getElementById('status').textContent = '❌ 未登录';
        document.getElementById('status').parentElement.className = 'card error';
      }
    }
    
    function setTestLogin() {
      const user = 'Ruiweihan';
      const uid = '000001';
      sessionStorage.setItem('rui_user', user);
      sessionStorage.setItem('rui_uid', uid);
      localStorage.setItem('rui_user_remember', user);
      localStorage.setItem('rui_uid_remember', uid);
      localStorage.setItem('rui_user_expire', (Date.now() + 7 * 24 * 60 * 60 * 1000).toString());
      document.getElementById('result').innerHTML = '<div class="success">✅ 已设置登录状态！点击<a href="cloud.html">云盘</a>测试。</div>';
      showStatus();
    }
    
    function clearLogin() {
      sessionStorage.removeItem('rui_user');
      sessionStorage.removeItem('rui_uid');
      localStorage.removeItem('rui_user_remember');
      localStorage.removeItem('rui_uid_remember');
      localStorage.removeItem('rui_user_expire');
      document.getElementById('result').innerHTML = '<div class="error">已清除登录状态</div>';
      showStatus();
    }
    
    showStatus();
  </script>
</body>
</html>
