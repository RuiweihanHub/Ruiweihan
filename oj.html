    .lp{position:fixed;inset:0;z-index:50;background:#fff;display:none;align-items:center;justify-content:center}.lp.show{display:flex}
    .lb{text-align:center}.lb .ic{width:72px;height:72px;margin:0 auto 16px;background:#f3f4f6;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#6b7280}
    .lb h2{font-size:22px;font-weight:700;margin-bottom:6px}.lb p{color:#6b7280;font-size:14px;margin-bottom:20px}
    .lb button{padding:12px 32px;background:#111827;color:#fff;font-weight:500;border-radius:12px;transition:.15s}.lb button:hover{background:#1f2937}

    .oj-wrap{padding:20px 0}
    .oj-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
    .oj-header h3{font-size:18px;font-weight:700}

    @media(max-width:600px){.oj-problem .sample{grid-template-columns:1fr}}
    .oj-problem .sample-box label{font-size:11px;font-weight:600;color:#6b7280;text-transform:uppercase;margin-bottom:4px;display:block}
    .oj-editor{margin-bottom:16px}
    .oj-editor textarea{width:100%;min-height:220px;padding:14px;background:#1f2937;color:#e5e7eb;border:1px solid #374151;border-radius:12px;font-size:13px;font-family:'Courier New',monospace;line-height:1.6;resize:vertical;tab-size:4}

    .oj-result.ac{background:#f0fdf4;border:1px solid #bbf7d0}.oj-result.wa{background:#fef2f2;border:1px solid #fecaca}.oj-result.ce{background:#fff7ed;border:1px solid #fed7aa}.oj-result.re{background:#f5f3ff;border:1px solid #ddd6fe}.oj-result.tle{background:#fefce8;border:1px solid #fde68a}
    .oj-result h4{font-size:15px;font-weight:700;margin-bottom:8px}
    .oj-result.ac h4{color:#16a34a}.oj-result.wa h4{color:#dc2626}.oj-result.ce h4{color:#ea580c}.oj-result.re h4{color:#7c3aed}.oj-result.tle h4{color:#ca8a04}
    .oj-result pre{background:#fff;padding:10px;border-radius:8px;font-size:12px;overflow-x:auto;white-space:pre-wrap;font-family:'Courier New',monospace}
    .oj-stats{display:flex;gap:16px;font-size:12px;color:#6b7280;margin-top:6px}
    .oj-verdict{display:inline-block;padding:3px 12px;border-radius:8px;font-size:13px;font-weight:700;margin-right:8px}
    .oj-verdict.ac{background:#dcfce7;color:#16a34a}.oj-verdict.wa{background:#fee2e2;color:#dc2626}.oj-verdict.tle{background:#fef9c3;color:#ca8a04}.oj-verdict.ce{background:#ffedd5;color:#ea580c}.oj-verdict.re{background:#ede9fe;color:#7c3aed}
    .oj-score-bar{height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden;margin:10px 0}.oj-score-bar div{height:100%;border-radius:4px;transition:width .5s}

    .tab-nav{display:flex;gap:0;border-bottom:2px solid #f3f4f6;margin-bottom:20px}
    .tab-btn{padding:10px 20px;font-size:14px;font-weight:500;color:#6b7280;border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;transition:.15s;background:none}
    .tab-btn:hover{color:#374151}.tab-btn.on{color:#111827;border-bottom-color:#111827}

    .qnav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;padding:12px;background:#f9fafb;border-radius:12px;border:1px solid #e5e7eb}
    .qnav-b{width:32px;height:32px;border-radius:8px;border:1px solid #e5e7eb;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;cursor:pointer;transition:.15s;color:#6b7280;background:#fff}
    .qnav-b:hover{border-color:#9ca3af}.qnav-b.done{background:#111827;color:#fff;border-color:#111827}.qnav-b.cur{border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.2)}
    .exam-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
    .exam-stat .si{background:#f9fafb;border-radius:12px;padding:14px;text-align:center;border:1px solid #e5e7eb}
    .exam-stat .si .n{font-size:24px;font-weight:700;color:#111827}.exam-stat .si .l{font-size:11px;color:#6b7280;margin-top:2px}

    .score-card{margin-top:20px;border-radius:16px;overflow:hidden;border:1px solid #e5e7eb}
    .score-card .sc-head{padding:24px;text-align:center;color:#fff}
    .score-card .sc-head.pass{background:linear-gradient(135deg,#16a34a,#22c55e)}.score-card .sc-head.fail{background:linear-gradient(135deg,#dc2626,#ef4444)}
    .score-card .sc-head .sc-score{font-size:56px;font-weight:800;line-height:1}.score-card .sc-head .sc-label{font-size:14px;opacity:.85;margin-top:6px}
    .score-card .sc-body{padding:20px;background:#fff}
    .score-card .sc-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f3f4f6;font-size:13px}
    .score-card .sc-row:last-child{border-bottom:none}
    .score-card .sc-row .sc-k{color:#6b7280}.score-card .sc-row .sc-v{font-weight:600;color:#111827}

    .exam-card{padding:14px 18px;background:#f9fafb;border-radius:12px;border:1px solid #e5e7eb;margin-bottom:8px;transition:.15s}
    .exam-card:hover{border-color:#d1d5db;box-shadow:0 2px 8px rgba(0,0,0,.04)}

    .pv-del{padding:5px 12px;background:#fef2f2;color:#dc2626;font-size:12px;font-weight:500;border-radius:8px;transition:.15s;border:1px solid #fecaca}.pv-del:hover{background:#dc2626;color:#fff}

    .oj-prob-card{padding:14px 18px;background:#f9fafb;border-radius:12px;border:1px solid #e5e7eb;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:space-between}
    .oj-prob-card:hover{border-color:#d1d5db;box-shadow:0 2px 8px rgba(0,0,0,.04)}
  
    .oj-search{position:relative;margin-bottom:14px}
    .oj-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#9ca3af}
    .oj-search input{width:100%;padding:10px 14px 10px 38px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;font-size:13px;transition:.15s}.oj-search input:focus{border-color:#9ca3af;background:#fff}

    .oj-list-header{display:grid;grid-template-columns:60px 1fr 60px 60px 40px;gap:8px;align-items:center;padding:8px 16px;border-bottom:1px solid #e5e7eb;font-size:11px;color:#9ca3af;font-weight:600}

    function toBase64(s){var b=new TextEncoder().encode(s),r='';for(var i=0;i<b.length;i++)r+=String.fromCharCode(b[i]);return btoa(r)}
    function fromBase64(b){var s=atob(b),r=new Uint8Array(s.length);for(var i=0;i<s.length;i++)r[i]=s.charCodeAt(i);return new TextDecoder().decode(r)}
    var AUTH_LOCAL_USERS={users:[{uid:'Administrator',username:'Administrator',passwordHash:hashPasswordSync('admin123'),role:'admin'},{uid:'000001',username:'Ruiweihan',passwordHash:hashPasswordSync('rui123'),role:'admin'},{uid:'000002',username:'Xvjiarui',passwordHash:hashPasswordSync('xvj123'),role:'user'}]};

    function syncLoginState(){
      var su=sessionStorage.getItem('rui_user'),suid=sessionStorage.getItem('rui_uid');
      if(su&&suid)return{isLoggedIn:true,username:su,uid:suid};
      var lu=localStorage.getItem('rui_user_remember'),luid=localStorage.getItem('rui_uid_remember'),exp=localStorage.getItem('rui_user_expire');
      if(lu&&luid){if(exp&&parseInt(exp)>Date.now()){sessionStorage.setItem('rui_user',lu);sessionStorage.setItem('rui_uid',luid);return{isLoggedIn:true,username:lu,uid:luid}}else{localStorage.removeItem('rui_user_remember');localStorage.removeItem('rui_uid_remember');localStorage.removeItem('rui_user_expire')}}
      return{isLoggedIn:false}
    }

    async function getAuth(){
      var auth={initialized:false,users:null,usersSha:null};
      async function init(){
        if(auth.initialized)return true;
        try{var r=await fetch('https://api.github.com/repos/'+AUTH_REPO+'/contents/users.json?ref=main&_='+Date.now(),{headers:{'Authorization':'token '+AUTH_TK(),'Accept':'application/vnd.github.v3+json'}});if(r.ok){var d=await r.json();auth.usersSha=d.sha;auth.users=JSON.parse(fromBase64(d.content));auth.initialized=true;return true}}catch(e){}
        auth.initialized=true;return false
      }
      return{
        validateUser:async function(usernameOrUid,password){
          if(!auth.initialized)await init();
          var hashed=hashPasswordSync(password);
          if(!auth.users){
            var lu=AUTH_LOCAL_USERS.users.find(function(u){return(u.username===usernameOrUid||u.uid===usernameOrUid)&&u.passwordHash===hashed});
            return lu?{success:true,user:{uid:lu.uid,username:lu.username,role:lu.role}}:{success:false,error:'用户名或密码错误'}
          }
          var idx=-1;
          if(auth.users.index&&auth.users.index.byUsername&&auth.users.index.byUsername[usernameOrUid]!==undefined)idx=auth.users.index.byUsername[usernameOrUid];
          if(idx===-1&&auth.users.index&&auth.users.index.byUid&&auth.users.index.byUid[usernameOrUid]!==undefined)idx=auth.users.index.byUid[usernameOrUid];
          if(idx===-1)idx=auth.users.users.findIndex(function(u){return u.username===usernameOrUid||u.uid===usernameOrUid});
          if(idx===-1)return{success:false,error:'用户名或密码错误'};

          return{success:false,error:'用户名或密码错误'}
        }
      }
    }

    // ====== 判题系统 V4.0 ======
    // C++/C/Python/Java: Judge0 CE API真实执行
    // JavaScript: 浏览器沙箱执行

    var JUDGE0_URL='https://ce.judge0.com';
    var JUDGE0_LANG_MAP={
      'cpp':54,'c':50,'python':71,'java':62,'javascript':63
    };

    async function runJudge(lang,code,stdin,expected,timeLimit){
      timeLimit=timeLimit||2;
      if(lang==='javascript'){
        // JavaScript: 浏览器沙箱执行（即时返回）
        var startTime=performance.now();
        try{
          var output=runJSSandbox(code,stdin);
          var elapsed=((performance.now()-startTime)/1000).toFixed(3);
          if(parseFloat(elapsed)>timeLimit)return{status:'tle',stdout:'',time:elapsed+'s',memory:'-'};
          var out=(output||'').trim();
          var exp=(expected||'').trim();
          return{status:out===exp?'ac':'wa',stdout:output,time:elapsed+'s',memory:'-'};
        }catch(e){
          var elapsed=((performance.now()-startTime)/1000).toFixed(3);
          var msg=(e.message||'').substring(0,200);
          if(msg.indexOf('TIMEOUT')>=0)return{status:'tle',stdout:'',time:elapsed+'s',memory:'-'};
          return{status:'re',stdout:'',stderr:msg,time:elapsed+'s',memory:'-'};
        }
      }
      // C++/C/Python/Java: Judge0 CE API真实执行
      var langId=JUDGE0_LANG_MAP[lang];
      if(!langId)return{status:'ce',stdout:'',stderr:'不支持的语言: '+lang,time:'-',memory:'-'};
      try{
        // 使用base64编码避免非UTF-8字符导致422错误
        var b64Encode=function(s){return btoa(unescape(encodeURIComponent(s||'')))};
        var body={
          source_code:b64Encode(code),
          language_id:langId,
          stdin:b64Encode(stdin||''),
          cpu_time_limit:Number(timeLimit),
          memory_limit:128000,
          wall_time_limit:Number(timeLimit)+2
        };
        var r=await fetch(JUDGE0_URL+'/submissions/?base64_encoded=true&wait=true',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify(body)
        });
        if(!r.ok){
          var errText='';
          try{errText=await r.text()}catch(e2){}
          return{status:'re',stdout:'',stderr:'Judge0请求失败('+r.status+'): '+errText.substring(0,300),time:'-',memory:'-'};
        }
        var data=await r.json();
        var statusId=data.status&&data.status.id;
        // 解码base64输出
        var b64Decode=function(s){try{return s?decodeURIComponent(escape(atob(s))):''}catch(e){try{return s?atob(s):''}catch(e2){return s||''}}};
        var stdout=b64Decode(data.stdout||'');
        var stderr=b64Decode(data.stderr||'')||b64Decode(data.compile_output||'');
        var time=data.time||'-';
        var memory=data.memory?''+Math.round(data.memory/1024)+'KB':'-';
        // Judge0 status: 1=In Queue, 2=Processing, 3=AC, 4=WA, 5=TLE, 6=MLE, 7=RE, 8=CE, 9-14=other errors
        if(statusId===3){
          var out=(stdout||'').trim();
          var exp=(expected||'').trim();
          return{status:out===exp?'ac':'wa',stdout:stdout,time:time,memory:memory};
        }else if(statusId===4){
          return{status:'wa',stdout:stdout,time:time,memory:memory};
        }else if(statusId===5){
          return{status:'tle',stdout:stdout,time:time,memory:memory};
        }else if(statusId===6){
          return{status:'tle',stdout:'',time:time,memory:memory};
        }else if(statusId===7){
          return{status:'re',stdout:stdout,stderr:stderr.substring(0,500),time:time,memory:memory};
        }else if(statusId===8){
          return{status:'ce',stdout:'',stderr:stderr.substring(0,500),time:'-',memory:'-'};
        }else if(statusId<=2){
          return{status:'re',stdout:'',stderr:'执行超时或排队中',time:'-',memory:'-'};
        }else{
          return{status:'re',stdout:stdout,stderr:stderr.substring(0,300),time:time,memory:memory};
        }
      }catch(e){
        return{status:'re',stdout:'',stderr:'网络错误: '+e.message,time:'-',memory:'-'};
      }
    }

    function runJSSandbox(code,stdin){
      var rawLines=(stdin||'').split('\n');
      var allTokens=[];
      rawLines.forEach(function(line){
        var trimmed=line.trim();
        if(trimmed==='')return;
        trimmed.split(/\s+/).forEach(function(token){
          if(token!==''){
            var n=Number(token);
            allTokens.push(isNaN(n)?token:n);
          }
        });
      });
      var tokenIdx=0;
      var outputArr=[];
      var _readline=function(){return tokenIdx<allTokens.length?String(allTokens[tokenIdx++]):''};
      var _readInt=function(){if(tokenIdx>=allTokens.length)return 0;var val=allTokens[tokenIdx++];return typeof val==='number'?val:parseInt(val)||0};
      var _readFloat=function(){if(tokenIdx>=allTokens.length)return 0;var val=allTokens[tokenIdx++];return typeof val==='number'?val:parseFloat(val)||0};
      var _readLine=function(){return tokenIdx<allTokens.length?String(allTokens[tokenIdx++]):''};
      var _print=function(){var a=Array.prototype.slice.call(arguments);outputArr.push(a.map(String).join(' '))};
      var _console={log:function(){var a=Array.prototype.slice.call(arguments);outputArr.push(a.map(String).join(' '))},warn:function(){},error:function(msg){outputArr.push('Error: '+String(msg))},info:function(){}};
      var processedCode=code
        .replace(/readline\s*\(\)/g,'readline()')
        .replace(/parseInt\s*\(\s*readline\s*\(\)\s*\)/g,'readInt()')
        .replace(/parseFloat\s*\(\s*readline\s*\(\)\s*\)/g,'readFloat()');
      var fn=new Function('console','readline','readInt','readFloat','readLine','print','Math','Array','String','Number','Object','JSON','Map','Set','isNaN','isFinite',
        '"use strict";try{'+processedCode+'}catch(e){console.error(e.message)}'
      );
      var timedOut=false;
      var timer=setTimeout(function(){timedOut=true},3000);
      try{
        fn(_console,_readline,_readInt,_readFloat,_readLine,_print,Math,Array,String,Number,Object,JSON,Map,Set,isNaN,isFinite);
      }catch(e){
        clearTimeout(timer);
        if(timedOut)throw new Error('TIMEOUT');
        throw e;
      }
      clearTimeout(timer);
      if(timedOut)throw new Error('TIMEOUT');
      return outputArr.join('\n');
    }

    function showOJResult(verdict,testResults,extra){
      var resEl=document.getElementById('ojRes');
      if(!resEl)return;
      var total=testResults.length;

      var label={ac:'Accepted',wa:'Wrong Answer',tle:'Time Limit Exceeded',ce:'Compilation Error',re:'Runtime Error'}[verdict]||verdict;
      resEl.className='oj-result show '+verdict;
      var pct=total>0?Math.round(acCount/total*100):0;
      var barColor=verdict==='ac'?'#16a34a':verdict==='wa'?'#dc2626':verdict==='tle'?'#ca8a04':verdict==='ce'?'#ea580c':'#7c3aed';
      var h='';
      // AC celebration header
      if(verdict==='ac'){
        h+='<div class="oj-ac-header"><div class="ac-title">🎉 Accepted!</div><div class="ac-subtitle">恭喜！所有测试点通过</div></div>';
      }else{
        h+='<div style="display:flex;align-items:center;margin-bottom:12px;padding:12px 16px"><span class="oj-verdict '+verdict+'">'+verdict.toUpperCase()+'</span><span style="font-size:14px;font-weight:600">'+label+'</span></div>';
      }
      // Score summary
      h+='<div style="padding:0 16px">';
      h+='<div style="font-size:16px;font-weight:700;margin-bottom:4px">'+acCount+'/'+total+' 通过</div>';
      h+='<div class="oj-result-progress"><div style="width:'+pct+'%;background:'+barColor+'"></div></div>';
      h+='</div>';
      // Test case table
      if(total>0){
        h+='<div style="padding:8px 16px"><table class="oj-test-table"><thead><tr><th>#</th><th>状态</th><th>耗时</th><th>内存</th></tr></thead><tbody>';
        testResults.forEach(function(t,i){
          var statusLabel={ac:'AC',wa:'WA',tle:'TLE',ce:'CE',re:'RE',running:'...'}[t.status]||t.status;
          h+='<tr><td>'+(i+1)+'</td><td><span class="oj-test-badge '+t.status+'">'+statusLabel+'</span></td><td>'+(t.time||'-')+'</td><td>'+(t.memory||'-')+'</td></tr>';
        });
        h+='</tbody></table></div>';
      }
      if(extra)h+='<div style="padding:0 16px 12px"><pre style="margin-top:10px">'+extra+'</pre></div>';
      resEl.innerHTML=h;
      // AC celebration effects
      if(verdict==='ac'){
        showConfetti();
      }
    }

    function showRunningResult(currentIdx,totalTests){

      h+='<div class="oj-result-progress"><div style="width:'+Math.round(currentIdx/totalTests*100)+'%;background:#3b82f6"></div></div>';

          h+='<tr><td>'+(i+1)+'</td><td><span class="oj-test-badge '+t.status+'">'+statusLabel+'</span></td><td>'+(t.time||'-')+'</td><td>'+(t.memory||'-')+'</td></tr>';

    async function submitOJ(){
      var p=ojProbs[currentOJIdx];if(!p)return;
      var code=document.getElementById('ojCode').value;
      var lang=document.getElementById('ojLang').value;
      if(!code.trim()){alert('请输入代码');return}
      var resEl=document.getElementById('ojRes');
      resEl.className='oj-result show ce';
      resEl.innerHTML='<div class="oj-running-info"><span class="spin">⏳</span> 正在提交判题...</div>';
      var allTests=[];
      if(p.samples&&p.samples.length){p.samples.forEach(function(s){allTests.push({input:s.input,output:s.output})})}
      // 只加入有效的testData（跳过占位假数据）
      if(p.testData&&p.testData.length){p.testData.forEach(function(s){
        var si=(s.input||'').trim(),so=(s.output||'').trim();
        if(si&&so&&si.indexOf('test input')<0&&si.indexOf('Sample input')<0&&so.indexOf('test output')<0&&so.indexOf('Sample output')<0){
          allTests.push({input:s.input,output:s.output});
        }
      })}
      // 如果没有有效testData，只用samples判题
      if(!allTests.length&&p.samples&&p.samples.length){p.samples.forEach(function(s){allTests.push({input:s.input,output:s.output})})}
      if(!allTests.length){resEl.className='oj-result show ce';resEl.innerHTML='<h4>无测试数据</h4><pre>该题目没有设置测试数据</pre>';return}
      var totalTests=allTests.length;
      var timeLimit=parseFloat(String(p.timeLimit||'2').replace(/[^0-9.]/g,''))||2;
      try{
        // 并行提交所有测试点！
        var promises=allTests.map(function(s,i){
          return runJudge(lang,code,s.input,s.output,timeLimit).then(function(result){
            return{idx:i,result:result};
          });
        });
        var results=await Promise.all(promises);
        // 按顺序排列结果
        results.sort(function(a,b){return a.idx-b.idx});
        var testResults=[];
        var acCount=0,tleCount=0;
        var firstCE=null,firstRE=null;
        results.forEach(function(r){
          var res=r.result;
          if(res.status==='ac'){
            acCount++;
            testResults.push({status:'ac',time:res.time,memory:res.memory||'-'});
          }else if(res.status==='wa'){
            testResults.push({status:'wa',time:res.time,memory:res.memory||'-'});
          }else if(res.status==='tle'){
            tleCount++;
            testResults.push({status:'tle',time:'TLE',memory:'-'});
          }else if(res.status==='ce'){
            testResults.push({status:'ce',time:'-',memory:'-'});
            if(!firstCE)firstCE=res.stderr||'编译错误';
          }else if(res.status==='re'){
            testResults.push({status:'re',time:'-',memory:'-'});
            if(!firstRE)firstRE=res.stderr||'运行时错误';
          }else{
            testResults.push({status:res.status,time:res.time||'-',memory:res.memory||'-'});
          }
        });
        // 决定最终结果
        var finalVerdict;
        if(firstCE){finalVerdict='ce'}
        else if(firstRE){finalVerdict='re'}
        else if(acCount===totalTests){finalVerdict='ac'}
        else if(tleCount>0){finalVerdict='tle'}
        else{finalVerdict='wa'}
        var extraMsg='';
        if(finalVerdict==='ce')extraMsg=firstCE;
        else if(finalVerdict==='re')extraMsg=firstRE;
        showOJResult(finalVerdict,testResults,extraMsg);
        saveOJRecord({probId:p.id,probTitle:p.title,user:cu.username,status:finalVerdict,score:acCount,total:totalTests,time:new Date().toISOString()});
        saveOJSubmission({probId:p.id,probTitle:p.title,user:cu.username,verdict:finalVerdict,score:acCount,total:totalTests,language:lang,codeLength:code.length,time:new Date().toISOString()});
      }catch(err){
        showOJResult('re',[],'判题出错\n\n'+esc(err.message));
      }
    }

    async function testOJSample(){
      var p=ojProbs[currentOJIdx];if(!p)return;
      var code=document.getElementById('ojCode').value;
      var lang=document.getElementById('ojLang').value;
      if(!code.trim()){alert('请输入代码');return}
      var resEl=document.getElementById('ojRes');
      resEl.className='oj-result show ce';
      resEl.innerHTML='<div class="oj-running-info"><span class="spin">⏳</span> 正在运行样例...</div>';
      var samples=p.samples||[];
      if(!samples.length){resEl.className='oj-result show ce';resEl.innerHTML='<h4>无样例</h4><pre>该题目没有设置样例数据</pre>';return}
      // 运行第一个样例
      var stdin=samples[0].input||'';
      var expected=(samples[0].output||'').trim();
      try{
        var tl=parseFloat(String(p.timeLimit||'2').replace(/[^0-9.]/g,''))||2;var result=await runJudge(lang,code,stdin,expected,tl);
        if(result.status==='ce'||result.status==='re'){
          resEl.className='oj-result show '+(result.status==='ce'?'ce':'re');
          var errMsg=result.stderr||'运行错误';
          resEl.innerHTML='<h4>运行错误</h4><div style="padding:0 16px 12px"><pre>'+esc(errMsg.substring(0,500))+'</pre></div>';
        }else{
          var output=(result.stdout||'').trim();
          var matched=output===expected;
          var h='';
          h+='<div style="display:flex;align-items:center;margin-bottom:12px;padding:12px 16px"><span class="oj-verdict '+(matched?'ac':'wa')+'">'+(matched?'PASS':'FAIL')+'</span><span style="font-size:14px;font-weight:600">样例运行结果</span></div>';
          h+='<div style="padding:0 16px 12px">';
          h+='<pre>'+(output?'你的输出:\n'+esc(output):'(无输出)')+(expected?'\n\n期望输出:\n'+esc(expected):'');
          h+='\n\n运行时间: '+(result.time||'?')+'</pre>';
          h+='</div>';
          resEl.className='oj-result show '+(matched?'ac':'wa');
          resEl.innerHTML=h;
        }
      }catch(e){
        resEl.className='oj-result show ce';
        resEl.innerHTML='<h4>运行失败</h4><div style="padding:0 16px 12px"><pre>'+esc(e.message)+'</pre></div>';
      }
    }

    // ====== Helper Functions ======

    function setupEditor(){
      var textarea=document.getElementById('ojCode');
      var gutter=document.getElementById('ojLineNumbers');
      if(!textarea||!gutter)return;
      // Sync scroll
      textarea.addEventListener('scroll',function(){
        gutter.scrollTop=textarea.scrollTop;
      });
      // Update line numbers on input
      textarea.addEventListener('input',function(){updateLineNumbers()});
      // Tab key support
      textarea.addEventListener('keydown',function(e){
        if(e.key==='Tab'){
          e.preventDefault();
          var start=textarea.selectionStart;
          var end=textarea.selectionEnd;
          textarea.value=textarea.value.substring(0,start)+'    '+textarea.value.substring(end);
          textarea.selectionStart=textarea.selectionEnd=start+4;
          updateLineNumbers();
        }
        // Auto-indent on Enter
        if(e.key==='Enter'){
          e.preventDefault();
          var start=textarea.selectionStart;
          var val=textarea.value;
          var lineStart=val.lastIndexOf('\n',start-1)+1;
          var currentLine=val.substring(lineStart,start);
          var indent=currentLine.match(/^(\s*)/)[1];
          // Add extra indent after { or :
          var lastChar=val.substring(start-1,start);
          if(lastChar==='{'||lastChar==='：'){
            indent+='    ';
          }
          textarea.value=val.substring(0,start)+'\n'+indent+val.substring(start);
          textarea.selectionStart=textarea.selectionEnd=start+1+indent.length;
          updateLineNumbers();
        }
      });
      updateLineNumbers();
    }

    function updateLineNumbers(){
      var textarea=document.getElementById('ojCode');
      var gutter=document.getElementById('ojLineNumbers');
      if(!textarea||!gutter)return;
      var lines=textarea.value.split('\n').length;
      var nums=[];
      for(var i=1;i<=lines;i++)nums.push(i);
      gutter.textContent=nums.join('\n');
    }

    function setFontSize(size){
      var textarea=document.getElementById('ojCode');
      var gutter=document.getElementById('ojLineNumbers');
      if(!textarea||!gutter)return;
      textarea.classList.remove('font-s','font-l');
      gutter.classList.remove('font-s','font-l');
      if(size==='s'){textarea.classList.add('font-s');gutter.classList.add('font-s')}
      else if(size==='l'){textarea.classList.add('font-l');gutter.classList.add('font-l')}
      // Update button states
      var btns=document.querySelectorAll('.oj-font-btn');
      btns.forEach(function(b){b.classList.remove('active')});
      var idx=size==='s'?0:size==='l'?2:1;
      if(btns[idx])btns[idx].classList.add('active');
      updateLineNumbers();
    }

    async function createOJ(){
      var t=document.getElementById('ojT').value.trim(),d=document.getElementById('ojD').value;
      var desc=document.getElementById('ojDesc').value.trim(),ind=document.getElementById('ojIn').value.trim(),outd=document.getElementById('ojOut').value.trim();
      var tl=parseInt(document.getElementById('ojTL').value)||1,ml=parseInt(document.getElementById('ojML').value)||128;
      if(!t||!desc){alert('请填写题目名称和描述');return}
      var sis=document.querySelectorAll('.oj-si'),sos=document.querySelectorAll('.oj-so');
      var samples=[];
      for(var i=0;i<Math.min(sis.length,2);i++){var si=sis[i].value.trim(),soEl=sos[i],so=soEl&&soEl.value?soEl.value.trim():'';if(si||so)samples.push({input:si,output:so})}
      var tdis=document.querySelectorAll('.oj-tdi'),tdos=document.querySelectorAll('.oj-tdo');
      var testData=[];
      for(var i=0;i<tdis.length;i++){var tdi=tdis[i].value.trim(),tdoEl=tdos[i],tdo=tdoEl&&tdoEl.value?tdoEl.value.trim():'';if(tdi||tdo)testData.push({input:tdi,output:tdo})}
      var np={id:'oj_'+Date.now(),title:t,difficulty:d,description:desc,inputDesc:ind,outputDesc:outd,samples:samples,testData:testData,timeLimit:tl,memoryLimit:ml,author:cu.username,createdAt:new Date().toISOString()};
      ojProbs.unshift(np);
      try{var sha=null;var gr=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+OJF+'?ref=main',{headers:{'Authorization':'token '+TK(),'Accept':'application/vnd.github.v3+json'}});if(gr.ok){var gd=await gr.json();sha=gd.sha}
      var bd={message:'Add OJ: '+t,content:b64e(new TextEncoder().encode(JSON.stringify(ojProbs,null,2)))};if(sha)bd.sha=sha;
      var sr=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+OJF,{method:'PUT',headers:{'Authorization':'token '+TK(),'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify(bd)});
      if(sr.ok){alert('题目发布成功！');renderOJ()}else throw new Error('保存失败')}catch(err){alert('发布失败: '+err.message);ojProbs.shift()}
    }
