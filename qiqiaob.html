<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qiqiaob 工作台 - 瑞微涵</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:#f8fafc;color:#1f2937}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:100}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-logo{font-size:24px}
.topbar h1{font-size:18px;font-weight:800}
.topbar a{font-size:14px;color:#4f46e5;text-decoration:none;font-weight:600}

.tabs{display:flex;padding:16px 24px;gap:8px;background:#fff;border-bottom:1px solid #e5e7eb}
.tab{padding:10px 20px;border-radius:10px;font-size:14px;font-weight:600;color:#6b7280;cursor:pointer;transition:all .2s;border:2px solid transparent}
.tab:hover{background:#f3f4f6}
.tab.active{background:#eef2ff;color:#4f46e5;border-color:#c7d2fe}

.panel{display:none;padding:24px;max-width:900px;margin:0 auto}
.panel.active{display:block;animation:fadeIn .3s}

.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:24px;margin-bottom:16px}
.card h3{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card p{font-size:14px;color:#6b7280;line-height:1.6;margin-bottom:12px}

textarea,input[type=text],input[type=number],select{width:100%;padding:10px 14px;border:2px solid #e5e7eb;border-radius:10px;font-size:14px;font-family:inherit;transition:all .2s;outline:none;background:#fff}
textarea:focus,input:focus,select:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.1)}
textarea{resize:vertical;min-height:100px}

.btn{padding:10px 20px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.btn-primary{background:#4f46e5;color:#fff}
.btn-primary:hover{background:#4338ca}
.btn-secondary{background:#f3f4f6;color:#4b5563}
.btn-secondary:hover{background:#e5e7eb}
.btn-success{background:#10b981;color:#fff}
.btn-danger{background:#ef4444;color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px}

.slider-group{display:flex;align-items:center;gap:12px}
.slider-group input[type=range]{flex:1;accent-color:#4f46e5}
.slider-group .value{font-size:13px;font-weight:600;color:#4f46e5;min-width:40px;text-align:right}

.agent-files{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:12px}
.agent-file{padding:12px;border:1px solid #e5e7eb;border-radius:10px;cursor:pointer;transition:all .15s}
.agent-file:hover{border-color:#4f46e5;background:#f5f3ff}
.agent-file .name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent-file .size{font-size:11px;color:#9ca3af}

.train-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:12px}
.train-card{padding:16px;border:2px solid #e5e7eb;border-radius:12px;text-align:center;cursor:pointer;transition:all .15s}
.train-card:hover{border-color:#4f46e5;background:#f5f3ff}
.train-card.selected{border-color:#4f46e5;background:#eef2ff}
.train-card .icon{font-size:32px;margin-bottom:8px}
.train-card .name{font-size:13px;font-weight:600}

.result-box{background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:16px;margin-top:12px;font-size:13px;line-height:1.8;max-height:400px;overflow-y:auto;white-space:pre-wrap}

.download-btns{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}

.nav-back{display:flex;align-items:center;gap:6px;padding:8px 16px;font-size:14px;color:#6b7280;cursor:pointer;text-decoration:none}
.nav-back:hover{color:#4f46e5}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <span class="topbar-logo">🛠️</span>
    <h1>Qiqiaob 工作台</h1>
  </div>
  <a href="index.html">← 返回首页</a>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchQTab(this,'agent')">🤖 Agent</div>
  <div class="tab" onclick="switchQTab(this,'tuning')">🎛️ 模型微调</div>
  <div class="tab" onclick="switchQTab(this,'training')">🎓 模型训练</div>
</div>

<!-- Agent Panel -->
<div class="panel active" id="panel-agent">
  <div class="card">
    <h3>🤖 Agent 智能助手</h3>
    <p>上传文件到Agent云空间，AI将基于文件内容智能回答你的问题。</p>
    <div class="form-group">
      <label>上传文件</label>
      <input type="file" id="agentFileInput" multiple onchange="handleAgentUpload(this.files)">
    </div>
    <div class="agent-files" id="agentFiles"></div>
  </div>

  <div class="card">
    <h3>💬 与Agent对话</h3>
    <div class="form-group">
      <label>选择文件上下文</label>
      <select id="agentFileSelect"><option value="">无文件上下文</option></select>
    </div>
    <div class="form-group">
      <label>提问</label>
      <textarea id="agentQuestion" placeholder="向Agent提问..."></textarea>
    </div>
    <button class="btn btn-primary" onclick="askAgent()">提问</button>
    <div class="result-box" id="agentResult" style="display:none"></div>
  </div>
</div>

<!-- Tuning Panel -->
<div class="panel" id="panel-tuning">
  <div class="card">
    <h3>🎛️ 模型微调</h3>
    <p>调整API参数以获得不同的对话风格和输出效果。</p>
    <div class="form-group">
      <label>模型</label>
      <select id="tuneModel">
        <option value="gpt-4o-mini">gpt-4o-mini</option>
        <option value="gpt-4o">gpt-4o</option>
        <option value="gpt-3.5-turbo">gpt-3.5-turbo</option>
      </select>
    </div>
    <div class="form-group">
      <label>Temperature (创造性): <span id="tempVal">0.7</span></label>
      <div class="slider-group">
        <input type="range" id="tuneTemp" min="0" max="2" step="0.1" value="0.7" oninput="document.getElementById('tempVal').textContent=this.value">
      </div>
    </div>
    <div class="form-group">
      <label>Max Tokens: <span id="tokensVal">1024</span></label>
      <div class="slider-group">
        <input type="range" id="tuneTokens" min="128" max="4096" step="128" value="1024" oninput="document.getElementById('tokensVal').textContent=this.value">
      </div>
    </div>
    <div class="form-group">
      <label>Top P: <span id="topPVal">1</span></label>
      <div class="slider-group">
        <input type="range" id="tuneTopP" min="0" max="1" step="0.1" value="1" oninput="document.getElementById('topPVal').textContent=this.value">
      </div>
    </div>
    <div class="form-group">
      <label>Frequency Penalty: <span id="freqVal">0</span></label>
      <div class="slider-group">
        <input type="range" id="tuneFreq" min="-2" max="2" step="0.1" value="0" oninput="document.getElementById('freqVal').textContent=this.value">
      </div>
    </div>
    <div class="form-group">
      <label>System Prompt</label>
      <textarea id="tuneSystemPrompt" rows="3" placeholder="设定AI的角色和行为...">你是瑞微涵AI助手。</textarea>
    </div>
  </div>

  <div class="card">
    <h3>🧪 测试对话</h3>
    <div class="form-group">
      <textarea id="tuneInput" placeholder="输入测试消息..."></textarea>
    </div>
    <button class="btn btn-primary" onclick="testTuning()">测试</button>
    <div class="result-box" id="tuneResult" style="display:none"></div>
  </div>
</div>

<!-- Training Panel -->
<div class="panel" id="panel-training">
  <div class="card">
    <h3>🎓 模型训练</h3>
    <p>通过少样本学习(Few-Shot)训练模型，让AI学会你期望的回答方式。选择训练数据卡片，设置示例对话，然后训练。</p>
    <div class="form-group">
      <label>选择训练场景</label>
      <div class="train-cards" id="trainCards">
        <div class="train-card selected" onclick="selectTrainCard(this,'greeting')">
          <div class="icon">👋</div>
          <div class="name">打招呼</div>
        </div>
        <div class="train-card" onclick="selectTrainCard(this,'customer')">
          <div class="icon">🏢</div>
          <div class="name">客服</div>
        </div>
        <div class="train-card" onclick="selectTrainCard(this,'teaching')">
          <div class="icon">📚</div>
          <div class="name">教学</div>
        </div>
        <div class="train-card" onclick="selectTrainCard(this,'creative')">
          <div class="icon">🎨</div>
          <div class="name">创意</div>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>📝 示例对话 (Few-Shot)</h3>
    <p>添加示例对话来引导模型学习。至少添加2组对话效果最佳。</p>
    <div id="fewShotExamples">
      <div class="form-group" style="border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin-bottom:8px">
        <label>用户输入 1</label>
        <input type="text" id="shot_user_1" value="你好" placeholder="用户说的话">
        <label style="margin-top:8px">AI回复 1</label>
        <input type="text" id="shot_ai_1" value="你好呀！我是你的AI助手，很高兴认识你～有什么我可以帮助你的吗？😊" placeholder="AI应该怎么回">
      </div>
      <div class="form-group" style="border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin-bottom:8px">
        <label>用户输入 2</label>
        <input type="text" id="shot_user_2" value="你是谁" placeholder="用户说的话">
        <label style="margin-top:8px">AI回复 2</label>
        <input type="text" id="shot_ai_2" value="我是瑞微涵AI助手，一个友好而专业的智能助手！我可以帮你聊天、回答问题、写代码等等。试试和我聊点什么吧～✨" placeholder="AI应该怎么回">
      </div>
    </div>
    <button class="btn btn-secondary" onclick="addFewShot()" style="margin-top:8px">+ 添加更多示例</button>
  </div>

  <div class="card">
    <h3>🚀 训练 & 测试</h3>
    <div class="form-group">
      <label>测试输入</label>
      <input type="text" id="trainTestInput" placeholder="输入测试消息，看看训练效果" value="嗨">
    </div>
    <button class="btn btn-primary" id="btnTrain" onclick="trainAndTest()">🎯 训练并测试</button>
    <div class="result-box" id="trainResult" style="display:none"></div>
    <div class="download-btns" id="trainDownloads" style="display:none">
      <button class="btn btn-success" onclick="downloadTraining('json')">📥 下载 JSON</button>
      <button class="btn btn-primary" onclick="downloadTraining('txt')">📥 下载 TXT</button>
      <button class="btn btn-secondary" onclick="downloadTraining('md')">📥 下载 Markdown</button>
    </div>
  </div>
</div>

<script>
function switchQTab(el, name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
}

// Agent
const agentFileData = {};
function handleAgentUpload(files) {
  const container = document.getElementById('agentFiles');
  const select = document.getElementById('agentFileSelect');
  Array.from(files).forEach(file => {
    const reader = new FileReader();
    reader.onload = (e) => {
      agentFileData[file.name] = e.target.result;
      const div = document.createElement('div');
      div.className = 'agent-file';
      div.innerHTML = `<div class="name">📄 ${file.name}</div><div class="size">${(file.size/1024).toFixed(1)}KB</div>`;
      container.appendChild(div);
      const opt = document.createElement('option');
      opt.value = file.name; opt.textContent = file.name;
      select.appendChild(opt);
    };
    reader.readAsText(file);
  });
}

async function askAgent() {
  const question = document.getElementById('agentQuestion').value.trim();
  if (!question) return;
  const fileName = document.getElementById('agentFileSelect').value;
  const fileContent = fileName ? agentFileData[fileName] || '' : '';
  const systemPrompt = fileContent
    ? `基于以下文件内容回答问题。文件: ${fileName}\n内容:\n${fileContent.substring(0, 3000)}`
    : '你是瑞微涵AI助手。';

  const result = document.getElementById('agentResult');
  result.style.display = 'block';
  result.textContent = '思考中...';

  try {
    const resp = await fetch('https://api.n1n.ai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer sk-ktAv8mWCMSM9vxap1MoyxYbYS1IqlHOY4kkt0sw07qhH3ymn' },
      body: JSON.stringify({
        model: 'gpt-4o-mini',
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: question }
        ],
        max_tokens: 1024
      })
    });
    const data = await resp.json();
    result.textContent = stripCodeFences(data.choices?.[0]?.message?.content || '无法获取回复');
  } catch (e) {
    result.textContent = '请求失败: ' + e.message;
  }
}

// Tuning
async function testTuning() {
  const input = document.getElementById('tuneInput').value.trim();
  if (!input) return;
  const model = document.getElementById('tuneModel').value;
  const temp = parseFloat(document.getElementById('tuneTemp').value);
  const maxTokens = parseInt(document.getElementById('tuneTokens').value);
  const topP = parseFloat(document.getElementById('tuneTopP').value);
  const freqPen = parseFloat(document.getElementById('tuneFreq').value);
  const sysPrompt = document.getElementById('tuneSystemPrompt').value;

  const result = document.getElementById('tuneResult');
  result.style.display = 'block';
  result.textContent = `正在用 ${model} (temp=${temp}, tokens=${maxTokens}) 测试...`;

  try {
    const resp = await fetch('https://api.n1n.ai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer sk-ktAv8mWCMSM9vxap1MoyxYbYS1IqlHOY4kkt0sw07qhH3ymn' },
      body: JSON.stringify({
        model, temperature: temp, max_tokens: maxTokens, top_p: topP, frequency_penalty: freqPen,
        messages: [
          { role: 'system', content: sysPrompt },
          { role: 'user', content: input }
        ]
      })
    });
    const data = await resp.json();
    result.textContent = stripCodeFences(data.choices?.[0]?.message?.content || '无法获取回复');
  } catch (e) {
    result.textContent = '请求失败: ' + e.message;
  }
}

// Training
let currentTrainScene = 'greeting';
let shotCount = 2;

function selectTrainCard(el, scene) {
  document.querySelectorAll('.train-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  currentTrainScene = scene;
}

function addFewShot() {
  shotCount++;
  const container = document.getElementById('fewShotExamples');
  const div = document.createElement('div');
  div.className = 'form-group';
  div.style.cssText = 'border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin-bottom:8px';
  div.innerHTML = `
    <label>用户输入 ${shotCount}</label>
    <input type="text" id="shot_user_${shotCount}" placeholder="用户说的话">
    <label style="margin-top:8px">AI回复 ${shotCount}</label>
    <input type="text" id="shot_ai_${shotCount}" placeholder="AI应该怎么回">
  `;
  container.appendChild(div);
}

async function trainAndTest() {
  const testInput = document.getElementById('trainTestInput').value.trim();
  if (!testInput) return;

  const btn = document.getElementById('btnTrain');
  btn.disabled = true;
  btn.textContent = '训练中...';

  // Collect few-shot examples
  const messages = [{ role: 'system', content: `你是瑞微涵AI助手，当前场景: ${currentTrainScene}。请按照示例风格回复。` }];
  for (let i = 1; i <= shotCount; i++) {
    const userEl = document.getElementById('shot_user_' + i);
    const aiEl = document.getElementById('shot_ai_' + i);
    if (userEl?.value?.trim()) messages.push({ role: 'user', content: userEl.value.trim() });
    if (aiEl?.value?.trim()) messages.push({ role: 'assistant', content: aiEl.value.trim() });
  }
  messages.push({ role: 'user', content: testInput });

  const result = document.getElementById('trainResult');
  result.style.display = 'block';
  result.textContent = '模型正在学习你的示例并生成回复...';

  try {
    const resp = await fetch('https://api.n1n.ai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer sk-ktAv8mWCMSM9vxap1MoyxYbYS1IqlHOY4kkt0sw07qhH3ymn' },
      body: JSON.stringify({ model: 'gpt-4o-mini', messages, max_tokens: 1024 })
    });
    const data = await resp.json();
    const reply = stripCodeFences(data.choices?.[0]?.message?.content || '无法生成回复');
    result.textContent = `✅ 训练完成！测试结果:\n\n用户: ${testInput}\nAI: ${reply}`;
    document.getElementById('trainDownloads').style.display = 'flex';
    window._lastTrainResult = { scene: currentTrainScene, messages, testInput, reply };
  } catch (e) {
    result.textContent = '训练失败: ' + e.message;
  }

  btn.disabled = false;
  btn.textContent = '🎯 训练并测试';
}

function downloadTraining(format) {
  const data = window._lastTrainResult;
  if (!data) return;
  let content, filename, type;

  if (format === 'json') {
    content = JSON.stringify(data, null, 2);
    filename = 'training_data.json';
    type = 'application/json';
  } else if (format === 'txt') {
    content = `场景: ${data.scene}\n测试输入: ${data.testInput}\nAI回复: ${data.reply}\n\n--- Few-Shot 示例 ---\n`;
    data.messages.forEach(m => { if (m.role !== 'system') content += `\n[${m.role}]: ${m.content}\n`; });
    filename = 'training_data.txt';
    type = 'text/plain';
  } else {
    content = `# 模型训练数据\n\n## 场景: ${data.scene}\n\n### 测试结果\n- **用户**: ${data.testInput}\n- **AI**: ${data.reply}\n\n### Few-Shot 示例\n`;
    data.messages.forEach(m => { if (m.role !== 'system') content += `- **${m.role}**: ${m.content}\n`; });
    filename = 'training_data.md';
    type = 'text/markdown';
  }

  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

function stripCodeFences(text) {
  return text.replace(/^```[\w]*\n?/gm, '').replace(/\n?```$/gm, '');
}
</script>
</body>
</html>
