<!DOCTYPE html>
<html>
<head><title>登录测试</title></head>
<body>
<h1>登录状态测试</h1>
<pre id="output"></pre>
<script src="auth.js"></script>
<script>
const output = document.getElementById('output');
output.textContent = JSON.stringify({
  sessionUser: sessionStorage.getItem('rui_user'),
  sessionUid: sessionStorage.getItem('rui_uid'),
  localUser: localStorage.getItem('rui_user_remember'),
  localUid: localStorage.getItem('rui_uid_remember'),
  expire: localStorage.getItem('rui_user_expire'),
  now: Date.now(),
  syncResult: syncLoginState()
}, null, 2);
</script>
</body>
</html>
