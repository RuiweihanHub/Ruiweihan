<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的 - Rui</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>* { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }</style>
</head>
<body class="min-h-screen bg-white text-gray-900 flex flex-col">
  
  <!-- 顶部导航栏 -->
  <nav class="w-full px-6 py-4">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-8">
        <a href="index.html" class="text-xl font-semibold text-gray-900 hover:text-violet-600 transition-colors">Rui</a>
        <div class="flex items-center gap-6 text-sm">
          <a href="projects.html" class="text-gray-500 hover:text-gray-900 transition-colors">项目</a>
          <a href="toolbox.html" class="text-gray-500 hover:text-gray-900 transition-colors">百宝箱</a>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <button id="loginBtn" class="px-4 py-1.5 bg-gray-900 text-white text-xs font-medium rounded-lg hover:bg-gray-800 transition-colors">登录</button>
        <div id="userMenu" class="hidden relative">
          <button id="userBtn" class="flex items-center gap-2 px-3 py-1.5 bg-gray-100 rounded-lg hover:bg-gray-200 transition-colors">
            <span id="userDisplayName" class="text-sm text-gray-700"></span>
            <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
          </button>
          <div id="dropdown" class="hidden absolute right-0 top-full mt-2 w-32 bg-white rounded-xl shadow-lg border border-gray-100 py-1 overflow-hidden">
            <a href="cloud.html" class="flex items-center gap-2 px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-colors">☁️ 云盘</a>
            <a href="profile.html" class="flex items-center gap-2 px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-colors bg-gray-50">👤 我的</a>
            <div class="border-t border-gray-100"></div>
            <a href="javascript:void(0)" onclick="logout()" class="flex items-center gap-2 px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors">退出登录</a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- 主内容 -->
  <main class="flex-1 px-6 py-12">
    <div class="max-w-4xl mx-auto">
      <h2 class="text-2xl font-semibold text-gray-900 mb-8">👤 我的</h2>
      
      <div class="bg-gray-50 rounded-2xl border border-gray-100 p-6 mb-6">
        <div class="flex items-center gap-4 mb-6">
          <div class="w-16 h-16 bg-gradient-to-br from-violet-500 to-purple-600 rounded-2xl flex items-center justify-center text-white text-2xl font-semibold">
            <span id="profileInitial">?</span>
          </div>
          <div>
            <h3 id="profileName" class="text-lg font-medium text-gray-900">请先登录</h3>
            <p class="text-sm text-gray-500">个人账户</p>
          </div>
        </div>
        <div class="space-y-4">
          <div class="flex items-center justify-between py-3 border-b border-gray-200">
            <span class="text-sm text-gray-600">账户类型</span>
            <span class="text-sm text-gray-900">普通用户</span>
          </div>
          <div class="flex items-center justify-between py-3 border-b border-gray-200">
            <span class="text-sm text-gray-600">存储空间</span>
            <span class="text-sm text-gray-900">0 MB / 100 MB</span>
          </div>
          <div class="flex items-center justify-between py-3">
            <span class="text-sm text-gray-600">注册时间</span>
            <span class="text-sm text-gray-900">-</span>
          </div>
        </div>
      </div>

      <div class="bg-gray-50 rounded-2xl border border-gray-100 p-6">
        <h3 class="text-lg font-medium text-gray-900 mb-4">快捷操作</h3>
        <div class="grid grid-cols-2 gap-3">
          <a href="cloud.html" class="flex items-center gap-3 p-4 bg-white rounded-xl border border-gray-100 hover:border-gray-200 transition-colors">
            <span class="text-xl">☁️</span>
            <span class="text-sm font-medium text-gray-700">我的云盘</span>
          </a>
          <a href="projects.html" class="flex items-center gap-3 p-4 bg-white rounded-xl border border-gray-100 hover:border-gray-200 transition-colors">
            <span class="text-xl">📁</span>
            <span class="text-sm font-medium text-gray-700">浏览项目</span>
          </a>
          <a href="toolbox.html" class="flex items-center gap-3 p-4 bg-white rounded-xl border border-gray-100 hover:border-gray-200 transition-colors">
            <span class="text-xl">📦</span>
            <span class="text-sm font-medium text-gray-700">百宝箱</span>
          </a>
          <button id="logoutBtn" onclick="logout()" class="hidden items-center gap-3 p-4 bg-white rounded-xl border border-gray-100 hover:border-red-200 hover:bg-red-50 transition-colors text-left">
            <span class="text-xl">🚪</span>
            <span class="text-sm font-medium text-red-600">退出登录</span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <footer class="w-full px-6 py-4">
    <div class="max-w-6xl mx-auto flex items-center justify-between text-xs text-gray-400">
      <span>© 2024 Rui</span>
      <div class="flex items-center gap-6">
        <a href="https://github.com/RuiweihanHub" target="_blank" class="hover:text-gray-600 transition-colors">GitHub</a>
      </div>
    </div>
  </footer>

  <!-- 登录弹窗 -->
  <div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/30 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm mx-4 overflow-hidden">
      <div class="p-6 border-b border-gray-100">
        <div class="flex items-center justify-between">
          <h2 class="text-lg font-semibold text-gray-900">登录</h2>
          <button id="closeBtn" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-gray-100 transition-colors"><svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg></button>
        </div>
      </div>
      <form id="authForm" class="p-6 space-y-4">
        <div id="errorMsg" class="hidden p-3 bg-red-50 border border-red-100 rounded-lg text-sm text-red-600"></div>
        <div id="successMsg" class="hidden p-3 bg-green-50 border border-green-100 rounded-lg text-sm text-green-600"></div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">用户名</label>
          <input id="username" type="text" placeholder="请输入用户名" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-gray-300 focus:bg-white transition-colors" required />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">密码</label>
          <input id="password" type="password" placeholder="请输入密码" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-gray-300 focus:bg-white transition-colors" required />
        </div>
        <div class="flex items-center gap-2">
          <input type="checkbox" id="rememberMe" class="w-4 h-4 rounded border-gray-300 text-gray-900 focus:ring-gray-500" />
          <label for="rememberMe" class="text-sm text-gray-600">保持登录（7天）</label>
        </div>
        <button type="submit" class="w-full py-2.5 bg-gray-900 text-white text-sm font-medium rounded-xl hover:bg-gray-800 disabled:opacity-50 transition-colors">登录</button>
      </form>
    </div>
  </div>

  <script>
    const USERS = { 'Xvjiarui': 'o7dyuk', 'Ruiweihan': '6052ni', 'Administrator': '1u98e9' };

    function hashPassword(password) {
      let hash = 0;
      for (let i = 0; i < password.length; i++) { hash = ((hash << 5) - hash) + password.charCodeAt(i); hash = hash & hash; }
      return Math.abs(hash).toString(36);
    }

    const modal = document.getElementById('modal');
    const loginBtn = document.getElementById('loginBtn');
    const userMenu = document.getElementById('userMenu');
    const userBtn = document.getElementById('userBtn');
    const dropdown = document.getElementById('dropdown');
    const closeBtn = document.getElementById('closeBtn');
    const authForm = document.getElementById('authForm');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const logoutBtn = document.getElementById('logoutBtn');

    function checkLogin() {
      const sessionUser = sessionStorage.getItem('rui_user');
      const rememberedUser = localStorage.getItem('rui_user_remember');
      if (sessionUser) showLoggedInState(sessionUser);
      else if (rememberedUser) {
        const expireTime = localStorage.getItem('rui_user_expire');
        if (expireTime && Date.now() < parseInt(expireTime)) { sessionStorage.setItem('rui_user', rememberedUser); showLoggedInState(rememberedUser); }
        else { localStorage.removeItem('rui_user_remember'); localStorage.removeItem('rui_user_expire'); }
      } else {
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      }
    }
    checkLogin();

    function showLoggedInState(username) {
      loginBtn.classList.add('hidden');
      userMenu.classList.remove('hidden');
      document.getElementById('userDisplayName').textContent = username;
      document.getElementById('profileName').textContent = username;
      document.getElementById('profileInitial').textContent = username.charAt(0).toUpperCase();
      logoutBtn.classList.remove('hidden');
      logoutBtn.classList.add('flex');
    }

    loginBtn.addEventListener('click', () => { modal.classList.remove('hidden'); modal.classList.add('flex'); });
    closeBtn.addEventListener('click', () => { modal.classList.add('hidden'); modal.classList.remove('flex'); errorMsg.classList.add('hidden'); });
    userBtn.addEventListener('click', (e) => { e.stopPropagation(); dropdown.classList.toggle('hidden'); });
    document.addEventListener('click', () => { dropdown.classList.add('hidden'); });

    authForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const username = usernameInput.value.trim();
      const password = passwordInput.value;
      const rememberMe = document.getElementById('rememberMe').checked;
      if (!username || !password) { showError('用户名和密码不能为空'); return; }
      if (USERS[username] && USERS[username] === hashPassword(password)) {
        sessionStorage.setItem('rui_user', username);
        if (rememberMe) { localStorage.setItem('rui_user_remember', username); localStorage.setItem('rui_user_expire', (Date.now() + 7 * 24 * 60 * 60 * 1000).toString()); }
        showSuccess('登录成功！');
        setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); showLoggedInState(username); }, 500);
      } else { showError('用户名或密码错误'); }
    });

    function logout() { sessionStorage.removeItem('rui_user'); localStorage.removeItem('rui_user_remember'); localStorage.removeItem('rui_user_expire'); window.location.href = 'index.html'; }
    function showError(msg) { errorMsg.textContent = msg; errorMsg.classList.remove('hidden'); successMsg.classList.add('hidden'); }
    function showSuccess(msg) { successMsg.textContent = msg; successMsg.classList.remove('hidden'); errorMsg.classList.add('hidden'); }
  </script>
</body>
</html>
