<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rui - 个人博客</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-white text-gray-900 flex flex-col">
  
  <!-- 顶部导航栏 -->
  <nav class="w-full px-6 py-4">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-8">
        <a href="index.html" class="text-xl font-semibold text-gray-900 hover:text-violet-600 transition-colors">Rui</a>
        <div class="flex items-center gap-6 text-sm">
          <a href="projects.html" class="text-gray-500 hover:text-gray-900 transition-colors">项目</a>
          <a href="toolbox.html" class="text-gray-500 hover:text-gray-900 transition-colors">百宝箱</a>
          <a href="download.html" class="text-gray-500 hover:text-gray-900 transition-colors">下载</a>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <button id="loginBtn" class="px-4 py-1.5 bg-gray-900 text-white text-xs font-medium rounded-lg hover:bg-gray-800 transition-colors">登录</button>
        <div id="userMenu" class="hidden relative">
          <button id="userBtn" class="flex items-center gap-2 px-3 py-1.5 bg-gray-100 rounded-lg hover:bg-gray-200 transition-colors">
            <span id="userDisplayName" class="text-sm text-gray-700"></span>
            <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
          </button>
          <div id="dropdown" class="hidden absolute right-0 top-full mt-2 w-32 bg-white rounded-xl shadow-lg border border-gray-100 py-1 overflow-hidden">
            <a href="cloud.html" class="flex items-center gap-2 px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z" /></svg>
              云盘
            </a>
            <a href="profile.html" class="flex items-center gap-2 px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
              我的
            </a>
            <div class="border-t border-gray-100"></div>
            <a href="javascript:void(0)" onclick="logout()" class="flex items-center gap-2 px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
              退出登录
            </a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- 公告栏 -->
  <div class="w-full px-6 py-2">
    <div class="max-w-6xl mx-auto flex items-center justify-center">
      <a href="javascript:void(0)" class="inline-flex items-center gap-2 text-xs text-gray-500 hover:text-gray-700 transition-colors">
        <span>🚀</span>
        <span>Wei语言公布最新Aurora版本，提升性能超300倍！</span>
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
      </a>
    </div>
  </div>

  <!-- 主内容区 -->
  <main class="flex-1 flex flex-col items-center justify-center px-6 py-12">
    <div class="text-center mb-8">
      <h1 class="text-5xl font-medium tracking-tight text-gray-900">Rui</h1>
    </div>

    <div class="w-full max-w-2xl mb-10">
      <div class="relative group">
        <div class="absolute inset-0 bg-gradient-to-r from-violet-500/10 to-purple-500/10 rounded-2xl blur-xl opacity-0 group-focus-within:opacity-100 transition-opacity duration-500"></div>
        <div class="relative flex items-center bg-gray-50 border border-gray-200 rounded-2xl overflow-visible focus-within:border-gray-300 focus-within:bg-white transition-all duration-300 shadow-sm">
          <svg class="w-5 h-5 text-gray-400 ml-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
          <input id="searchInput" type="text" placeholder="搜索项目..." class="flex-1 bg-transparent px-4 py-4 text-sm text-gray-900 placeholder-gray-400 outline-none" />
          <div class="relative mr-2">
            <button type="button" id="searchTypeBtn" onclick="toggleSearchMenu()" class="flex items-center gap-2 px-3 py-2 text-sm text-gray-600 hover:text-gray-900 bg-gray-100 hover:bg-gray-200 rounded-xl transition-colors">
              <span id="searchTypeText">项目</span>
              <svg id="searchArrow" class="w-4 h-4 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
            </button>
            <div id="searchTypeDropdown" class="hidden absolute right-0 top-full mt-2 w-40 bg-white rounded-xl shadow-xl border border-gray-200 py-2 z-[9999]">
              <div onclick="setSearchType('project')" class="flex items-center gap-2 px-4 py-3 text-sm text-gray-700 hover:bg-violet-50 hover:text-violet-700 cursor-pointer">
                <span>📁</span><span>项目</span>
              </div>
              <div onclick="setSearchType('github')" class="flex items-center gap-2 px-4 py-3 text-sm text-gray-700 hover:bg-violet-50 hover:text-violet-700 cursor-pointer">
                <span>💻</span><span>GitHub</span>
              </div>
              <div onclick="setSearchType('bing')" class="flex items-center gap-2 px-4 py-3 text-sm text-gray-700 hover:bg-violet-50 hover:text-violet-700 cursor-pointer">
                <span>🔍</span><span>Bing</span>
              </div>
              <div onclick="setSearchType('bilibili')" class="flex items-center gap-2 px-4 py-3 text-sm text-gray-700 hover:bg-violet-50 hover:text-violet-700 cursor-pointer">
                <span>📺</span><span>Bilibili</span>
              </div>
              <div onclick="setSearchType('rcmd')" class="flex items-center gap-2 px-4 py-3 text-sm text-gray-700 hover:bg-violet-50 hover:text-violet-700 cursor-pointer">
                <span>⚡</span><span>rCMD</span>
              </div>
            </div>
          </div>
          <button onclick="handleSearch()" class="mr-3 px-4 py-2 bg-gray-900 text-white text-sm font-medium rounded-xl hover:bg-gray-800 transition-colors">搜索</button>
        </div>
      </div>
    </div>

    <!-- 四个快捷入口 -->
    <div class="w-full max-w-2xl">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <a href="projects.html" class="flex flex-col items-center p-4 bg-gray-50 hover:bg-gray-100 rounded-xl border border-gray-100 hover:border-gray-200 transition-all duration-300 group">
          <span class="text-2xl mb-2">📁</span>
          <span class="text-sm font-medium text-gray-700 group-hover:text-gray-900">项目</span>
        </a>
        <a href="toolbox.html" class="flex flex-col items-center p-4 bg-gray-50 hover:bg-gray-100 rounded-xl border border-gray-100 hover:border-gray-200 transition-all duration-300 group">
          <span class="text-2xl mb-2">📦</span>
          <span class="text-sm font-medium text-gray-700 group-hover:text-gray-900">百宝箱</span>
        </a>
        <a href="cloud.html" class="flex flex-col items-center p-4 bg-gray-50 hover:bg-gray-100 rounded-xl border border-gray-100 hover:border-gray-200 transition-all duration-300 group">
          <span class="text-2xl mb-2">☁️</span>
          <span class="text-sm font-medium text-gray-700 group-hover:text-gray-900">云盘</span>
        </a>
        <a href="profile.html" class="flex flex-col items-center p-4 bg-gray-50 hover:bg-gray-100 rounded-xl border border-gray-100 hover:border-gray-200 transition-all duration-300 group">
          <span class="text-2xl mb-2">👤</span>
          <span class="text-sm font-medium text-gray-700 group-hover:text-gray-900">我的</span>
        </a>
      </div>
    </div>
  </main>

  <footer class="w-full px-6 py-4">
    <div class="max-w-6xl mx-auto flex items-center justify-between text-xs text-gray-400">
      <span>© 2024 Rui</span>
      <div class="flex items-center gap-6">
        <a href="https://github.com/RuiweihanHub" target="_blank" class="hover:text-gray-600 transition-colors">GitHub</a>
        <a href="javascript:void(0)" class="hover:text-gray-600 transition-colors">Twitter</a>
        <a href="javascript:void(0)" class="hover:text-gray-600 transition-colors">Email</a>
      </div>
    </div>
  </footer>

  <!-- 登录弹窗 -->
  <div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/30 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm mx-4 overflow-hidden">
      <div class="p-6 border-b border-gray-100">
        <div class="flex items-center justify-between">
          <h2 class="text-lg font-semibold text-gray-900">登录</h2>
          <button id="closeBtn" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-gray-100 transition-colors"><svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg></button>
        </div>
      </div>
      <form id="authForm" class="p-6 space-y-4">
        <div id="errorMsg" class="hidden p-3 bg-red-50 border border-red-100 rounded-lg text-sm text-red-600"></div>
        <div id="successMsg" class="hidden p-3 bg-green-50 border border-green-100 rounded-lg text-sm text-green-600"></div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">用户名</label>
          <input id="username" type="text" placeholder="请输入用户名" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-gray-300 focus:bg-white transition-colors" required />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">密码</label>
          <input id="password" type="password" placeholder="请输入密码" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-gray-300 focus:bg-white transition-colors" required />
        </div>
        <div class="flex items-center gap-2">
          <input type="checkbox" id="rememberMe" class="w-4 h-4 rounded border-gray-300 text-gray-900 focus:ring-gray-500" />
          <label for="rememberMe" class="text-sm text-gray-600">保持登录（7天）</label>
        </div>
        <button type="submit" class="w-full py-2.5 bg-gray-900 text-white text-sm font-medium rounded-xl hover:bg-gray-800 disabled:opacity-50 transition-colors">登录</button>
      </form>
    </div>
  </div>

  <script>
    const USERS = { 'Xvjiarui': 'o7dyuk', 'Ruiweihan': '6052ni', 'Administrator': '1u98e9' };

    function hashPassword(password) {
      let hash = 0;
      for (let i = 0; i < password.length; i++) { hash = ((hash << 5) - hash) + password.charCodeAt(i); hash = hash & hash; }
      return Math.abs(hash).toString(36);
    }

    const modal = document.getElementById('modal');
    const loginBtn = document.getElementById('loginBtn');
    const userMenu = document.getElementById('userMenu');
    const userBtn = document.getElementById('userBtn');
    const dropdown = document.getElementById('dropdown');
    const closeBtn = document.getElementById('closeBtn');
    const authForm = document.getElementById('authForm');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');

    function checkLogin() {
      const sessionUser = sessionStorage.getItem('rui_user');
      const rememberedUser = localStorage.getItem('rui_user_remember');
      if (sessionUser) showLoggedInState(sessionUser);
      else if (rememberedUser) {
        const expireTime = localStorage.getItem('rui_user_expire');
        if (expireTime && Date.now() < parseInt(expireTime)) { sessionStorage.setItem('rui_user', rememberedUser); showLoggedInState(rememberedUser); }
        else { localStorage.removeItem('rui_user_remember'); localStorage.removeItem('rui_user_expire'); }
      }
    }
    checkLogin();

    function showLoggedInState(username) {
      loginBtn.classList.add('hidden');
      userMenu.classList.remove('hidden');
      document.getElementById('userDisplayName').textContent = username;
    }

    loginBtn.addEventListener('click', () => { modal.classList.remove('hidden'); modal.classList.add('flex'); });
    closeBtn.addEventListener('click', () => { modal.classList.add('hidden'); modal.classList.remove('flex'); errorMsg.classList.add('hidden'); });
    userBtn.addEventListener('click', (e) => { e.stopPropagation(); dropdown.classList.toggle('hidden'); });
    document.addEventListener('click', () => { dropdown.classList.add('hidden'); });

    authForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const username = usernameInput.value.trim();
      const password = passwordInput.value;
      const rememberMe = document.getElementById('rememberMe').checked;
      if (!username || !password) { showError('用户名和密码不能为空'); return; }
      if (USERS[username] && USERS[username] === hashPassword(password)) {
        sessionStorage.setItem('rui_user', username);
        if (rememberMe) { localStorage.setItem('rui_user_remember', username); localStorage.setItem('rui_user_expire', (Date.now() + 7 * 24 * 60 * 60 * 1000).toString()); }
        showSuccess('登录成功！');
        setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); showLoggedInState(username); }, 500);
      } else { showError('用户名或密码错误'); }
    });

    function logout() { sessionStorage.removeItem('rui_user'); localStorage.removeItem('rui_user_remember'); localStorage.removeItem('rui_user_expire'); location.reload(); }
    function showError(msg) { errorMsg.textContent = msg; errorMsg.classList.remove('hidden'); successMsg.classList.add('hidden'); }
    function showSuccess(msg) { successMsg.textContent = msg; successMsg.classList.remove('hidden'); errorMsg.classList.add('hidden'); }

    // 搜索类型切换
    let currentSearchType = 'project';
    let searchMenuOpen = false;
    const searchTypeNames = { 'project': '项目', 'github': 'GitHub', 'bing': 'Bing', 'bilibili': 'Bilibili', 'rcmd': 'rCMD' };

    function toggleSearchMenu() {
      searchMenuOpen = !searchMenuOpen;
      var dropdown = document.getElementById('searchTypeDropdown');
      var arrow = document.getElementById('searchArrow');
      if (searchMenuOpen) {
        dropdown.classList.remove('hidden');
        arrow.style.transform = 'rotate(180deg)';
      } else {
        dropdown.classList.add('hidden');
        arrow.style.transform = 'rotate(0deg)';
      }
    }

    // 点击其他地方关闭菜单
    document.addEventListener('click', function(e) {
      var btn = document.getElementById('searchTypeBtn');
      if (btn && !btn.contains(e.target)) {
        searchMenuOpen = false;
        document.getElementById('searchTypeDropdown').classList.add('hidden');
        document.getElementById('searchArrow').style.transform = 'rotate(0deg)';
      }
    });

    function setSearchType(type) {
      currentSearchType = type;
      document.getElementById('searchTypeText').textContent = searchTypeNames[type];
      searchMenuOpen = false;
      document.getElementById('searchTypeDropdown').classList.add('hidden');
      document.getElementById('searchArrow').style.transform = 'rotate(0deg)';
      // 更新placeholder
      var placeholders = { 'project': '搜索项目...', 'github': '搜索GitHub项目...', 'bing': '搜索Bing...', 'bilibili': '搜索Bilibili视频...', 'rcmd': '输入指令（如：startmc）...' };
      document.getElementById('searchInput').placeholder = placeholders[type];
    }

    function handleSearch() {
      var query = document.getElementById('searchInput').value.trim();
      switch(currentSearchType) {
        case 'project':
          window.location.href = 'search.html?q=' + encodeURIComponent(query);
          break;
        case 'github':
          window.location.href = 'github-search.html?q=' + encodeURIComponent(query);
          break;
        case 'bing':
          window.open('https://www.bing.com/search?q=' + encodeURIComponent(query), '_blank');
          break;
        case 'bilibili':
          window.open('https://search.bilibili.com/all?keyword=' + encodeURIComponent(query), '_blank');
          break;
        case 'rcmd':
          executeRCMD(query);
          break;
      }
    }

    function executeRCMD(cmd) {
      const commands = {
        'startmc': () => { window.open('EC1.12.html', '_blank'); },
        'mc': () => { window.open('EC1.12.html', '_blank'); },
        'eaglercraft': () => { window.open('EC1.12.html', '_blank'); },
        'projects': () => { window.location.href = 'projects.html'; },
        'toolbox': () => { window.location.href = 'toolbox.html'; },
        'cloud': () => { window.location.href = 'cloud.html'; },
        'profile': () => { window.location.href = 'profile.html'; },
        'help': () => { alert('可用指令：\\nstartmc / mc - 启动Minecraft\\nprojects - 打开项目页面\\ntoolbox - 打开百宝箱\\ncloud - 打开云盘\\nprofile - 打开个人中心'); }
      };
      const lowerCmd = cmd.toLowerCase().replace(/\\s+/g, '');
      if (commands[lowerCmd]) {
        commands[lowerCmd]();
      } else {
        alert('未知指令: ' + cmd + '\\n输入 help 查看可用指令');
      }
    }

    // 回车搜索
    document.getElementById('searchInput').addEventListener('keypress', function(e) { 
      if (e.key === 'Enter') handleSearch(); 
    });
  </script>
</body>
</html>
