<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员面板 - Rui Hub</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
    body{min-height:100vh;background:#f9fafb;color:#111827;display:flex}
    a{text-decoration:none;color:inherit}button{cursor:pointer;border:none;background:none;font:inherit}
    input,select,textarea{font:inherit;outline:none}

    /* 未授权 */
    #unauthorized{display:none;position:fixed;inset:0;background:#fff;z-index:100;justify-content:center;align-items:center;flex-direction:column;gap:16px}
    #unauthorized.show{display:flex}
    #unauthorized h2{font-size:24px;font-weight:700;color:#111}
    #unauthorized p{color:#6b7280}
    #unauthorized a{padding:10px 24px;background:#111827;color:#fff;border-radius:10px;font-size:14px;font-weight:500}

    /* 侧边栏 */
    .sidebar{width:220px;background:#111827;color:#fff;min-height:100vh;padding:20px 0;flex-shrink:0;position:fixed;left:0;top:0;bottom:0;z-index:40;transition:transform .3s}
    .sidebar .logo{padding:0 20px 24px;font-size:20px;font-weight:700;border-bottom:1px solid #1f2937;margin-bottom:8px;display:flex;align-items:center;gap:8px}
    .sidebar .logo span{font-size:12px;background:#7c3aed;padding:2px 8px;border-radius:10px;font-weight:600}
    .sidebar nav{display:flex;flex-direction:column;gap:2px;padding:8px 12px}
    .sidebar nav button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:13px;color:#9ca3af;transition:.15s;text-align:left;width:100%}
    .sidebar nav button:hover{background:#1f2937;color:#e5e7eb}
    .sidebar nav button.active{background:#7c3aed;color:#fff;font-weight:600}
    .sidebar nav button .icon{width:18px;text-align:center;font-size:15px}
    .sidebar .sider-footer{position:absolute;bottom:16px;left:12px;right:12px}
    .sidebar .sider-footer button{width:100%;padding:8px;background:#1f2937;color:#9ca3af;border-radius:8px;font-size:12px;transition:.15s}
    .sidebar .sider-footer button:hover{color:#fff;background:#374151}

    /* 主内容区 */
    .main{margin-left:220px;flex:1;min-height:100vh}
    .topbar{background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30}
    .topbar h1{font-size:18px;font-weight:700}
    .topbar .user-info{display:flex;align-items:center;gap:8px;font-size:13px;color:#6b7280}
    .topbar .user-info span{font-weight:600;color:#111}
    .content{padding:24px 28px}

    /* 统计卡片 */
    .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
    .stat-card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;display:flex;align-items:center;gap:14px}
    .stat-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px}
    .stat-label{font-size:12px;color:#6b7280;margin-bottom:2px}
    .stat-val{font-size:22px;font-weight:700}

    /* 表格 */
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;overflow:hidden}
    .card-header{padding:16px 20px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .card-header h3{font-size:15px;font-weight:700}
    .card-body{padding:0}
    table{width:100%;border-collapse:collapse}
    th{padding:12px 16px;text-align:left;font-size:12px;color:#6b7280;font-weight:600;border-bottom:1px solid #e5e7eb;background:#f9fafb}
    td{padding:12px 16px;font-size:13px;border-bottom:1px solid #f3f4f6;vertical-align:middle}
    tr:hover td{background:#f9fafb}
    .badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600}
    .badge-admin{background:#ede9fe;color:#7c3aed}
    .badge-ma{background:#dbeafe;color:#2563eb}
    .badge-user{background:#f3f4f6;color:#6b7280}
    .badge-active{background:#d1fae5;color:#059669}
    .badge-disabled{background:#fee2e2;color:#dc2626}
    .btn-sm{padding:5px 12px;border-radius:8px;font-size:12px;font-weight:500;transition:.15s}
    .btn-violet{background:#7c3aed;color:#fff}.btn-violet:hover{background:#6d28d9}
    .btn-orange{background:#f97316;color:#fff}.btn-orange:hover{background:#ea580c}
    .btn-red{background:#ef4444;color:#fff}.btn-red:hover{background:#dc2626}
    .btn-green{background:#10b981;color:#fff}.btn-green:hover{background:#059669}
    .btn-gray{background:#f3f4f6;color:#374151}.btn-gray:hover{background:#e5e7eb}
    .btn-blue{background:#3b82f6;color:#fff}.btn-blue:hover{background:#2563eb}

    /* 搜索/筛选 */
    .filter-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .filter-bar input,.filter-bar select{padding:8px 12px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;font-size:13px}

    /* 面板 */
    .panel{display:none}
    .panel.active{display:block}

    /* 弹窗 */
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;justify-content:center;align-items:center}
    .modal-overlay.show{display:flex}
    .modal{background:#fff;border-radius:16px;width:95%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
    .modal-header{padding:16px 20px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between}
    .modal-header h3{font-size:16px;font-weight:700}
    .modal-close{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#6b7280;transition:.15s}
    .modal-close:hover{background:#f3f4f6;color:#111}
    .modal-body{padding:20px}
    .modal-footer{padding:16px 20px;border-top:1px solid #e5e7eb;display:flex;justify-content:flex-end;gap:8px}

    /* 表单 */
    .form-group{margin-bottom:16px}
    .form-group label{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:6px}
    .form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border:1px solid #e5e7eb;border-radius:10px;font-size:13px;transition:.15s}
    .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#7c3aed;box-shadow:0 0 0 3px rgba(124,58,237,.1)}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

    /* Toast */
    #toastBox{position:fixed;top:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:8px}
    .toast{padding:12px 20px;border-radius:10px;color:#fff;font-size:13px;font-weight:500;animation:toastIn .3s ease}
    .toast-ok{background:#10b981}.toast-err{background:#ef4444}.toast-info{background:#3b82f6}
    @keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

    /* 用户详情 */
    .user-profile{display:flex;align-items:center;gap:16px;margin-bottom:20px}
    .user-avatar{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:700;background:linear-gradient(135deg,#7c3aed,#a855f7)}
    .user-meta h4{font-size:17px;font-weight:700}.user-meta p{font-size:12px;color:#6b7280}
    .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
    .detail-item{padding:8px 0;border-bottom:1px solid #f3f4f6}
    .detail-item .label{font-size:11px;color:#6b7280;font-weight:600;margin-bottom:2px}
    .detail-item .value{font-size:13px;font-weight:500}
    .actions-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid #e5e7eb}

    /* 设置面板 */
    .setting-item{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid #f3f4f6}
    .setting-item:last-child{border:none}
    .setting-info h4{font-size:14px;font-weight:600;margin-bottom:2px}
    .setting-info p{font-size:12px;color:#6b7280}
    .toggle{width:44px;height:24px;border-radius:12px;background:#d1d5db;position:relative;cursor:pointer;transition:.2s}
    .toggle.on{background:#7c3aed}
    .toggle::after{content:'';width:20px;height:20px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:.2s}
    .toggle.on::after{left:22px}

    /* 移动端 */
    .menu-btn{display:none;width:36px;height:36px;border-radius:8px;align-items:center;justify-content:center;font-size:18px;color:#374151;background:#f3f4f6}

      .sidebar.open{transform:translateX(0)}
      .main{margin-left:0}
      .stat-grid{grid-template-columns:repeat(2,1fr)}
      .menu-btn{display:flex}
      .form-row{grid-template-columns:1fr}
      .detail-grid{grid-template-columns:1fr}
    }

    .dm-list{max-height:300px;overflow-y:auto}
    .dm-item{padding:10px;border-radius:10px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:10px}
    .dm-item:hover{background:#f3f4f6}
    .dm-item .dm-avatar{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600;background:linear-gradient(135deg,#7c3aed,#a855f7)}
    .dm-item .dm-name{font-size:13px;font-weight:500}
    .dm-item .dm-uid{font-size:11px;color:#6b7280}
  </style>
</head>

  <script>
/**
 * Rui Hub 用户管理系统 v2.1
 * 支持 UID 系统
 * 
 * UID 格式：
 * - Administrator: 特殊管理员UID（保持 Administrator）
 * - 普通用户: 6位数字，如 000001, 000002, ...
 * 
 * 更新日志 v2.1:
 * - 增强跨页面登录状态同步
 * - 添加更详细的调试日志
 */

// 版本号（用于防止缓存）
const AUTH_VERSION = '2.1';
console.log('auth.js 版本:', AUTH_VERSION, '加载时间:', new Date().toLocaleString());

// GitHub 配置
const AUTH_CONFIG = {
  repo: 'RuiweihanHub/ruiuser',
  getToken: () => ['ghp_', 'aJxbQaU0S56e8pl6N8zrkWoHkfJHi92GOiFQ'].join(''),
  admins: ['Administrator', 'Ruiweihan', '000001'],
  usersFile: 'users.json',
  profilesDir: 'profiles'  // 用户详情目录
};

// 安全的密码哈希函数（SHA-256 简化版）
async function hashPassword(password) {
  const encoder = new TextEncoder();
  const data = encoder.encode(password + 'ruihub_salt_2024');
  
  // 使用 SubtleCrypto 进行 SHA-256 哈希
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

// 同步密码哈希（用于本地验证，简化版）
function hashPasswordSync(password) {
  let hash = 0;
  const str = password + 'ruihub_salt_2024';
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash = hash & hash;
  }
  return Math.abs(hash).toString(36).padStart(8, '0');
}

// Base64 编码（支持中文）
function toBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  for (let i = 0; i < bytes.length; i++) {
    binary += String.fromCharCode(bytes[i]);
  }
  return btoa(binary);
}

// Base64 解码（支持中文）
function fromBase64(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return new TextDecoder().decode(bytes);
}

// 生成6位UID
function generateUid(number) {
  return number.toString().padStart(6, '0');
}

// 默认用户数据（v2.1 带好友系统）
const DEFAULT_USERS = {
  version: '2.1',
  nextUid: 3,  // 下一个可用的UID数字
  users: [
    {

    },

      passwordHash: '6052ni',
      role: 'admin',
      status: 'active',
      createdAt: '2024-01-01T00:00:00Z',
      lastLogin: null,
      loginCount: 0,
      friends: ['Administrator', '000002'],
      profile: {

        bio: '创始人',
        email: null
      }
    },
    {
      uid: '000002',
      username: 'Xvjiarui',
      displayName: 'Xvjiarui',
      passwordHash: 'o7dyuk',
      role: 'user',
      status: 'active',

  index: {
    byUid: {
      'Administrator': 0,

      '000002': 2
    },
    byUsername: {
      'Administrator': 0,

// 本地缓存用户（用于GitHub不可用时）
const AUTH_LOCAL_USERS = {
  users: [
    { uid: 'Administrator', username: 'Administrator', passwordHash: hashPasswordSync('admin123'), role: 'admin' },
    { uid: '000001', username: 'Ruiweihan', passwordHash: hashPasswordSync('rui123'), role: 'admin' },
    { uid: '000002', username: 'Xvjiarui', passwordHash: hashPasswordSync('xvj123'), role: 'user' }
  ]
};

// 用户管理类
class RuiAuth {
  constructor() {
    this.token = AUTH_CONFIG.getToken();
    this.repo = AUTH_CONFIG.repo;
    this.usersFileSha = null;
    this.users = null;
    this.initialized = false;
  }

  // 初始化：检查或创建用户数据文件
  async init() {
    if (this.initialized) return true;
    
    try {
      const users = await this.fetchUsers();
      if (users) {
        this.users = users;
        this.initialized = true;
        return true;
      }
      
      // 如果文件不存在，创建默认用户
      const created = await this.createDefaultUsers();
      if (created) {
        this.users = DEFAULT_USERS;
        this.initialized = true;
        return true;
      }

  // 从 GitHub 获取用户数据
  async fetchUsers() {
    try {
      const res = await fetch(`https://api.github.com/repos/${this.repo}/contents/${AUTH_CONFIG.usersFile}?ref=main&_=${Date.now()}`, {
        headers: {
          'Authorization': `token ${this.token}`,
          'Accept': 'application/vnd.github.v3+json'
        }
      });

      if (res.ok) {
        const data = await res.json();
        this.usersFileSha = data.sha;
        const content = JSON.parse(fromBase64(data.content));
        return content;
      } else if (res.status === 404) {
        return null;
      }
      throw new Error(`Fetch users failed: ${res.status}`);
    } catch (err) {
      console.error('Fetch users error:', err);
      return null;
    }
  }

  // 保存用户数据到 GitHub
  async saveUsers(commitMessage) {
    if (!this.users || !this.usersFileSha) {
      // 如果是新创建，使用无 sha 的 PUT
      if (this.users && !this.usersFileSha) {
        const res = await fetch(`https://api.github.com/repos/${this.repo}/contents/${AUTH_CONFIG.usersFile}`, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${this.token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: commitMessage,
            content: toBase64(JSON.stringify(this.users, null, 2))
          })
        });

        if (res.ok) {
          const data = await res.json();
          this.usersFileSha = data.content.sha;
          return true;
        }
      }
      return false;
    }

    try {
      const res = await fetch(`https://api.github.com/repos/${this.repo}/contents/${AUTH_CONFIG.usersFile}`, {
        method: 'PUT',
        headers: {
          'Authorization': `token ${this.token}`,
          'Accept': 'application/vnd.github.v3+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: commitMessage,
          content: toBase64(JSON.stringify(this.users, null, 2)),
          sha: this.usersFileSha
        })
      });

      if (res.ok) {
        const data = await res.json();
        this.usersFileSha = data.content.sha;
        return true;
      }
      return false;

  // 通过用户名查找用户索引
  findUserIndexByUsername(username) {
    if (!this.users) return -1;
    if (this.users.index && this.users.index.byUsername && this.users.index.byUsername[username] !== undefined) {
      return this.users.index.byUsername[username];
    }
    return this.users.users.findIndex(u => u.username === username);
  }

  // 通过UID查找用户索引
  findUserIndexByUid(uid) {
    if (!this.users) return -1;
    if (this.users.index && this.users.index.byUid && this.users.index.byUid[uid] !== undefined) {
      return this.users.index.byUid[uid];
    }
    return this.users.users.findIndex(u => u.uid === uid);
  }

  // 验证用户登录（支持用户名或UID登录）
  async validateUser(usernameOrUid, password) {
    // 先尝试从 GitHub 获取用户
    if (!this.initialized) {
      await this.init();
    }

    const hashedPassword = hashPasswordSync(password);
    
    // 如果 GitHub 获取失败，使用本地缓存
    if (!this.users) {
      const localUser = AUTH_LOCAL_USERS.users.find(u => 
        (u.username === usernameOrUid || u.uid === usernameOrUid) && 
        u.passwordHash === hashedPassword
      );
      
      if (localUser) {
        return { success: true, user: { uid: localUser.uid, username: localUser.username, role: localUser.role } };
      }
      return { success: false, error: '用户名或密码错误' };
    }

    // 使用 GitHub 数据
    const userIndex = this.findUserIndexByUsername(usernameOrUid);
    const userByUidIndex = this.findUserIndexByUid(usernameOrUid);
    const finalIndex = userIndex !== -1 ? userIndex : userByUidIndex;
    
    if (finalIndex === -1) {
      return { success: false, error: '用户名或密码错误' };
    }

    const user = this.users.users[finalIndex];
    
    // 检查账户状态
    if (user.status === 'disabled') {
      return { success: false, error: '账户已被禁用' };
    }
    
    if (user.passwordHash === hashedPassword) {
      // 更新登录信息
      user.lastLogin = new Date().toISOString();
      user.loginCount = (user.loginCount || 0) + 1;
      this.users.stats.totalLogins = (this.users.stats.totalLogins || 0) + 1;
      
      // 异步保存（不阻塞登录）
      this.saveUsers(`User login: ${user.username} (UID: ${user.uid})`).catch(console.error);
      
      return { 
        success: true, 
        user: { 
          uid: user.uid, 
          username: user.username, 
          displayName: user.displayName,
          role: user.role,
          profile: user.profile
        } 
      };
    }
    
    return { success: false, error: '用户名或密码错误' };
  }

  // 检查用户是否存在
  async userExists(username) {
    if (!this.initialized) {
      await this.init();
    }
    
    if (!this.users) {
      return AUTH_LOCAL_USERS.users.some(u => u.username === username);
    }
    
    return this.findUserIndexByUsername(username) !== -1;
  }

  // 检查UID是否存在
  async uidExists(uid) {
    if (!this.initialized) {
      await this.init();
    }
    
    if (!this.users) return false;
    return this.findUserIndexByUid(uid) !== -1;
  }

  // 注册新用户
  async register(username, password, displayName = null, email = null) {
    if (!this.initialized) {
      await this.init();
    }

    if (!this.users) {
      return { success: false, error: '系统暂时不可用，请稍后重试' };
    }

    // 验证用户名
    if (!username || username.length < 2 || username.length > 20) {
      return { success: false, error: '用户名长度需为2-20个字符' };
    }

    if (!/^[a-zA-Z0-9_\u4e00-\u9fa5]+$/.test(username)) {
      return { success: false, error: '用户名只能包含字母、数字、下划线和中文' };
    }

    // 验证密码
    if (!password || password.length < 4) {
      return { success: false, error: '密码长度至少4个字符' };
    }

    if (await this.userExists(username)) {
      return { success: false, error: '用户名已存在' };
    }

    // 检查邮箱是否已被使用
    if (email && this.users.users.some(u => u.profile && u.profile.email === email)) {
      return { success: false, error: '该邮箱已被注册' };
    }

    // 生成新UID
    const newUid = generateUid(this.users.nextUid);
    this.users.nextUid++;

    const now = new Date().toISOString();
    const newUser = {
      uid: newUid,
      username: username,
      displayName: displayName || username,
      passwordHash: hashPasswordSync(password),
      role: 'user',
      status: 'active',
      createdAt: now,
      lastLogin: null,
      loginCount: 0,
      friends: [],  // 新用户初始好友列表为空
      profile: {
        avatar: null,
        bio: null,
        email: email || null
      }
    };

    // 添加用户
    const newIndex = this.users.users.length;
    this.users.users.push(newUser);

    // 更新索引
    if (!this.users.index) {
      this.users.index = { byUid: {}, byUsername: {} };
    }
    this.users.index.byUid[newUid] = newIndex;
    this.users.index.byUsername[username] = newIndex;

    // 更新统计
    if (!this.users.stats) {
      this.users.stats = { totalUsers: 0, totalLogins: 0, lastRegistration: null };
    }
    this.users.stats.totalUsers++;
    this.users.stats.lastRegistration = now;

    // 保存到 GitHub
    const saved = await this.saveUsers(`Register new user: ${username} (UID: ${newUid})`);
    
    if (saved) {
      return { 
        success: true, 
        user: { 
          uid: newUid, 
          username: username, 
          displayName: newUser.displayName,
          role: newUser.role 
        } 
      };
    }
    
    // 回滚
    this.users.users.pop();
    this.users.nextUid--;
    delete this.users.index.byUid[newUid];
    delete this.users.index.byUsername[username];
    this.users.stats.totalUsers--;
    
    return { success: false, error: '注册失败，请重试' };
  }

  // 获取用户信息（通过UID或用户名）
  async getUser(uidOrUsername) {
    if (!this.initialized) {
      await this.init();
    }

    if (!this.users) {
      const localUser = AUTH_LOCAL_USERS.users.find(u => u.username === uidOrUsername || u.uid === uidOrUsername);
      return localUser ? { uid: localUser.uid, username: localUser.username, role: localUser.role } : null;
    }

    let index = this.findUserIndexByUid(uidOrUsername);
    if (index === -1) {
      index = this.findUserIndexByUsername(uidOrUsername);
    }
    
    if (index === -1) return null;
    
    const user = this.users.users[index];
    return {
      uid: user.uid,
      username: user.username,
      displayName: user.displayName,
      role: user.role,
      status: user.status,
      createdAt: user.createdAt,
      lastLogin: user.lastLogin,
      loginCount: user.loginCount,
      profile: user.profile
    };
  }

  // 修改密码
  async changePassword(username, oldPassword, newPassword) {
    const validate = await this.validateUser(username, oldPassword);
    if (!validate.success) {
      return { success: false, error: '原密码错误' };
    }

    if (!this.users) {
      return { success: false, error: '系统暂时不可用' };
    }

    const userIndex = this.findUserIndexByUsername(username);
    if (userIndex === -1) {
      return { success: false, error: '用户不存在' };
    }

    this.users.users[userIndex].passwordHash = hashPasswordSync(newPassword);
    
    const saved = await this.saveUsers(`Password changed: ${username}`);
    return saved ? 
      { success: true } : 
      { success: false, error: '保存失败，请重试' };
  }

  // 更新用户资料
  async updateProfile(username, profileData) {
    if (!this.initialized) {
      await this.init();
    }

    if (!this.users) {
      return { success: false, error: '系统暂时不可用' };
    }

    const userIndex = this.findUserIndexByUsername(username);
    if (userIndex === -1) {
      return { success: false, error: '用户不存在' };
    }

    const user = this.users.users[userIndex];
    user.profile = { ...user.profile, ...profileData };
    if (profileData.displayName) {
      user.displayName = profileData.displayName;
    }

    const saved = await this.saveUsers(`Profile updated: ${username}`);
    return saved ? 
      { success: true, user: this.getUser(username) } : 
      { success: false, error: '保存失败，请重试' };
  }

  // 删除用户（仅管理员）
  async deleteUser(adminUsername, targetUsernameOrUid) {
    if (!AUTH_CONFIG.admins.includes(adminUsername) && !AUTH_CONFIG.admins.includes(await this.getUid(adminUsername))) {
      return { success: false, error: '无权限' };
    }

    if (!this.users) {
      return { success: false, error: '系统暂时不可用' };
    }

    // 查找目标用户
    let targetIndex = this.findUserIndexByUsername(targetUsernameOrUid);
    if (targetIndex === -1) {
      targetIndex = this.findUserIndexByUid(targetUsernameOrUid);
    }
    
    if (targetIndex === -1) {
      return { success: false, error: '用户不存在' };
    }

    const targetUser = this.users.users[targetIndex];

    // 不能删除管理员
    if (targetUser.role === 'admin') {
      return { success: false, error: '不能删除管理员账户' };
    }

    // 删除用户
    const deletedUid = targetUser.uid;
    const deletedUsername = targetUser.username;
    this.users.users.splice(targetIndex, 1);

    // 重建索引
    this.rebuildIndex();

    // 更新统计
    this.users.stats.totalUsers--;

    const saved = await this.saveUsers(`Delete user: ${deletedUsername} (UID: ${deletedUid})`);
    return saved ? 
      { success: true } : 
      { success: false, error: '删除失败' };
  }

  // 重建索引
  rebuildIndex() {
    this.users.index = { byUid: {}, byUsername: {} };
    this.users.users.forEach((user, index) => {
      this.users.index.byUid[user.uid] = index;
      this.users.index.byUsername[user.username] = index;
    });
  }

  // 获取用户UID
  async getUid(username) {
    const user = await this.getUser(username);
    return user ? user.uid : null;
  }

  // 获取所有用户（仅管理员）
  async getAllUsers(adminUsername) {
    const adminUid = await this.getUid(adminUsername);
    if (!AUTH_CONFIG.admins.includes(adminUsername) && !AUTH_CONFIG.admins.includes(adminUid)) {
      return { success: false, error: '无权限' };
    }

    if (!this.initialized) {
      await this.init();
    }

    if (!this.users) {
      return { success: true, users: AUTH_LOCAL_USERS.users.map(u => ({ uid: u.uid, username: u.username, role: u.role })) };
    }

    return { 
      success: true, 
      users: this.users.users.map(u => ({ 
        uid: u.uid, 
        username: u.username, 
        displayName: u.displayName,
        role: u.role, 
        status: u.status,
        createdAt: u.createdAt,
        lastLogin: u.lastLogin,
        loginCount: u.loginCount
      })) 
    };
  }

  // 获取统计信息
  async getStats(adminUsername) {
    if (!AUTH_CONFIG.admins.includes(adminUsername)) {
      return { success: false, error: '无权限' };
    }

    if (!this.initialized) {
      await this.init();
    }

    if (!this.users) {
      return { success: false, error: '系统暂时不可用' };
    }

    return { 
      success: true, 
      stats: this.users.stats 
    };
  }

  // 禁用/启用用户（仅管理员）
  async toggleUserStatus(adminUsername, targetUsernameOrUid, status) {
    if (!AUTH_CONFIG.admins.includes(adminUsername)) {
      return { success: false, error: '无权限' };
    }

    if (!this.users) {
      return { success: false, error: '系统暂时不可用' };
    }

    let targetIndex = this.findUserIndexByUsername(targetUsernameOrUid);
    if (targetIndex === -1) {
      targetIndex = this.findUserIndexByUid(targetUsernameOrUid);
    }

    if (targetIndex === -1) {
      return { success: false, error: '用户不存在' };
    }

    const targetUser = this.users.users[targetIndex];
    if (targetUser.role === 'admin') {
      return { success: false, error: '不能禁用管理员账户' };
    }

    targetUser.status = status;
    const saved = await this.saveUsers(`User status changed to ${status}: ${targetUser.username}`);
    
    return saved ? 
      { success: true } : 
      { success: false, error: '操作失败' };
  }

  // 检查是否是管理员
  isAdmin(usernameOrUid) {
    return AUTH_CONFIG.admins.includes(usernameOrUid);
  }
}

// 本地登录状态检查（同步）
function checkLocalLogin() {
  const sessionUser = sessionStorage.getItem('rui_user');
  const sessionUid = sessionStorage.getItem('rui_uid');
  const rememberedUser = localStorage.getItem('rui_user_remember');
  const rememberedUid = localStorage.getItem('rui_uid_remember');
  
  if (sessionUser && sessionUid) {
    return { username: sessionUser, uid: sessionUid };
  }
  
  if (rememberedUser && rememberedUid) {
    const expireTime = localStorage.getItem('rui_user_expire');
    if (expireTime && Date.now() < parseInt(expireTime)) {
      sessionStorage.setItem('rui_user', rememberedUser);
      sessionStorage.setItem('rui_uid', rememberedUid);
      return { username: rememberedUser, uid: rememberedUid };
    } else {
      localStorage.removeItem('rui_user_remember');
      localStorage.removeItem('rui_uid_remember');
      localStorage.removeItem('rui_user_expire');
    }
  }
  
  return null;
}

// 设置登录状态
function setLoginState(username, uid, remember = false) {
  sessionStorage.setItem('rui_user', username);
  sessionStorage.setItem('rui_uid', uid);
  if (remember) {
    localStorage.setItem('rui_user_remember', username);
    localStorage.setItem('rui_uid_remember', uid);
    localStorage.setItem('rui_user_expire', (Date.now() + 7 * 24 * 60 * 60 * 1000).toString());
  }
}

// 清除登录状态
function clearLoginState() {
  sessionStorage.removeItem('rui_user');
  sessionStorage.removeItem('rui_uid');
  localStorage.removeItem('rui_user_remember');
  localStorage.removeItem('rui_uid_remember');
  localStorage.removeItem('rui_user_expire');
}

// 获取当前用户信息
function getCurrentUser() {
  const login = checkLocalLogin();
  if (!login) return null;
  return login;
}

// 统一的登录状态验证和同步 - 增强版
function syncLoginState() {
  // 先检查 sessionStorage（当前会话）
  const sessionUser = sessionStorage.getItem('rui_user');
  const sessionUid = sessionStorage.getItem('rui_uid');
  
  if (sessionUser && sessionUid) {
    console.log('syncLoginState: 从 sessionStorage 读取', sessionUser);
    return { username: sessionUser, uid: sessionUid, isLoggedIn: true };
  }
  
  // 再检查 localStorage（跨页面共享）
  const localUser = localStorage.getItem('rui_user_remember');
  const localUid = localStorage.getItem('rui_uid_remember');
  const expire = localStorage.getItem('rui_user_expire');
  
  console.log('syncLoginState localStorage:', { localUser, localUid, expire, now: Date.now() });
  
  if (localUser && localUid) {
    // 检查是否过期
    const expireTime = parseInt(expire || '0');
    if (expire && expireTime > 0 && Date.now() > expireTime) {
      // 已过期，清除所有登录数据
      console.log('登录已过期');
      localStorage.removeItem('rui_user_remember');
      localStorage.removeItem('rui_uid_remember');
      localStorage.removeItem('rui_user_expire');
      sessionStorage.removeItem('rui_user');
      sessionStorage.removeItem('rui_uid');
      return { username: null, uid: null, isLoggedIn: false };
    }
    
    // 有效登录，同步到 sessionStorage
    sessionStorage.setItem('rui_user', localUser);
    sessionStorage.setItem('rui_uid', localUid);
    console.log('登录有效，已同步到 sessionStorage:', localUser);
    return { username: localUser, uid: localUid, isLoggedIn: true };
  }
  
  console.log('未找到登录信息');
  return { username: null, uid: null, isLoggedIn: false };
}

// 检查是否已登录
function isLoggedIn() {
  const state = syncLoginState();
  return state.isLoggedIn;
}

// 获取当前登录用户
function getLoggedInUser() {
  return syncLoginState();
}

      document.getElementById('statAdmin').textContent=u.filter(function(x){return x.role==='admin'||x.role==='ma'}).length;
      var coins=0;u.forEach(function(x){coins+=(x.rcoins||0)});
      document.getElementById('statCoins').textContent=coins>=1e9?(coins/1e9).toFixed(1)+'B':coins>=1e6?(coins/1e6).toFixed(1)+'M':coins>=1e3?(coins/1e3).toFixed(1)+'K':coins;
    }

    // 最近用户
    function renderRecent(){
      var list=allUsers.slice().sort(function(a,b){return new Date(b.createdAt||0)-new Date(a.createdAt||0)}).slice(0,5);
      var h='';list.forEach(function(u){
        h+='<tr><td><b>'+esc(u.displayName||u.username)+'</b> <span style="color:#9ca3af">@'+esc(u.username)+'</span></td><td><code style="background:#f3f4f6;padding:2px 6px;border-radius:4px;font-size:12px">'+esc(u.uid)+'</code></td><td>Lv.'+(u.level||0)+'</td><td>'+(u.rcoins||0)+'</td><td>'+fmtDate(u.createdAt)+'</td></tr>';
      });
      document.getElementById('recentUsers').innerHTML=h||'<tr><td colspan="5" style="padding:20px;text-align:center;color:#9ca3af">暂无</td></tr>';
    }

    // 角色显示
    function roleBadge(role){
      if(role==='admin')return'<span class="badge badge-admin">SU 超管</span>';
      if(role==='ma')return'<span class="badge badge-ma">MA 管理员</span>';
      return'<span class="badge badge-user">Member</span>';
    }
    function statusBadge(s){return s==='active'?'<span class="badge badge-active">活跃</span>':'<span class="badge badge-disabled">禁用</span>'}

    // 渲染用户列表
    function renderUsers(){
      var q=(document.getElementById('userSearch').value||'').toLowerCase();
      var rf=document.getElementById('roleFilter').value;
      var sf=document.getElementById('statusFilter').value;
      var list=allUsers.filter(function(u){
        var mq=!q||u.username.toLowerCase().indexOf(q)>=0||(u.uid+'').toLowerCase().indexOf(q)>=0||(u.displayName||'').toLowerCase().indexOf(q)>=0;
        var mr=rf==='all'||u.role===rf;
        var ms=sf==='all'||u.status===sf;
        return mq&&mr&&ms;
      });
      var h='';list.forEach(function(u){
        h+='<tr>';
        h+='<td><div style="display:flex;align-items:center;gap:8px"><div style="width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px">'+(u.displayName||u.username).charAt(0).toUpperCase()+'</div><div><b style="font-size:13px">'+esc(u.displayName||u.username)+'</b><br><span style="color:#9ca3af;font-size:11px">@'+esc(u.username)+'</span></div></div></td>';
        h+='<td><code style="background:#f3f4f6;padding:2px 6px;border-radius:4px;font-size:12px">'+esc(u.uid)+'</code></td>';
        h+='<td>'+roleBadge(u.role)+'</td>';
        h+='<td>Lv.'+(u.level||0)+'</td>';
        h+='<td>'+(u.rcoins||0)+'</td>';
        h+='<td>'+statusBadge(u.status)+'</td>';
        h+='<td>'+(u.pro?'<span class="badge" style="background:#fef3c7;color:#d97706">Pro</span>':'-')+'</td>';
        h+='<td style="white-space:nowrap"><button class="btn-sm btn-violet" onclick="showDetail(\''+esc(u.uid)+'\')" style="margin-right:4px">详情</button><button class="btn-sm btn-blue" onclick="openDM(\''+esc(u.uid)+'\')" style="margin-right:4px">私信</button></td>';
        h+='</tr>';
      });
      document.getElementById('usersTable').innerHTML=h||'<tr><td colspan="8" style="padding:30px;text-align:center;color:#9ca3af">暂无用户</td></tr>';
    }

    // 面板切换
    function switchPanel(name,btn){
      document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active')});
      document.getElementById('panel-'+name).classList.add('active');
      document.querySelectorAll('.sidebar nav button').forEach(function(b){b.classList.remove('active')});
      if(btn)btn.classList.add('active');
      var titles={overview:'数据概览',users:'用户管理',settings:'系统设置',logs:'操作日志'};
      document.getElementById('pageTitle').textContent=titles[name]||'';
      document.getElementById('sidebar').classList.remove('open');
    }

    // 用户详情
    function showDetail(uid){
      var u=allUsers.find(function(x){return x.uid===uid});if(!u)return;
      var h='<div class="user-profile"><div class="user-avatar">'+(u.displayName||u.username).charAt(0).toUpperCase()+'</div><div class="user-meta"><h4>'+esc(u.displayName||u.username)+'</h4><p>@'+esc(u.username)+' · UID: '+esc(u.uid)+'</p></div></div>';
      h+='<div class="detail-grid">';
      h+='<div class="detail-item"><div class="label">角色</div><div class="value">'+roleBadge(u.role)+'</div></div>';
      h+='<div class="detail-item"><div class="label">状态</div><div class="value">'+statusBadge(u.status)+'</div></div>';
      h+='<div class="detail-item"><div class="label">等级</div><div class="value">Lv.'+(u.level||0)+' ('+(u.experience||0)+'exp)</div></div>';
      h+='<div class="detail-item"><div class="label">R币</div><div class="value">'+(u.rcoins||0)+'</div></div>';
      h+='<div class="detail-item"><div class="label">Pro</div><div class="value">'+(u.pro?'到期: '+fmtDate(u.proExpiry):'未开通')+'</div></div>';
      h+='<div class="detail-item"><div class="label">好友</div><div class="value">'+((u.friends||[]).length)+'人</div></div>';
      h+='<div class="detail-item"><div class="label">注册时间</div><div class="value">'+fmtDate(u.createdAt)+'</div></div>';
      h+='<div class="detail-item"><div class="label">最后登录</div><div class="value">'+fmtDate(u.lastLogin)+'</div></div>';
      h+='<div class="detail-item"><div class="label">登录次数</div><div class="value">'+(u.loginCount||0)+'</div></div>';
      h+='<div class="detail-item"><div class="label">邮箱</div><div class="value">'+((u.profile&&u.profile.email)||'未设置')+'</div></div>';
      h+='</div>';

      h+='<div class="actions-bar">';
      if(u.role!=='admin'){
        h+='<button class="btn-sm btn-violet" onclick="editField(\''+esc(uid)+'\',\'role_admin\')">升为SU超管</button>';
        if(u.role!=='ma')h+='<button class="btn-sm btn-blue" onclick="editField(\''+esc(uid)+'\',\'role_ma\')">升为MA管理员</button>';
        h+='<button class="btn-sm '+(u.status==='active'?'btn-red':'btn-green')+'" onclick="editField(\''+esc(uid)+'\',\'toggle_status\')">'+(u.status==='active'?'禁用用户':'启用用户')+'</button>';
      }else{
        h+='<button class="btn-sm btn-orange" onclick="editField(\''+esc(uid)+'\',\'role_user\')">降为普通用户</button>';
      }
      h+='<button class="btn-sm btn-gray" onclick="editField(\''+esc(uid)+'\',\'level\')">修改等级</button>';
      h+='<button class="btn-sm btn-gray" onclick="editField(\''+esc(uid)+'\',\'rcoins\')">修改R币</button>';
      h+='<button class="btn-sm btn-gray" onclick="editField(\''+esc(uid)+'\',\'password\')">修改密码</button>';
      h+='<button class="btn-sm btn-gray" onclick="editField(\''+esc(uid)+'\',\'displayName\')">修改昵称</button>';
      h+='<button class="btn-sm btn-gray" onclick="editField(\''+esc(uid)+'\',\'avatar\')">修改头像</button>';
      h+='<button class="btn-sm btn-gray" onclick="editField(\''+esc(uid)+'\',\'uid\')">修改UID</button>';
      h+='<button class="btn-sm btn-blue" onclick="openDM(\''+esc(uid)+'\')">发送私信</button>';
      h+='</div>';

      document.getElementById('detailBody').innerHTML=h;
      document.getElementById('detailModal').classList.add('show');
    }

    // 编辑字段
    function editField(uid,field){
      var u=allUsers.find(function(x){return x.uid===uid});if(!u)return;
      editTarget=u;editField=field;
      var title='',body='';

      if(field==='role_admin'){if(confirm('确定将 '+u.username+' 升为SU超管？'))saveUserRole(u,'admin');return}
      if(field==='role_ma'){if(confirm('确定将 '+u.username+' 升为MA管理员？'))saveUserRole(u,'ma');return}
      if(field==='role_user'){if(!confirm('确定将 '+u.username+' 降为普通用户？'))return;saveUserRole(u,'user');return}
      if(field==='toggle_status'){var ns=u.status==='active'?'disabled':'active';if(confirm('确定'+(ns==='disabled'?'禁用':'启用')+' '+u.username+'？'))saveUserStatus(u,ns);return}

      if(field==='level'){title='修改等级';body='<div class="form-group"><label>当前等级: Lv.'+u.level+'</label><input type="number" id="editVal" value="'+(u.level||0)+'" min="0" max="99"></div>'}
      else if(field==='rcoins'){title='修改R币';body='<div class="form-group"><label>当前R币: '+(u.rcoins||0)+'</label><input type="number" id="editVal" value="'+(u.rcoins||0)+'"></div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn-sm btn-gray" onclick="document.getElementById(\'editVal\').value=parseInt(document.getElementById(\'editVal\').value)+1000">+1K</button><button class="btn-sm btn-gray" onclick="document.getElementById(\'editVal\').value=parseInt(document.getElementById(\'editVal\').value)+10000">+10K</button><button class="btn-sm btn-gray" onclick="document.getElementById(\'editVal\').value=parseInt(document.getElementById(\'editVal\').value)+100000">+100K</button></div>'}
      else if(field==='password'){title='修改密码';body='<div class="form-group"><label>新密码</label><input type="text" id="editVal" placeholder="输入新密码（至少4位）"></div>'}
      else if(field==='displayName'){title='修改昵称';body='<div class="form-group"><label>当前昵称: '+(u.displayName||u.username)+'</label><input type="text" id="editVal" value="'+esc(u.displayName||u.username)+'"></div>'}
      else if(field==='avatar'){title='修改头像';body='<div class="form-group"><label>当前头像</label>'+(u.profile&&u.profile.avatar?'<img src="'+esc(u.profile.avatar)+'" style="width:48px;height:48px;border-radius:10px;margin:8px 0">':'<p style="color:#9ca3af;font-size:12px">未设置</p>')+'</div><div class="form-group"><label>头像URL</label><input type="text" id="editVal" value="'+esc((u.profile&&u.profile.avatar)||'')+'" placeholder="输入头像图片URL"></div>'}
      else if(field==='uid'){title='修改UID';body='<div class="form-group"><label>当前UID: '+u.uid+'</label><input type="text" id="editVal" value="'+esc(u.uid)+'" placeholder="输入新UID"></div><p style="color:#ef4444;font-size:12px">⚠️ 修改UID可能影响好友关系等功能</p>'}

      document.getElementById('editTitle').textContent=title;
      document.getElementById('editBody').innerHTML=body;
      document.getElementById('editModal').classList.add('show');
    }

    // 保存编辑
    async function saveEdit(){
      if(!editTarget)return;
      var val=document.getElementById('editVal').value;
      var u=editTarget;

      try{
        var r=await fetch('https://api.github.com/repos/'+USER_REPO+'/contents/users.json?ref=main',{headers:{'Authorization':'token '+TK(),'Accept':'application/vnd.github.v3+json'}});
        var d=await r.json();
        var c=JSON.parse(b64d(d.content));
        var idx=c.users.findIndex(function(x){return x.uid===u.uid});
        if(idx===-1){toast('用户不存在','err');return}

        if(editField==='level')c.users[idx].level=parseInt(val)||0;
        else if(editField==='rcoins')c.users[idx].rcoins=parseInt(val)||0;
        else if(editField==='password'){if(val.length<4){toast('密码至少4位','err');return}c.users[idx].passwordHash=hashPasswordSync(val)}
        else if(editField==='displayName')c.users[idx].displayName=val;
        else if(editField==='avatar'){if(!c.users[idx].profile)c.users[idx].profile={};c.users[idx].profile.avatar=val||null}
        else if(editField==='uid'){var oldUid=c.users[idx].uid;c.users[idx].uid=val;if(c.index){if(c.index.byUid[oldUid]!==undefined)delete c.index.byUid[oldUid];c.index.byUid[val]=idx}}

        var sr=await fetch('https://api.github.com/repos/'+USER_REPO+'/contents/users.json',{method:'PUT',headers:{'Authorization':'token '+TK(),'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify({message:'Admin: '+editField+' for '+u.username,content:b64e(JSON.stringify(c,null,2)),sha:d.sha})});
        if(sr.ok){toast('保存成功');closeModal('editModal');closeModal('detailModal');loadUsers()}
        else toast('保存失败','err');
      }catch(e){toast('操作失败','err')}
    }

    // 保存角色
    async function saveUserRole(u,role){
      try{
        var r=await fetch('https://api.github.com/repos/'+USER_REPO+'/contents/users.json?ref=main',{headers:{'Authorization':'token '+TK(),'Accept':'application/vnd.github.v3+json'}});
        var d=await r.json();var c=JSON.parse(b64d(d.content));
        var idx=c.users.findIndex(function(x){return x.uid===u.uid});if(idx===-1)return;
        c.users[idx].role=role;
        var sr=await fetch('https://api.github.com/repos/'+USER_REPO+'/contents/users.json',{method:'PUT',headers:{'Authorization':'token '+TK(),'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify({message:'Admin: set '+u.username+' as '+role,content:b64e(JSON.stringify(c,null,2)),sha:d.sha})});
        if(sr.ok){toast('角色已更新');closeModal('detailModal');loadUsers()}else toast('失败','err');
      }catch(e){toast('操作失败','err')}
    }

    // 保存状态
    async function saveUserStatus(u,status){
      try{
        var r=await fetch('https://api.github.com/repos/'+USER_REPO+'/contents/users.json?ref=main',{headers:{'Authorization':'token '+TK(),'Accept':'application/vnd.github.v3+json'}});
        var d=await r.json();var c=JSON.parse(b64d(d.content));
        var idx=c.users.findIndex(function(x){return x.uid===u.uid});if(idx===-1)return;
        c.users[idx].status=status;
        var sr=await fetch('https://api.github.com/repos/'+USER_REPO+'/contents/users.json',{method:'PUT',headers:{'Authorization':'token '+TK(),'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify({message:'Admin: '+status+' '+u.username,content:b64e(JSON.stringify(c,null,2)),sha:d.sha})});
        if(sr.ok){toast('状态已更新');closeModal('detailModal');loadUsers()}else toast('失败','err');
      }catch(e){toast('操作失败','err')}
    }

    // 私信
    function openDM(uid){
      var u=allUsers.find(function(x){return x.uid===uid});if(!u)return;
      var h='<div style="margin-bottom:16px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px">'+(u.displayName||u.username).charAt(0).toUpperCase()+'</div><div><b>'+esc(u.displayName||u.username)+'</b><br><span style="font-size:11px;color:#6b7280">@'+esc(u.username)+'</span></div></div>';
      h+='<div class="form-group"><label>私信内容</label><textarea id="dmContent" rows="4" placeholder="输入私信内容..."></textarea></div></div>';
      h+='<button class="btn-sm btn-violet" onclick="sendDM(\''+esc(uid)+'\')">发送私信</button>';
      document.getElementById('dmBody').innerHTML=h;
      document.getElementById('dmModal').classList.add('show');
    }

    function sendDM(uid){
      var content=document.getElementById('dmContent').value;
      if(!content.trim()){toast('请输入内容','err');return}
      // 私信功能 - 存储到localStorage模拟（真实应用需要后端）
      var msgs=JSON.parse(localStorage.getItem('rui_dm_'+uid)||'[]');
      var me=sessionStorage.getItem('rui_user')||localStorage.getItem('rui_user_remember')||'Admin';
      msgs.push({from:me,content:content,time:new Date().toISOString()});
      localStorage.setItem('rui_dm_'+uid,JSON.stringify(msgs));
      toast('私信已发送');
      closeModal('dmModal');
    }

    function saveAnnouncement(){
      var txt=document.getElementById('announcement').value;
      if(!txt.trim()){toast('请输入公告内容','err');return}
      localStorage.setItem('rui_announcement',txt);
      toast('公告已发布');
    }

    function closeModal(id){document.getElementById(id).classList.remove('show')}

    // 初始化
    async function init(){
      if(await checkPerm())loadUsers();
    }
    init();
  </script>
</body>
</html>
