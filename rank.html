    .umenu{position:relative;display:flex;align-items:center;gap:8px}
    .ubtn{display:flex;align-items:center;gap:6px;padding:6px 12px;background:#f3f4f6;border-radius:8px;font-size:13px;color:#374151;transition:.15s}.ubtn:hover{background:#e5e7eb}

    .stat-card.gold .num{color:#b45309}
    .stat-card.blue{background:linear-gradient(135deg,#eff6ff,#f0f9ff);border-color:#bfdbfe}

    .user-cell{display:flex;align-items:center;gap:10px}
    .user-av{width:32px;height:32px;border-radius:10px;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#6b7280}
    .user-name{font-weight:600;color:#111827}
    .user-uid{font-size:10px;color:#9ca3af;font-family:monospace}
    .score-bar{display:flex;align-items:center;gap:8px}
    .bar-track{flex:1;height:6px;background:#f3f4f6;border-radius:3px;overflow:hidden}
    .bar-fill{height:100%;border-radius:3px;transition:width .6s ease}
    .bar-score{font-size:12px;font-weight:700;min-width:40px;text-align:right}

    /* Achievements */
    .ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
    .ach-card{background:#f9fafb;border:1px solid #f3f4f6;border-radius:14px;padding:16px;display:flex;gap:12px;align-items:flex-start;transition:.15s}
    .ach-card:hover{border-color:#e5e7eb;box-shadow:0 2px 8px rgba(0,0,0,.04)}
    .ach-card.unlocked{background:linear-gradient(135deg,#fffbeb,#fef3c7);border-color:#fde68a}
    .ach-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
    .ach-card.unlocked .ach-icon{background:#fef3c7}

    .ach-info h4{font-size:13px;font-weight:600;color:#111827;margin-bottom:2px}
    .ach-card.locked .ach-info h4{color:#9ca3af}
    .ach-info p{font-size:11px;color:#9ca3af;line-height:1.4}
    .ach-card.unlocked .ach-info p{color:#92400e}

    /* My Profile Card */
    .my-card{background:linear-gradient(135deg,#111827,#1f2937);border-radius:18px;padding:24px;color:#fff;margin-bottom:28px;position:relative;overflow:hidden}
    .my-card::after{content:'';position:absolute;top:-40px;right:-40px;width:120px;height:120px;background:rgba(255,255,255,.05);border-radius:50%}

    .my-name{font-size:18px;font-weight:700}

    .my-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

    .my-stat .v{font-size:22px;font-weight:800}

    .empty{text-align:center;padding:60px 20px;color:#9ca3af;font-size:14px}

      .my-stats{grid-template-columns:repeat(3,1fr)}
      .lb-table{font-size:12px}
      .lb-table th,.lb-table td{padding:8px 10px}
    }
  </style>

  <script>
    function hashPasswordSync(p){var h=0,s=p+'ruihub_salt_2024';for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h=h&h}return Math.abs(h).toString(36).padStart(8,'0')}
    function toBase64(s){var b=new TextEncoder().encode(s),r='';for(var i=0;i<b.length;i++)r+=String.fromCharCode(b[i]);return btoa(r)}
    function fromBase64(b){var s=atob(b),r=new Uint8Array(s.length);for(var i=0;i<s.length;i++)r[i]=s.charCodeAt(i);return new TextDecoder().decode(r)}
    var AUTH_LOCAL_USERS={users:[{uid:'Administrator',username:'Administrator',passwordHash:hashPasswordSync('admin123'),role:'admin'},{uid:'000001',username:'Ruiweihan',passwordHash:hashPasswordSync('rui123'),role:'admin'},{uid:'000002',username:'Xvjiarui',passwordHash:hashPasswordSync('xvj123'),role:'user'}]};
    var AUTH_REPO='RuiweihanHub/ruiuser',AUTH_TK=function(){return['ghp_','aJxbQaU0S56e8pl6N8zrkWoHkfJHi92GOiFQ'].join('')};

    function syncLoginState(){
      var su=sessionStorage.getItem('rui_user'),suid=sessionStorage.getItem('rui_uid');
      if(su&&suid)return{isLoggedIn:true,username:su,uid:suid};
      var lu=localStorage.getItem('rui_user_remember'),luid=localStorage.getItem('rui_uid_remember'),exp=localStorage.getItem('rui_user_expire');
      if(lu&&luid){if(exp&&parseInt(exp)>Date.now()){sessionStorage.setItem('rui_user',lu);sessionStorage.setItem('rui_uid',luid);return{isLoggedIn:true,username:lu,uid:luid}}else{localStorage.removeItem('rui_user_remember');localStorage.removeItem('rui_uid_remember');localStorage.removeItem('rui_user_expire')}}
      return{isLoggedIn:false}
    }

    async function getAuth(){
      var auth={initialized:false,users:null,usersSha:null};
      async function init(){
        if(auth.initialized)return true;
        try{var r=await fetch('https://api.github.com/repos/'+AUTH_REPO+'/contents/users.json?ref=main&_='+Date.now(),{headers:{'Authorization':'token '+AUTH_TK(),'Accept':'application/vnd.github.v3+json'}});if(r.ok){var d=await r.json();auth.usersSha=d.sha;auth.users=JSON.parse(fromBase64(d.content));auth.initialized=true;return true}}catch(e){}
        auth.initialized=true;return false
      }
      return{
        validateUser:async function(usernameOrUid,password){
          if(!auth.initialized)await init();
          var hashed=hashPasswordSync(password);
          if(!auth.users){
            var lu=AUTH_LOCAL_USERS.users.find(function(u){return(u.username===usernameOrUid||u.uid===usernameOrUid)&&u.passwordHash===hashed});
            return lu?{success:true,user:{uid:lu.uid,username:lu.username,role:lu.role}}:{success:false,error:'用户名或密码错误'}
          }
          var idx=-1;
          if(auth.users.index&&auth.users.index.byUsername&&auth.users.index.byUsername[usernameOrUid]!==undefined)idx=auth.users.index.byUsername[usernameOrUid];
          if(idx===-1&&auth.users.index&&auth.users.index.byUid&&auth.users.index.byUid[usernameOrUid]!==undefined)idx=auth.users.index.byUid[usernameOrUid];
          if(idx===-1)idx=auth.users.users.findIndex(function(u){return u.username===usernameOrUid||u.uid===usernameOrUid});
          if(idx===-1)return{success:false,error:'用户名或密码错误'};
          var user=auth.users.users[idx];
          if(user.status==='disabled')return{success:false,error:'账户已被禁用'};
          if(user.passwordHash===hashed){return{success:true,user:{uid:user.uid,username:user.username,displayName:user.displayName,role:user.role,profile:user.profile}}}
          return{success:false,error:'用户名或密码错误'}
        },
        getAllUsers:async function(){
          if(!auth.initialized)await init();
          if(auth.users&&auth.users.users)return auth.users.users;
          return AUTH_LOCAL_USERS.users;
        }
      }
    }
  </script>
  <script>
    var REPO='RuiweihanHub/ruiuser',OJF='oj-problems.json',EF='exams.json',LF='learn.json';
    var TK=function(){return['ghp_','aJxbQaU0S56e8pl6N8zrkWoHkfJHi92GOiFQ'].join('')};
    var cu=null,curTab='oj';
    var ADMINS=['Administrator','Ruiweihan','000001'];

    function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML}

    // ====== Data Loading ======
    var ojProbs=[],exams=[],allUsers=[];
    var ojRecords={},examRecords={}; // keyed by username

    async function loadAllData(){
      try{
        // Load OJ problems (raw URL for large file)
        var rawUrl='https://raw.githubusercontent.com/'+REPO+'/main/'+OJF+'?_='+Date.now();
        var r=await fetch(rawUrl);
        if(r.ok){ojProbs=await r.json();console.log('OJ loaded:',ojProbs.length)}
      }catch(e){console.error('Load OJ error:',e)}

      try{
        var r2=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+EF+'?ref=main&_='+Date.now(),{headers:{'Authorization':'token '+TK(),'Accept':'application/vnd.github.v3+json'}});
        if(r2.ok){var d=await r2.json();exams=JSON.parse(fromBase64(d.content))}
      }catch(e){console.error('Load exams error:',e)}

      try{
        var a=await getAuth();
        allUsers=await a.getAllUsers();
        console.log('Users loaded:',allUsers.length);
      }catch(e){console.error('Load users error:',e)}

      // Aggregate OJ records from all users (stored in localStorage per browser)
      // Since we can only see current user's records, we build a server-side ranking
      // by reading from a shared store or using what we have
      buildRankings();
    }

    function buildRankings(){
      // Collect all OJ and exam records from localStorage
      // In a real system this would be server-side, but for now we aggregate what we can
      var ojRecs=getAllOJRecords();
      var examRecs=getAllExamRecords();

      // Group by user
      ojRecords={};
      ojRecs.forEach(function(r){
        if(!ojRecords[r.user])ojRecords[r.user]={ac:new Set(),tried:new Set(),submissions:0};
        ojRecords[r.user].submissions++;
        if(r.status==='ac')ojRecords[r.user].ac.add(r.probId);
        else ojRecords[r.user].tried.add(r.probId);
      });

      examRecords={};
      examRecs.forEach(function(r){
        if(!examRecords[r.user])examRecords[r.user]={scores:[],passed:0,total:0};
        examRecords[r.user].scores.push(r.score);
        examRecords[r.user].total++;
        if(r.score>=60)examRecords[r.user].passed++;
      });

      renderAll();
    }

    function getAllOJRecords(){
      try{return JSON.parse(localStorage.getItem('rui_oj_records')||'[]')}catch(e){return[]}
    }
    function getAllExamRecords(){
      try{return JSON.parse(localStorage.getItem('rui_exam_records')||'[]')}catch(e){return[]}
    }

    // ====== Render ======
    function renderAll(){
      renderSiteStats();
      renderMyCard();
      renderOJRank();
      renderExamRank();
      renderAchievements();
    }

    function renderSiteStats(){
      var totalUsers=allUsers.length||1;
      var totalProbs=ojProbs.length;
      var totalExams=exams.length;
      var totalSubmissions=getAllOJRecords().length;

      var h='';
      h+='<div class="stat-card gold"><div class="num">'+totalProbs+'</div><div class="lbl">OJ 题目</div></div>';
      h+='<div class="stat-card blue"><div class="num">'+totalUsers+'</div><div class="lbl">注册用户</div></div>';
      h+='<div class="stat-card green"><div class="num">'+totalExams+'</div><div class="lbl">在线考试</div></div>';
      h+='<div class="stat-card purple"><div class="num">'+totalSubmissions+'</div><div class="lbl">提交次数</div></div>';
      document.getElementById('siteStats').innerHTML=h;
    }

    function renderMyCard(){
      if(!cu)return;
      var myOj=ojRecords[cu.username]||{ac:new Set(),tried:new Set(),submissions:0};
      var myExam=examRecords[cu.username]||{scores:[],passed:0,total:0};
      var acCount=myOj.ac.size;
      var maxScore=myExam.scores.length?Math.max.apply(null,myExam.scores):0;
      var achCount=countAchievements(cu.username);

      var h='<div class="my-card"><div class="my-card-top">';
      h+='<div class="my-av">'+esc(cu.username.charAt(0).toUpperCase())+'</div>';
      h+='<div><div class="my-name">'+esc(cu.username)+'</div><div class="my-uid">'+esc(cu.uid)+'</div></div>';
      h+='</div><div class="my-stats">';
      h+='<div class="my-stat"><div class="v">'+acCount+'</div><div class="l">AC 题目</div></div>';
      h+='<div class="my-stat"><div class="v">'+maxScore+'</div><div class="l">最高分</div></div>';
      h+='<div class="my-stat"><div class="v">'+achCount+'</div><div class="l">成就</div></div>';
      h+='</div></div>';
      document.getElementById('myCard').innerHTML=h;
      document.getElementById('myCard').style.display='block';
    }

    function renderOJRank(){
      var sorted=Object.keys(ojRecords).map(function(user){
        var r=ojRecords[user];
        return{user:user,ac:r.ac.size,tried:r.tried.size+r.ac.size,subs:r.submissions,rate:r.ac.size>0?Math.round(r.ac.size/(r.tried.size+r.ac.size)*100):0};
      }).sort(function(a,b){return b.ac-a.ac||b.rate-a.rate});

      if(!sorted.length){
        document.getElementById('ojEmpty').style.display='block';
        document.getElementById('ojTable').style.display='none';
        return;
      }

      var maxAc=sorted[0]?sorted[0].ac:1;
      var h='';
      sorted.forEach(function(item,i){
        var rank=i+1;
        var rankCls=rank<=3?'rank-'+rank:'rank-n';
        var barColor=rank===1?'#f59e0b':rank===2?'#9ca3af':rank===3?'#d97706':'#6366f1';
        var barW=maxAc>0?Math.round(item.ac/maxAc*100):0;
        h+='<tr>';
        h+='<td><span class="rank-num '+rankCls+'">'+rank+'</span></td>';
        h+='<td><div class="user-cell"><div class="user-av">'+esc(item.user.charAt(0).toUpperCase())+'</div><div><div class="user-name">'+esc(item.user)+'</div></div></div></td>';
        h+='<td><strong>'+item.ac+'</strong></td>';
        h+='<td>'+item.subs+'</td>';
        h+='<td>'+item.rate+'%</td>';
        h+='<td><div class="score-bar"><div class="bar-track"><div class="bar-fill" style="width:'+barW+'%;background:'+barColor+'"></div></div><span class="bar-score" style="color:'+barColor+'">'+item.ac+'</span></div></td>';
        h+='</tr>';
      });
      document.getElementById('ojBody').innerHTML=h;
    }

    function renderExamRank(){
      var sorted=Object.keys(examRecords).map(function(user){
        var r=examRecords[user];
        var maxS=r.scores.length?Math.max.apply(null,r.scores):0;
        var avgS=r.scores.length?Math.round(r.scores.reduce(function(a,b){return a+b},0)/r.scores.length):0;
        return{user:user,maxScore:maxS,avgScore:avgScore,total:r.total,passed:r.passed,passRate:r.total>0?Math.round(r.passed/r.total*100):0};
      }).sort(function(a,b){return b.maxScore-a.maxScore||b.passRate-a.passRate});

      if(!sorted.length){
        document.getElementById('examEmpty').style.display='block';
        document.getElementById('examTable').style.display='none';
        return;
      }

      var maxScore=100;
      var h='';
      sorted.forEach(function(item,i){
        var rank=i+1;
        var rankCls=rank<=3?'rank-'+rank:'rank-n';
        var barColor=rank===1?'#f59e0b':rank===2?'#9ca3af':rank===3?'#d97706':'#6366f1';
        var barW=Math.round(item.maxScore);
        h+='<tr>';
        h+='<td><span class="rank-num '+rankCls+'">'+rank+'</span></td>';
        h+='<td><div class="user-cell"><div class="user-av">'+esc(item.user.charAt(0).toUpperCase())+'</div><div><div class="user-name">'+esc(item.user)+'</div></div></div></td>';
        h+='<td><strong>'+item.maxScore+'</strong></td>';
        h+='<td>'+item.total+'</td>';
        h+='<td>'+item.passRate+'%</td>';
        h+='<td><div class="score-bar"><div class="bar-track"><div class="bar-fill" style="width:'+barW+'%;background:'+barColor+'"></div></div><span class="bar-score" style="color:'+barColor+'">'+item.maxScore+'</span></div></td>';
        h+='</tr>';
      });
      document.getElementById('examBody').innerHTML=h;
    }

    // ====== Achievement System ======
    var ACHIEVEMENTS=[
      {id:'first_ac',name:'初出茅庐',desc:'第一次AC通过题目',icon:'🌟',check:function(u){var r=ojRecords[u];return r&&r.ac.size>=1}},
      {id:'ac10',name:'渐入佳境',desc:'AC通过10道题目',icon:'⭐',check:function(u){var r=ojRecords[u];return r&&r.ac.size>=10}},
      {id:'ac50',name:'刷题达人',desc:'AC通过50道题目',icon:'💫',check:function(u){var r=ojRecords[u];return r&&r.ac.size>=50}},
      {id:'ac100',name:'题海战术',desc:'AC通过100道题目',icon:'🏅',check:function(u){var r=ojRecords[u];return r&&r.ac.size>=100}},
      {id:'ac500',name:'OJ传说',desc:'AC通过500道题目',icon:'👑',check:function(u){var r=ojRecords[u];return r&&r.ac.size>=500}},
      {id:'exam_pass',name:'考试入门',desc:'第一次通过考试',icon:'📜',check:function(u){var r=examRecords[u];return r&&r.passed>=1}},
      {id:'exam_5',name:'考场老手',desc:'通过5次考试',icon:'🎓',check:function(u){var r=examRecords[u];return r&&r.passed>=5}},
      {id:'perfect_score',name:'满分学霸',desc:'考试获得100分',icon:'💯',check:function(u){var r=examRecords[u];return r&&r.scores.some(function(s){return s>=100})}},
      {id:'first_submit',name:'勇敢尝试',desc:'第一次提交代码',icon:'🚀',check:function(u){var r=ojRecords[u];return r&&r.submissions>=1}},
      {id:'persist',name:'百折不挠',desc:'累计提交100次代码',icon:'💪',check:function(u){var r=ojRecords[u];return r&&r.submissions>=100}},
      {id:'all_diff',name:'全能选手',desc:'在入门、简单、中等、困难各难度都有AC',icon:'🌈',check:function(u){
        if(!cu)return false;
        var recs=getAllOJRecords().filter(function(r){return r.user===u&&r.status==='ac'});
        var diffs=new Set();
        recs.forEach(function(r){var p=ojProbs.find(function(pp){return pp.id===r.probId});if(p)diffs.add(p.difficulty)});
        return diffs.has('入门')&&diffs.has('简单')&&diffs.has('中等')&&diffs.has('困难');
      }},
      {id:'speed',name:'闪电手速',desc:'单次考试20分钟内完成',icon:'⚡',check:function(u){var r=examRecords[u];return r&&r.total>=1}}
    ];

    function countAchievements(username){
      return ACHIEVEMENTS.filter(function(a){return a.check(username)}).length;
    }

    function renderAchievements(){
      var username=cu?cu.username:'';
      var h='';
      ACHIEVEMENTS.forEach(function(a){
        var unlocked=username&&a.check(username);
        var cls=unlocked?'unlocked':'locked';
        h+='<div class="ach-card '+cls+'">';
        h+='<div class="ach-icon">'+a.icon+'</div>';
        h+='<div class="ach-info"><h4>'+esc(a.name)+'</h4><p>'+esc(a.desc)+'</p></div>';
        h+='</div>';
      });
      document.getElementById('achGrid').innerHTML=h;
    }

    // ====== Tab Switch ======
    function switchTab(t,btn){
      curTab=t;
      document.getElementById('tabOJ').style.display=t==='oj'?'block':'none';
      document.getElementById('tabExam').style.display=t==='exam'?'block':'none';
      document.getElementById('tabAch').style.display=t==='ach'?'block':'none';
      document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('on')});
      if(btn)btn.classList.add('on');
    }

    // ====== Init ======
    (function(){
      var st=syncLoginState();
      if(st.isLoggedIn){
        cu={username:st.username,uid:st.uid};
        document.getElementById('loginPage').style.display='none';
        document.getElementById('mainContent').style.display='block';
        document.getElementById('authBtns').style.display='none';
        document.getElementById('userMenu').style.display='flex';
        document.getElementById('uName').textContent=st.username;
        var lvlEl=document.getElementById('lvlB');
        if(ADMINS.indexOf(st.username)>=0||ADMINS.indexOf(st.uid)>=0){lvlEl.textContent='SU';lvlEl.style.background='#fef2f2';lvlEl.style.color='#dc2626'}
        else{lvlEl.textContent='用户';lvlEl.style.background='#f3f4f6';lvlEl.style.color='#374151'}
        loadAllData();
      }else{
        document.getElementById('loginPage').classList.add('show');
      }
    })();

    document.getElementById('uBtn').onclick=function(e){e.stopPropagation();document.getElementById('udd').classList.toggle('show')};
    document.addEventListener('click',function(){document.getElementById('udd').classList.remove('show')});

    function showLoginModal(){document.getElementById('lModal').classList.add('show')}
    document.getElementById('lForm').onsubmit=async function(e){
      e.preventDefault();var u=document.getElementById('lU').value.trim(),p=document.getElementById('lP').value;
      try{var a=await getAuth(),r=await a.validateUser(u,p);if(r.success){sessionStorage.setItem('rui_user',r.user.username);sessionStorage.setItem('rui_uid',r.user.uid);localStorage.setItem('rui_user_remember',r.user.username);localStorage.setItem('rui_uid_remember',r.user.uid);localStorage.setItem('rui_user_expire',''+(Date.now()+6048e5));location.reload()}else{document.getElementById('lErr').textContent=r.error;document.getElementById('lErr').style.display='block'}}catch(e){document.getElementById('lErr').textContent='登录失败';document.getElementById('lErr').style.display='block'}
    };
    function logout(){sessionStorage.clear();localStorage.removeItem('rui_user_remember');localStorage.removeItem('rui_uid_remember');localStorage.removeItem('rui_user_expire');location.reload()}
  </script>

</body>
</html>
