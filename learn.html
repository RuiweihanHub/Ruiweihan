  <!-- Auth System - EXACTLY as original -->
  <script>
    function hashPasswordSync(p){var h=0,s=p+'ruihub_salt_2024';for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h=h&h}return Math.abs(h).toString(36).padStart(8,'0')}
    function toBase64(s){var b=new TextEncoder().encode(s),r='';for(var i=0;i<b.length;i++)r+=String.fromCharCode(b[i]);return btoa(r)}
    function fromBase64(b){var s=atob(b),r=new Uint8Array(s.length);for(var i=0;i<s.length;i++)r[i]=s.charCodeAt(i);return new TextDecoder().decode(r)}
    var AUTH_LOCAL_USERS={users:[{uid:'Administrator',username:'Administrator',passwordHash:hashPasswordSync('admin123'),role:'admin'},{uid:'000001',username:'Ruiweihan',passwordHash:hashPasswordSync('rui123'),role:'admin'},{uid:'000002',username:'Xvjiarui',passwordHash:hashPasswordSync('xvj123'),role:'user'}]};
    var AUTH_REPO='RuiweihanHub/ruiuser',AUTH_TK=function(){return['ghp_','aJxbQaU0S56e8pl6N8zrkWoHkfJHi92GOiFQ'].join('')};

    function syncLoginState(){
      var su=sessionStorage.getItem('rui_user'),suid=sessionStorage.getItem('rui_uid');
      if(su&&suid)return{isLoggedIn:true,username:su,uid:suid};
      var lu=localStorage.getItem('rui_user_remember'),luid=localStorage.getItem('rui_uid_remember'),exp=localStorage.getItem('rui_user_expire');
      if(lu&&luid){if(exp&&parseInt(exp)>Date.now()){sessionStorage.setItem('rui_user',lu);sessionStorage.setItem('rui_uid',luid);return{isLoggedIn:true,username:lu,uid:luid}}else{localStorage.removeItem('rui_user_remember');localStorage.removeItem('rui_uid_remember');localStorage.removeItem('rui_user_expire')}}
      return{isLoggedIn:false}
    }

    async function getAuth(){
      var auth={initialized:false,users:null,usersSha:null};
      async function init(){
        if(auth.initialized)return true;
        try{var r=await fetch('https://api.github.com/repos/'+AUTH_REPO+'/contents/users.json?ref=main&_='+Date.now(),{headers:{'Authorization':'token '+AUTH_TK(),'Accept':'application/vnd.github.v3+json'}});if(r.ok){var d=await r.json();auth.usersSha=d.sha;auth.users=JSON.parse(fromBase64(d.content));auth.initialized=true;return true}}catch(e){}
        auth.initialized=true;return false
      }
      return{
        validateUser:async function(usernameOrUid,password){
          if(!auth.initialized)await init();
          var hashed=hashPasswordSync(password);
          if(!auth.users){
            var lu=AUTH_LOCAL_USERS.users.find(function(u){return(u.username===usernameOrUid||u.uid===usernameOrUid)&&u.passwordHash===hashed});
            return lu?{success:true,user:{uid:lu.uid,username:lu.username,role:lu.role}}:{success:false,error:'用户名或密码错误'}
          }
          var idx=-1;
          if(auth.users.index&&auth.users.index.byUsername&&auth.users.index.byUsername[usernameOrUid]!==undefined)idx=auth.users.index.byUsername[usernameOrUid];
          if(idx===-1&&auth.users.index&&auth.users.index.byUid&&auth.users.index.byUid[usernameOrUid]!==undefined)idx=auth.users.index.byUid[usernameOrUid];
          if(idx===-1)idx=auth.users.users.findIndex(function(u){return u.username===usernameOrUid||u.uid===usernameOrUid});
          if(idx===-1)return{success:false,error:'用户名或密码错误'};
          var user=auth.users.users[idx];
          if(user.status==='disabled')return{success:false,error:'账户已被禁用'};
          if(user.passwordHash===hashed){return{success:true,user:{uid:user.uid,username:user.username,displayName:user.displayName,role:user.role,profile:user.profile}}}
          return{success:false,error:'用户名或密码错误'}
        }
      }
    }
  </script>

  <script>
    var REPO='RuiweihanHub/ruiuser',LF='learn.json',LD='learn-files',EF='exams.json',OJF='oj-problems.json';

    var ADMINS=['Administrator','Ruiweihan','000001'];
    var cu=null,res=[],exams=[],ojProbs=[],curCat='',selFile=null,curTab='res',examTimer=null,currentPvRes=null;

    function isAdmin(){return cu&&(ADMINS.indexOf(cu.username)>=0||ADMINS.indexOf(cu.uid)>=0)}
    function canUpload(){return cu&&(UP.indexOf(cu.username)>=0||UP.indexOf(cu.uid)>=0)}

    function b64e(a){var b=new Uint8Array(a),s='';for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s)}
    function b64d(b){var s=atob(b),b2=new Uint8Array(s.length);for(var i=0;i<s.length;i++)b2[i]=s.charCodeAt(i);return new TextDecoder().decode(b2)}

    function rmQ(b){b.closest('[data-type]').remove();document.querySelectorAll('#qC > [data-type]').forEach(function(el,i){el.querySelector('.flex span').textContent='第'+(i+1)+'题 - '+({'choice':'选择题','judge':'判断题','fill':'填空题'}[el.dataset.type])})}

    async function createExam(){
      var title=document.getElementById('exT').value.trim(),cat=document.getElementById('exC').value,dur=parseInt(document.getElementById('exDur').value),pass=parseInt(document.getElementById('exPass').value),note=document.getElementById('exNote').value.trim();
      if(!title){alert('请输入考试名称');return}
      var qs=[],totalScore=0;
      document.querySelectorAll('#qC > [data-type]').forEach(function(el){
        var type=el.dataset.type,q=el.querySelector('.q-title').value.trim(),ans=el.querySelector('.q-ans').value.trim();
        var scoreEl=el.querySelector('.q-score');var sc=scoreEl?parseInt(scoreEl.value)||10:10;
        var expEl=el.querySelector('.q-exp');var exp=expEl&&expEl.value?expEl.value.trim():'';
        if(!q||!ans)return;
        var item={type:type,question:q,answer:ans,score:sc,explanation:exp};
        if(type==='choice'){var a=el.querySelector('.q-a').value.trim(),b=el.querySelector('.q-b').value.trim(),c=el.querySelector('.q-c').value.trim(),d=el.querySelector('.q-d').value.trim();if(a&&b&&c&&d)item.options={A:a,B:b,C:c,D:d}}
        qs.push(item);totalScore+=sc;
      });
      if(!qs.length){alert('请至少添加一道完整题目');return}
      var ne={id:'exam_'+Date.now(),title:title,category:cat,duration:dur,passLine:pass,note:note,questions:qs,totalScore:totalScore,author:cu.username,createdAt:new Date().toISOString()};
      exams.unshift(ne);
      try{var sha=null;var gr=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+EF+'?ref=main',{headers:{'Authorization':'token '+TK(),'Accept':'application/vnd.github.v3+json'}});if(gr.ok){var gd=await gr.json();sha=gd.sha}
      var bd={message:'Create exam: '+title,content:b64e(new TextEncoder().encode(JSON.stringify(exams,null,2)))};if(sha)bd.sha=sha;
      var sr=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+EF+'',{method:'PUT',headers:{'Authorization':'token '+TK(),'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify(bd)});
      if(sr.ok){alert('考试创建成功！总分:'+totalScore+'分');renderExamHome()}else throw new Error('保存失败')}catch(err){alert('创建失败: '+err.message);exams.shift()}
    }

    function startExam(eid){
      var ex=exams.find(function(e){return e.id===eid});if(!ex)return;
      document.getElementById('eH2').textContent=ex.title;

      h+='<div class="px-4 py-3 bg-gray-50 border border-gray-100 rounded-xl mb-4 text-xs text-gray-500 flex justify-between flex-wrap gap-2"><span>考试ID: <code class="bg-gray-100 px-1.5 py-0.5 rounded text-[11px]">'+ex.id+'</code></span><span>出题人: '+esc(ex.author)+'</span><span>创建时间: '+new Date(ex.createdAt).toLocaleDateString('zh-CN')+'</span></div>';

      h+='</div>';

      h+='<div class="flex flex-col gap-4">';

        h+='<div class="bg-gray-50 rounded-2xl p-5 border border-gray-100" id="qWrap'+i+'">';

        h+='<p class="font-medium mb-3 text-sm">'+(i+1)+'. '+tl+' '+esc(q.question)+' <span class="text-xs text-gray-400">('+(q.score||10)+'分)</span></p>';
        if(q.type==='choice'){
          h+='<div class="space-y-2">';['A','B','C','D'].forEach(function(l){if(q.options[l])h+='<button class="qopt flex items-center gap-2.5 w-full text-left px-4 py-2.5 border border-gray-200 rounded-xl text-sm text-gray-700 hover:border-gray-300 hover:bg-gray-50 transition-colors" id="q'+i+'_'+l+'" onclick="pickA('+i+',\''+l+'\')"><span class="w-6 h-6 rounded-full border-2 border-gray-300 flex items-center justify-center text-[11px] font-semibold flex-shrink-0">'+l+'</span><span>'+esc(q.options[l])+'</span></button>'});h+='</div>';
        }else if(q.type==='judge'){
          h+='<div class="flex gap-2 mt-2"><button class="tf-btn px-5 py-2 border border-gray-200 rounded-xl text-sm text-gray-700 hover:bg-gray-50 transition-colors" id="q'+i+'_对" onclick="pickA('+i+',\'对\')">✓ 对</button><button class="tf-btn px-5 py-2 border border-gray-200 rounded-xl text-sm text-gray-700 hover:bg-gray-50 transition-colors" id="q'+i+'_错" onclick="pickA('+i+',\'错\')">✗ 错</button></div>';
        }else if(q.type==='fill'){

        }

      });

      c.innerHTML=h;window._ea={};window._es=false;

    function scrollToQ(i){var el=document.getElementById('qWrap'+i);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});document.querySelectorAll('#qNav button').forEach(function(b){b.classList.remove('border-violet-400','ring-2','ring-violet-200');b.classList.add('border-gray-200')});var nb=document.getElementById('qnav'+i);if(nb){nb.classList.remove('border-gray-200');nb.classList.add('border-violet-400','ring-2','ring-violet-200')}}

    function pickA(qi,v){

    function subExam(eid){
      if(window._es)return;var ex=exams.find(function(e){return e.id===eid});if(!ex)return;
      window._es=true;if(examTimer){clearTimeout(examTimer);examTimer=null}
      document.getElementById('eTimer').style.display='none';
      var okScore=0,totalScore=ex.totalScore||100,okCount=0,total=ex.questions.length;
      var qBreakdown=[];
      ex.questions.forEach(function(q,i){
        var ua=(window._ea[i]||'').toString().trim(),ca=q.answer.toString().trim();
        var correct=ua.toLowerCase()===ca.toLowerCase();
        var sc=q.score||Math.round(totalScore/total);
        if(correct){okScore+=sc;okCount++}
        qBreakdown.push({index:i,type:q.type,correct:correct,score:sc,userAnswer:ua,correctAnswer:ca});
        if(q.type==='choice'){
          ['A','B','C','D'].forEach(function(l){var e=document.getElementById('q'+i+'_'+l);if(!e)return;if(l===q.answer){e.classList.remove('border-gray-200','border-gray-900','bg-gray-100');e.classList.add('border-green-500','bg-green-50','text-green-600')}if(ua===l&&l!==q.answer){e.classList.remove('border-gray-200','border-gray-900','bg-gray-100');e.classList.add('border-red-500','bg-red-50','text-red-600')}});
        }else if(q.type==='judge'){
          ['对','错'].forEach(function(l){var e=document.getElementById('q'+i+'_'+l);if(!e)return;if(l===q.answer){e.classList.remove('border-gray-200','border-gray-900','bg-gray-100');e.classList.add('border-green-500','bg-green-50','text-green-600')}if(ua===l&&l!==q.answer){e.classList.remove('border-gray-200','border-gray-900','bg-gray-100');e.classList.add('border-red-500','bg-red-50','text-red-600')}});
        }else if(q.type==='fill'){
          var e=document.getElementById('q'+i+'_fill');if(e){
            if(correct)e.classList.add('border-green-500','bg-green-50');
            else e.classList.add('border-red-500','bg-red-50');
            e.value=ua;e.disabled=true;
            if(!correct){var sp=document.createElement('span');sp.className='block text-xs text-green-600 mt-1';sp.textContent='正确答案: '+q.answer;e.parentNode.appendChild(sp)}
          }
        }
        if(q.explanation){
          var expDiv=document.createElement('div');
          expDiv.className='mt-3 px-3 py-2 bg-blue-50 border border-blue-200 rounded-lg text-xs text-blue-800';
          expDiv.innerHTML='<strong>解析：</strong>'+esc(q.explanation);
          var wrap=document.getElementById('qWrap'+i);if(wrap)wrap.appendChild(expDiv);
        }
      });
      var sc=totalScore>0?Math.round(okScore/totalScore*100):0;
      var passLine=ex.passLine||60;
      var passed=sc>=passLine;
      saveExamRecord({examId:ex.id,examTitle:ex.title,user:cu.username,score:sc,correctCount:okCount,totalCount:total,okScore:okScore,totalScore:totalScore,time:new Date().toISOString()});

      var choiceQs=qBreakdown.filter(function(q){return q.type==='choice'});
      var judgeQs=qBreakdown.filter(function(q){return q.type==='judge'});
      var fillQs=qBreakdown.filter(function(q){return q.type==='fill'});
      var choiceOk=choiceQs.filter(function(q){return q.correct}).length;
      var judgeOk=judgeQs.filter(function(q){return q.correct}).length;
      var fillOk=fillQs.filter(function(q){return q.correct}).length;

      var rh='<div class="rounded-2xl overflow-hidden border border-gray-100 mt-6">';
      rh+='<div class="p-8 text-center text-white '+(passed?'score-pass':'score-fail')+'">';
      rh+='<div class="text-6xl font-extrabold leading-none">'+sc+'</div>';
      rh+='<div class="text-sm opacity-85 mt-2">'+(passed?'恭喜通过！':'未达及格线('+passLine+'分)')+'</div>';
      rh+='</div>';
      rh+='<div class="p-5 bg-white">';
      rh+='<div class="flex justify-between py-2 border-b border-gray-100 text-sm"><span class="text-gray-500">得分</span><span class="font-semibold text-gray-900">'+okScore+' / '+totalScore+'</span></div>';
      rh+='<div class="flex justify-between py-2 border-b border-gray-100 text-sm"><span class="text-gray-500">正确题数</span><span class="font-semibold text-gray-900">'+okCount+' / '+total+'</span></div>';
      if(choiceQs.length)rh+='<div class="flex justify-between py-2 border-b border-gray-100 text-sm"><span class="text-gray-500">选择题</span><span class="font-semibold text-gray-900">'+choiceOk+' / '+choiceQs.length+'</span></div>';
      if(judgeQs.length)rh+='<div class="flex justify-between py-2 border-b border-gray-100 text-sm"><span class="text-gray-500">判断题</span><span class="font-semibold text-gray-900">'+judgeOk+' / '+judgeQs.length+'</span></div>';
      if(fillQs.length)rh+='<div class="flex justify-between py-2 border-b border-gray-100 text-sm"><span class="text-gray-500">填空题</span><span class="font-semibold text-gray-900">'+fillOk+' / '+fillQs.length+'</span></div>';
      rh+='<div class="flex justify-between py-2 border-b border-gray-100 text-sm"><span class="text-gray-500">及格线</span><span class="font-semibold text-gray-900">'+passLine+'分</span></div>';

    function changeLang(){

    async function runJudge0(langId,code,stdin,cpuLimit,memLimit){
      var r=await fetch(JUDGE0+'/submissions?base64_encoded=false&wait=true',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source_code:code,language_id:langId,stdin:stdin||'',cpu_time_limit:cpuLimit||2,memory_limit:(memLimit||128)*1024})});

    function showOJResult(verdict,score,total,extra){
      var resEl=document.getElementById('ojRes');
      var label={ac:'Accepted',wa:'Wrong Answer',tle:'Time Limit Exceeded',ce:'Compilation Error',re:'Runtime Error'}[verdict]||verdict;
      var colors={ac:'bg-green-50 border-green-200',wa:'bg-red-50 border-red-200',tle:'bg-yellow-50 border-yellow-200',ce:'bg-orange-50 border-orange-200',re:'bg-purple-50 border-purple-200'};
      var verdictColors={ac:'bg-green-100 text-green-600',wa:'bg-red-100 text-red-600',tle:'bg-yellow-100 text-yellow-600',ce:'bg-orange-100 text-orange-600',re:'bg-purple-100 text-purple-600'};
      var barColors={ac:'bg-green-500',wa:'bg-red-500',tle:'bg-yellow-500',ce:'bg-orange-500',re:'bg-purple-500'};
      resEl.className='mt-4 rounded-2xl p-5 border '+(colors[verdict]||'bg-gray-50 border-gray-200');
      var pct=total>0?Math.round(score/total*100):0;
      var h='<div class="flex items-center gap-2 mb-3"><span class="px-3 py-1 rounded-lg text-xs font-bold '+(verdictColors[verdict]||'')+'">'+verdict.toUpperCase()+'</span><span class="text-sm font-semibold">'+label+'</span></div>';
      h+='<div class="text-lg font-bold mb-2">'+verdict.toUpperCase()+' '+score+'/'+total+'</div>';
      h+='<div class="h-2 bg-gray-200 rounded-full overflow-hidden"><div class="h-full rounded-full transition-all duration-500 '+(barColors[verdict]||'bg-gray-400')+'" style="width:'+pct+'%"></div></div>';
      if(extra)h+='<pre class="mt-3 bg-white p-3 rounded-lg text-xs overflow-x-auto whitespace-pre-wrap font-mono">'+extra+'</pre>';
      resEl.innerHTML=h;

    async function submitOJ(idx){
      var p=ojProbs[idx];if(!p)return;
      var code=document.getElementById('ojCode').value;var lang=document.getElementById('ojLang').value;var langId=LANG_IDS[lang]||54;
      var resEl=document.getElementById('ojRes');resEl.className='mt-4 rounded-2xl p-5 border border-orange-200 bg-orange-50';resEl.innerHTML='<h4 class="text-sm font-semibold text-orange-600">判题中...</h4><pre class="text-xs mt-1 text-orange-500">正在运行，请稍候...</pre>';
      var allTests=[];
      if(p.samples&&p.samples.length){p.samples.forEach(function(s){allTests.push({input:s.input,output:s.output})})}
      if(p.testData&&p.testData.length){p.testData.forEach(function(s){allTests.push({input:s.input,output:s.output})})}
      if(!allTests.length){resEl.className='mt-4 rounded-2xl p-5 border border-orange-200 bg-orange-50';resEl.innerHTML='<h4 class="text-sm font-semibold text-orange-600">无测试数据</h4><pre class="text-xs mt-1 text-orange-500">该题目没有设置测试数据</pre>';return}
      var totalTests=allTests.length;var acCount=0,tleCount=0;
      try{
        for(var si=0;si<totalTests;si++){
          var s=allTests[si];try{
            var d=await runJudge0(langId,code,s.input,p.timeLimit||2,p.memoryLimit||128);
            if(d.status&&d.status.id===3){var output=(d.stdout||'').trim();var expected=(s.output||'').trim();if(output===expected){acCount++}}
            else if(d.status&&(d.status.id===5||d.status.id===6)){var errMsg=(d.compile_output||'').substring(0,300);showOJResult('ce',acCount,totalTests,'编译错误\n\n'+errMsg);saveOJRecord({probId:p.id,probTitle:p.title,user:cu.username,status:'ce',score:acCount,total:totalTests,time:new Date().toISOString()});return}
            else if(d.status&&(d.status.id===7||d.status.id===8||d.status.id===9||d.status.id===10||d.status.id===11||d.status.id===12)){var errMsg=(d.stderr||d.status.description||'运行时错误').substring(0,300);showOJResult('re',acCount,totalTests,'Runtime Error\n\n'+errMsg);saveOJRecord({probId:p.id,probTitle:p.title,user:cu.username,status:'re',score:acCount,total:totalTests,time:new Date().toISOString()});return}
            else{var desc=(d.status&&d.status.description)||'';if(desc.indexOf('Time Limit')>=0){tleCount++}}
          }catch(e){showOJResult('re',acCount,totalTests,'运行时错误\n\n'+e.message);saveOJRecord({probId:p.id,probTitle:p.title,user:cu.username,status:'re',score:acCount,total:totalTests,time:new Date().toISOString()});return}
        }
        if(acCount===totalTests){showOJResult('ac',acCount,totalTests,'');saveOJRecord({probId:p.id,probTitle:p.title,user:cu.username,status:'ac',score:acCount,total:totalTests,time:new Date().toISOString()})}
        else if(tleCount>0){showOJResult('tle',acCount,totalTests,'');saveOJRecord({probId:p.id,probTitle:p.title,user:cu.username,status:'tle',score:acCount,total:totalTests,time:new Date().toISOString()})}
        else{showOJResult('wa',acCount,totalTests,'');saveOJRecord({probId:p.id,probTitle:p.title,user:cu.username,status:'wa',score:acCount,total:totalTests,time:new Date().toISOString()})}
      }catch(err){showOJResult('ce',0,totalTests,'判题服务暂不可用\n\n'+esc(err.message))}
    }

    function testOJ(idx){

          var err=d.stderr||'';if(err)h+='\n\n标准错误:\n'+esc(err);
          h+='\n\n运行时间: '+(d.time||'?')+'s\n内存: '+(d.memory?Math.round(d.memory/1024)+'MB':'?')+'</pre>';
          resEl.innerHTML=h;
        }else{
          resEl.className='mt-4 rounded-2xl p-5 border bg-orange-50 border-orange-200';

        }
      }).catch(function(e){resEl.className='mt-4 rounded-2xl p-5 border bg-orange-50 border-orange-200';resEl.innerHTML='<h4 class="text-sm font-semibold text-orange-600">运行失败</h4><pre class="mt-2 bg-white p-3 rounded-lg text-xs whitespace-pre-wrap font-mono">'+esc(e.message)+'</pre>'});
    }

      if(n>2){alert('样例最多2个');return}
      var d=document.createElement('div');d.className='mb-3';
      d.innerHTML='<label class="block text-sm font-medium text-gray-700 mb-1.5">样例'+n+' 输入</label><textarea class="oj-si w-full px-3 py-2 bg-white border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-gray-300 transition-colors resize-none" rows="2" placeholder="输入"></textarea><label class="block text-sm font-medium text-gray-700 mb-1.5 mt-2">样例'+n+' 输出</label><textarea class="oj-so w-full px-3 py-2 bg-white border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-gray-300 transition-colors resize-none" rows="2" placeholder="输出"></textarea>';
      c.appendChild(d);
    }

    function addOJTestData(){
      var c=document.getElementById('ojTestData');var n=c.querySelectorAll('.oj-tdi').length+1;
      var d=document.createElement('div');d.className='mb-3 p-4 bg-orange-50 border border-orange-200 rounded-xl';
      d.innerHTML='<label class="block text-sm font-medium text-orange-600 mb-1.5">隐藏测试数据'+n+' 输入</label><textarea class="oj-tdi w-full px-3 py-2 bg-white border border-orange-200 rounded-xl text-sm focus:outline-none focus:border-orange-300 transition-colors resize-none" rows="2" placeholder="隐藏测试输入"></textarea><label class="block text-sm font-medium text-orange-600 mb-1.5 mt-2">隐藏测试数据'+n+' 输出</label><textarea class="oj-tdo w-full px-3 py-2 bg-white border border-orange-200 rounded-xl text-sm focus:outline-none focus:border-orange-300 transition-colors resize-none" rows="2" placeholder="隐藏测试输出"></textarea>';
      c.appendChild(d);
    }

    async function createOJ(){
      var t=document.getElementById('ojT').value.trim(),d=document.getElementById('ojD').value;
      var desc=document.getElementById('ojDesc').value.trim(),ind=document.getElementById('ojIn').value.trim(),outd=document.getElementById('ojOut').value.trim();
      var tl=parseInt(document.getElementById('ojTL').value)||1,ml=parseInt(document.getElementById('ojML').value)||128;
      if(!t||!desc){alert('请填写题目名称和描述');return}
      var sis=document.querySelectorAll('.oj-si'),sos=document.querySelectorAll('.oj-so');
      var samples=[];
      for(var i=0;i<Math.min(sis.length,2);i++){var si=sis[i].value.trim(),soEl=sos[i],so=soEl&&soEl.value?soEl.value.trim():'';if(si||so)samples.push({input:si,output:so})}
      var tdis=document.querySelectorAll('.oj-tdi'),tdos=document.querySelectorAll('.oj-tdo');
      var testData=[];
      for(var i=0;i<tdis.length;i++){var tdi=tdis[i].value.trim(),tdoEl=tdos[i],tdo=tdoEl&&tdoEl.value?tdoEl.value.trim():'';if(tdi||tdo)testData.push({input:tdi,output:tdo})}
      var np={id:'oj_'+Date.now(),title:t,difficulty:d,description:desc,inputDesc:ind,outputDesc:outd,samples:samples,testData:testData,timeLimit:tl,memoryLimit:ml,author:cu.username,createdAt:new Date().toISOString()};
      ojProbs.unshift(np);
      try{var sha=null;var gr=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+OJF+'?ref=main',{headers:{'Authorization':'token '+TK(),'Accept':'application/vnd.github.v3+json'}});if(gr.ok){var gd=await gr.json();sha=gd.sha}
      var bd={message:'Add OJ: '+t,content:b64e(new TextEncoder().encode(JSON.stringify(ojProbs,null,2)))};if(sha)bd.sha=sha;
      var sr=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+OJF+'',{method:'PUT',headers:{'Authorization':'token '+TK(),'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify(bd)});
      if(sr.ok){alert('题目发布成功！');renderOJ()}else throw new Error('保存失败')}catch(err){alert('发布失败: '+err.message);ojProbs.shift()}
    }
  </script>
</body>
