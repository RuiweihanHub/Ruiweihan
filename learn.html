<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>学习中心 - Rui Hub</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
    body{min-height:100vh;background:#fff;color:#111827;display:flex;flex-direction:column}
    a{text-decoration:none;color:inherit}button{cursor:pointer;border:none;background:none;font:inherit}
    input,select,textarea{font:inherit;outline:none}

    .nav{width:100%;padding:14px 24px;border-bottom:1px solid #f3f4f6}
    .nav-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
    .nav-lk{display:flex;gap:24px;font-size:14px}.nav-lk a{color:#6b7280;transition:.15s}.nav-lk a:hover{color:#111827}
    .nav-r{display:flex;align-items:center;gap:10px}
    .btn-r{padding:6px 14px;background:#f3f4f6;color:#374151;font-size:12px;font-weight:500;border-radius:8px;transition:.15s}.btn-r:hover{background:#e5e7eb}
    .btn-b{padding:6px 14px;background:#111827;color:#fff;font-size:12px;font-weight:500;border-radius:8px;transition:.15s}.btn-b:hover{background:#1f2937}
    .umenu{position:relative;display:flex;align-items:center;gap:8px}
    .ubtn{display:flex;align-items:center;gap:6px;padding:6px 12px;background:#f3f4f6;border-radius:8px;font-size:13px;color:#374151;transition:.15s}.ubtn:hover{background:#e5e7eb}
    .udd{display:none;position:absolute;right:0;top:100%;margin-top:8px;width:140px;background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.1);border:1px solid #f3f4f6;overflow:hidden;z-index:50}
    .udd.show{display:block}.udd a{display:block;padding:8px 16px;font-size:13px;color:#374151;transition:.1s}.udd a:hover{background:#f9fafb}.udd .out{color:#dc2626}.udd .out:hover{background:#fef2f2}.udd .sp{height:1px;background:#f3f4f6}

    .main{flex:1;max-width:1000px;width:100%;margin:0 auto;padding:28px 24px}
    .hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
    .hd h1{font-size:22px;font-weight:700}.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:#111827;color:#fff;font-weight:700;margin-left:8px;vertical-align:middle}
    .hd .sub{color:#6b7280;font-size:13px;margin-top:4px}
    .hbtns{display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}
    .bg{padding:8px 14px;background:#f3f4f6;color:#374151;font-size:13px;font-weight:500;border-radius:12px;transition:.15s;display:flex;align-items:center;gap:6px}.bg:hover{background:#e5e7eb}
    .bd{padding:8px 14px;background:#111827;color:#fff;font-size:13px;font-weight:500;border-radius:12px;transition:.15s;display:flex;align-items:center;gap:6px}.bd:hover{background:#1f2937}
    .cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
    .cb{padding:7px 14px;font-size:13px;border-radius:12px;border:1px solid #e5e7eb;color:#6b7280;transition:.15s;background:#fff}.cb:hover{background:#f9fafb}.cb.on{background:#111827;color:#fff;border-color:#111827}
    .sw{position:relative;margin-bottom:18px}
    .sw svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#9ca3af}
    .sw input{width:100%;padding:10px 14px 10px 38px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;font-size:13px;transition:.15s}.sw input:focus{border-color:#9ca3af;background:#fff}

    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
    @media(max-width:640px){.grid{grid-template-columns:1fr}}
    .card{background:#fff;border:1px solid #f3f4f6;border-radius:16px;padding:16px;cursor:pointer;transition:.15s;position:relative}.card:hover{border-color:#e5e7eb;box-shadow:0 4px 16px -4px rgba(0,0,0,.06);transform:translateY(-1px)}
    .card .del-btn{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;background:#fef2f2;color:#dc2626;display:none;align-items:center;justify-content:center;font-size:14px;font-weight:700;border:1px solid #fecaca;transition:.15s;z-index:5}.card .del-btn:hover{background:#dc2626;color:#fff}
    .card:hover .del-btn.can-del{display:flex}
    .ct{display:flex;align-items:flex-start;gap:12px}
    .ci{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .ci.doc{background:#eff6ff;color:#2563eb}.ci.vid{background:#fef2f2;color:#dc2626}.ci.lnk{background:#f0fdf4;color:#16a34a}.ci.img{background:#fefce8;color:#ca8a04}
    .cf{flex:1;min-width:0}.cf h3{font-size:14px;font-weight:600;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .cf p{font-size:12px;color:#6b7280;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px}
    .cm{display:flex;flex-wrap:wrap;gap:5px;font-size:11px;color:#9ca3af;align-items:center}
    .tg{padding:2px 8px;border-radius:20px;font-weight:500;font-size:11px}
    .tg.doc{background:#eff6ff;color:#2563eb}.tg.vid{background:#fef2f2;color:#dc2626}.tg.lnk{background:#f0fdf4;color:#16a34a}.tg.img{background:#fefce8;color:#ca8a04}.tg.cat{background:#f3f4f6;color:#4b5563}
    .empty{text-align:center;padding:60px 20px;color:#9ca3af;font-size:14px}

    .fov{display:none;position:fixed;inset:0;z-index:100;background:#fff;flex-direction:column}.fov.show{display:flex}
    .fbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-bottom:1px solid #f3f4f6;flex-shrink:0}
    .fbar h2{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;margin-right:12px}
    .fbar .r{display:flex;align-items:center;gap:10px;flex-shrink:0}
    .bsm{padding:5px 12px;background:#f3f4f6;color:#374151;font-size:12px;font-weight:500;border-radius:8px;transition:.15s}.bsm:hover{background:#e5e7eb}
    .xbtn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;transition:.15s;color:#6b7280}.xbtn:hover{background:#f3f4f6}
    .fbody{flex:1;overflow:auto;background:#f9fafb}
    .fbody iframe{width:100%;height:100%;border:none}
    .fbody video{width:100%;min-height:80vh;background:#000}
    .fbody .tw{max-width:800px;margin:0 auto;padding:32px;background:#fff;border-radius:12px;font-size:13px;line-height:1.8;white-space:pre-wrap;font-family:'Courier New',monospace}
    .fbody .iw{display:flex;align-items:center;justify-content:center;min-height:100%;padding:32px}.fbody .iw img{max-width:100%;max-height:90vh;border-radius:8px;object-fit:contain}

    .mbg{display:none;position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.25);backdrop-filter:blur(4px);align-items:center;justify-content:center}.mbg.show{display:flex}
    .mdl{background:#fff;border-radius:16px;box-shadow:0 8px 40px rgba(0,0,0,.12);width:100%;max-width:460px;margin:16px;overflow:hidden;max-height:90vh;display:flex;flex-direction:column}
    .mh{padding:16px 20px;border-bottom:1px solid #f3f4f6;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}.mh h2{font-size:16px;font-weight:600}
    .mb{padding:20px;overflow-y:auto;flex:1}.mf{padding:14px 20px;border-top:1px solid #f3f4f6;display:flex;justify-content:flex-end;gap:8px;flex-shrink:0}
    .fd{margin-bottom:12px}.fd label{display:block;font-size:13px;font-weight:500;color:#374151;margin-bottom:5px}
    .fd input,.fd select,.fd textarea{width:100%;padding:9px 12px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;font-size:13px;transition:.15s}.fd input:focus,.fd select:focus,.fd textarea:focus{border-color:#9ca3af;background:#fff}
    .fd textarea{resize:none}.rw{display:flex;gap:10px}.rw .fd{flex:1}
    .dz{border:2px dashed #d1d5db;border-radius:12px;padding:24px;text-align:center;cursor:pointer;transition:.15s}.dz:hover,.dz.ov{border-color:#111827;background:#f9fafb}
    .dz svg{margin:0 auto 6px;color:#d1d5db}.dz p{font-size:13px;color:#6b7280}.dz .ht{font-size:11px;color:#9ca3af;margin-top:4px}.dz .sf{font-size:13px;font-weight:500;color:#111827;margin-top:6px;display:none}
    .dz .img-prev{margin-top:10px;max-width:100%;max-height:120px;border-radius:8px;display:none}
    .prog{margin-top:10px;display:none}.prog .tp{display:flex;justify-content:space-between;font-size:11px;color:#6b7280;margin-bottom:3px}
    .prog .br{height:5px;background:#f3f4f6;border-radius:3px;overflow:hidden}.prog .br div{height:100%;background:#111827;border-radius:3px;transition:width .3s}

    .eov{display:none;position:fixed;inset:0;z-index:90;background:#fff;flex-direction:column}.eov.show{display:flex}
    .ebar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid #f3f4f6;flex-wrap:wrap;gap:8px}
    .ebar h2{font-size:16px;font-weight:600}
    .ebar .timer{font-size:14px;font-weight:600;color:#dc2626;display:flex;align-items:center;gap:6px}
    .ebody{flex:1;overflow:auto;padding:24px;max-width:800px;margin:0 auto;width:100%}

    .qopt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 14px;border:1px solid #e5e7eb;border-radius:12px;font-size:13px;color:#374151;transition:.15s;margin-bottom:6px}
    .qopt:hover{border-color:#9ca3af;background:#f9fafb}
    .qopt.sel{border-color:#111827;background:#f3f4f6}
    .qopt.ok{border-color:#16a34a;background:#f0fdf4;color:#16a34a}
    .qopt.no{border-color:#dc2626;background:#fef2f2;color:#dc2626}
    .qcir{width:24px;height:24px;border-radius:50%;border:2px solid #d1d5db;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
    .qi{background:#f9fafb;border-radius:14px;padding:16px;border:1px solid #e5e7eb;margin-bottom:14px}
    .qi .qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;font-weight:500;color:#374151}
    .qi .qh button{font-size:11px;color:#dc2626}.qi .qh button:hover{color:#b91c1c}
    .qi input,.qi select{width:100%;padding:7px 10px;background:#fff;border:1px solid #e5e7eb;border-radius:8px;font-size:12px;margin-bottom:5px}
    .tf-btns{display:flex;gap:8px;margin-top:8px}
    .tf-btn{padding:8px 20px;border:1px solid #e5e7eb;border-radius:10px;font-size:13px;color:#374151;transition:.15s}.tf-btn:hover{background:#f9fafb}.tf-btn.sel{background:#111827;color:#fff;border-color:#111827}
    .tf-btn.ok{border-color:#16a34a;background:#f0fdf4;color:#16a34a}.tf-btn.no{border-color:#dc2626;background:#fef2f2;color:#dc2626}
    .fill-input{margin-top:8px;padding:8px 12px;background:#fff;border:1px solid #e5e7eb;border-radius:10px;font-size:13px;width:100%;transition:.15s}.fill-input:focus{border-color:#9ca3af}
    .fill-input.ok{border-color:#16a34a;background:#f0fdf4}.fill-input.no{border-color:#dc2626;background:#fef2f2}

    .lp{position:fixed;inset:0;z-index:50;background:#fff;display:none;align-items:center;justify-content:center}.lp.show{display:flex}
    .lb{text-align:center}.lb .ic{width:72px;height:72px;margin:0 auto 16px;background:#f3f4f6;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#6b7280}
    .lb h2{font-size:22px;font-weight:700;margin-bottom:6px}.lb p{color:#6b7280;font-size:14px;margin-bottom:20px}
    .lb button{padding:12px 32px;background:#111827;color:#fff;font-weight:500;border-radius:12px;transition:.15s}.lb button:hover{background:#1f2937}

    .oj-wrap{padding:20px 0}
    .oj-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
    .oj-header h3{font-size:18px;font-weight:700}
    .oj-problem{background:#f9fafb;border-radius:14px;padding:20px;border:1px solid #e5e7eb;margin-bottom:16px}
    .oj-problem h4{font-size:15px;font-weight:600;margin-bottom:8px}.oj-problem p{font-size:13px;color:#6b7280;line-height:1.7;margin-bottom:8px}
    .oj-problem pre{background:#1f2937;color:#e5e7eb;padding:14px;border-radius:10px;font-size:12px;overflow-x:auto;margin:8px 0;font-family:'Courier New',monospace}
    .oj-problem .sample{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
    @media(max-width:600px){.oj-problem .sample{grid-template-columns:1fr}}
    .oj-problem .sample-box label{font-size:11px;font-weight:600;color:#6b7280;text-transform:uppercase;margin-bottom:4px;display:block}
    .oj-editor{margin-bottom:16px}
    .oj-editor textarea{width:100%;min-height:220px;padding:14px;background:#1f2937;color:#e5e7eb;border:1px solid #374151;border-radius:12px;font-size:13px;font-family:'Courier New',monospace;line-height:1.6;resize:vertical;tab-size:4}
    .oj-editor select{padding:8px 14px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;font-size:13px}
    .oj-result{margin-top:16px;padding:20px;border-radius:14px;display:none}
    .oj-result.show{display:block}
    .oj-result.ac{background:#f0fdf4;border:1px solid #bbf7d0}.oj-result.wa{background:#fef2f2;border:1px solid #fecaca}.oj-result.ce{background:#fff7ed;border:1px solid #fed7aa}.oj-result.re{background:#f5f3ff;border:1px solid #ddd6fe}.oj-result.tle{background:#fefce8;border:1px solid #fde68a}
    .oj-result h4{font-size:15px;font-weight:700;margin-bottom:8px}
    .oj-result.ac h4{color:#16a34a}.oj-result.wa h4{color:#dc2626}.oj-result.ce h4{color:#ea580c}.oj-result.re h4{color:#7c3aed}.oj-result.tle h4{color:#ca8a04}
    .oj-result pre{background:#fff;padding:10px;border-radius:8px;font-size:12px;overflow-x:auto;white-space:pre-wrap;font-family:'Courier New',monospace}
    .oj-stats{display:flex;gap:16px;font-size:12px;color:#6b7280;margin-top:6px}
    .oj-verdict{display:inline-block;padding:3px 12px;border-radius:8px;font-size:13px;font-weight:700;margin-right:8px}
    .oj-verdict.ac{background:#dcfce7;color:#16a34a}.oj-verdict.wa{background:#fee2e2;color:#dc2626}.oj-verdict.tle{background:#fef9c3;color:#ca8a04}.oj-verdict.ce{background:#ffedd5;color:#ea580c}.oj-verdict.re{background:#ede9fe;color:#7c3aed}
    .oj-score-bar{height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden;margin:10px 0}.oj-score-bar div{height:100%;border-radius:4px;transition:width .5s}

    .tab-nav{display:flex;gap:0;border-bottom:2px solid #f3f4f6;margin-bottom:20px}
    .tab-btn{padding:10px 20px;font-size:14px;font-weight:500;color:#6b7280;border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;transition:.15s;background:none}
    .tab-btn:hover{color:#374151}.tab-btn.on{color:#111827;border-bottom-color:#111827}

    .qnav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;padding:12px;background:#f9fafb;border-radius:12px;border:1px solid #e5e7eb}
    .qnav-b{width:32px;height:32px;border-radius:8px;border:1px solid #e5e7eb;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;cursor:pointer;transition:.15s;color:#6b7280;background:#fff}
    .qnav-b:hover{border-color:#9ca3af}.qnav-b.done{background:#111827;color:#fff;border-color:#111827}.qnav-b.cur{border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.2)}
    .exam-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
    .exam-stat .si{background:#f9fafb;border-radius:12px;padding:14px;text-align:center;border:1px solid #e5e7eb}
    .exam-stat .si .n{font-size:24px;font-weight:700;color:#111827}.exam-stat .si .l{font-size:11px;color:#6b7280;margin-top:2px}

    .score-card{margin-top:20px;border-radius:16px;overflow:hidden;border:1px solid #e5e7eb}
    .score-card .sc-head{padding:24px;text-align:center;color:#fff}
    .score-card .sc-head.pass{background:linear-gradient(135deg,#16a34a,#22c55e)}.score-card .sc-head.fail{background:linear-gradient(135deg,#dc2626,#ef4444)}
    .score-card .sc-head .sc-score{font-size:56px;font-weight:800;line-height:1}.score-card .sc-head .sc-label{font-size:14px;opacity:.85;margin-top:6px}
    .score-card .sc-body{padding:20px;background:#fff}
    .score-card .sc-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f3f4f6;font-size:13px}
    .score-card .sc-row:last-child{border-bottom:none}
    .score-card .sc-row .sc-k{color:#6b7280}.score-card .sc-row .sc-v{font-weight:600;color:#111827}

    .exam-card{padding:14px 18px;background:#f9fafb;border-radius:12px;border:1px solid #e5e7eb;margin-bottom:8px;transition:.15s}
    .exam-card:hover{border-color:#d1d5db;box-shadow:0 2px 8px rgba(0,0,0,.04)}
    .exam-card .ec-top{display:flex;align-items:center;justify-content:space-between}
    .exam-card .ec-title{font-weight:500;font-size:14px;cursor:pointer}.exam-card .ec-title:hover{color:#2563eb}
    .exam-card .ec-meta{font-size:11px;color:#9ca3af;margin-top:4px}
    .exam-card .ec-id{font-size:10px;color:#9ca3af;font-family:monospace;margin-top:2px}
    .exam-card .ec-actions{display:flex;align-items:center;gap:8px}
    .exam-del{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#fef2f2;color:#dc2626;border:1px solid #fecaca;font-size:12px;transition:.15s;cursor:pointer}.exam-del:hover{background:#dc2626;color:#fff}

    .pv-del{padding:5px 12px;background:#fef2f2;color:#dc2626;font-size:12px;font-weight:500;border-radius:8px;transition:.15s;border:1px solid #fecaca}.pv-del:hover{background:#dc2626;color:#fff}

    .oj-prob-card{padding:14px 18px;background:#f9fafb;border-radius:12px;border:1px solid #e5e7eb;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:space-between}
    .oj-prob-card:hover{border-color:#d1d5db;box-shadow:0 2px 8px rgba(0,0,0,.04)}
  
    .oj-search{position:relative;margin-bottom:14px}
    .oj-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#9ca3af}
    .oj-search input{width:100%;padding:10px 14px 10px 38px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;font-size:13px;transition:.15s}.oj-search input:focus{border-color:#9ca3af;background:#fff}
    .oj-filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;align-items:center}
    .oj-filters .fl{font-size:12px;color:#9ca3af;margin-right:2px}
    .oj-diff{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;transition:.15s;border:1px solid transparent}
    .oj-diff:hover{opacity:.8}.oj-diff.入门{background:#f0fdf4;color:#16a34a}.oj-diff.简单{background:#eff6ff;color:#2563eb}.oj-diff.中等{background:#fefce8;color:#ca8a04}.oj-diff.困难{background:#fff7ed;color:#ea580c}.oj-diff.挑战{background:#fef2f2;color:#dc2626}
    .oj-diff.active{box-shadow:0 0 0 2px currentColor}
    .oj-cat{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;background:#f3f4f6;color:#6b7280;cursor:pointer;transition:.15s}.oj-cat:hover{background:#e5e7eb}.oj-cat.active{background:#111827;color:#fff}
    .oj-list-header{display:grid;grid-template-columns:60px 1fr 60px 60px 40px;gap:8px;align-items:center;padding:8px 16px;border-bottom:1px solid #e5e7eb;font-size:11px;color:#9ca3af;font-weight:600}
    .oj-list-row{display:grid;grid-template-columns:60px 1fr 60px 60px 40px;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid #f3f4f6;font-size:13px;cursor:pointer;transition:.1s}.oj-list-row:hover{background:#f9fafb}
    .oj-list-row .pid{font-size:12px;color:#9ca3af;font-family:monospace}.oj-list-row .ptitle{font-weight:500;color:#111827;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    var AUTH_LOCAL_USERS={users:[{uid:'Administrator',username:'Administrator',passwordHash:hashPasswordSync('admin123'),role:'admin'},{uid:'000001',username:'Ruiweihan',passwordHash:hashPasswordSync('rui123'),role:'admin'},{uid:'000002',username:'Xvjiarui',passwordHash:hashPasswordSync('xvj123'),role:'user'}]};

    async function getAuth(){
      var auth={initialized:false,users:null,usersSha:null};
      async function init(){
        if(auth.initialized)return true;
        try{var r=await fetch('https://api.github.com/repos/'+AUTH_REPO+'/contents/users.json?ref=main&_='+Date.now(),{headers:{'Authorization':'token '+AUTH_TK(),'Accept':'application/vnd.github.v3+json'}});if(r.ok){var d=await r.json();auth.usersSha=d.sha;auth.users=JSON.parse(fromBase64(d.content));auth.initialized=true;return true}}catch(e){}
        auth.initialized=true;return false
      }
      return{
        validateUser:async function(usernameOrUid,password){
          if(!auth.initialized)await init();
          var hashed=hashPasswordSync(password);
          if(!auth.users){
            var lu=AUTH_LOCAL_USERS.users.find(function(u){return(u.username===usernameOrUid||u.uid===usernameOrUid)&&u.passwordHash===hashed});
            return lu?{success:true,user:{uid:lu.uid,username:lu.username,role:lu.role}}:{success:false,error:'用户名或密码错误'}
          }
          var idx=-1;
          if(auth.users.index&&auth.users.index.byUsername&&auth.users.index.byUsername[usernameOrUid]!==undefined)idx=auth.users.index.byUsername[usernameOrUid];
          if(idx===-1&&auth.users.index&&auth.users.index.byUid&&auth.users.index.byUid[usernameOrUid]!==undefined)idx=auth.users.index.byUid[usernameOrUid];
          if(idx===-1)idx=auth.users.users.findIndex(function(u){return u.username===usernameOrUid||u.uid===usernameOrUid});
          if(idx===-1)return{success:false,error:'用户名或密码错误'};
          var user=auth.users.users[idx];
          if(user.status==='disabled')return{success:false,error:'账户已被禁用'};
          if(user.passwordHash===hashed){return{success:true,user:{uid:user.uid,username:user.username,displayName:user.displayName,role:user.role,profile:user.profile}}}
          return{success:false,error:'用户名或密码错误'}
        }
      }

        var thumb='';
        if(r.resourceType==='图片'&&r.fileUrl)thumb='<img src="'+r.fileUrl+'" style="width:100%;height:80px;object-fit:cover;border-radius:8px;margin-top:8px" loading="lazy">';
        return'<div class="card" onclick="openPv(\''+r.id+'\')"><button class="del-btn'+(canDel?' can-del':'')+'" onclick="event.stopPropagation();delRes(\''+r.id+'\')" title="删除">&times;</button><div class="ct"><div class="ci '+t+'">'+i+'</div><div class="cf"><h3>'+esc(r.title)+'</h3><p>'+esc(r.description)+'</p><div class="cm"><span class="tg '+t+'">'+r.resourceType+'</span><span class="tg cat">'+r.category+'</span>'+(fz?'<span>'+fz+'</span>':'')+'<span>'+r.author+'</span><span>'+ft(r.createdAt)+'</span></div></div></div>'+thumb+'</div>';
      }).join('');
    }

    function openPv(id){
      var r=res.find(function(x){return x.id===id});if(!r)return;
      currentPvRes=r;
      document.getElementById('pTitle').textContent=r.title;document.getElementById('dlB').href=r.fileUrl||'#';
      var canDel=cu&&(r.authorUid===cu.uid||r.author===cu.username||isAdmin());
      document.getElementById('pvDelBtn').style.display=canDel?'inline-block':'none';
      var b=document.getElementById('pBody');b.innerHTML='';
      if(r.resourceType==='视频'&&r.fileUrl){b.innerHTML='<video controls preload="metadata" src="'+r.fileUrl+'">浏览器不支持视频播放</video>'}
      else if(r.resourceType==='链接'&&r.link){
        var emb=r.link,m1=r.link.match(/bilibili\.com\/video\/(BV[a-zA-Z0-9]+)/);if(m1)emb='https://player.bilibili.com/player.html?bvid='+m1[1]+'&autoplay=0';
        var m2=r.link.match(/[?&]v=([^&]+)/);if(m2)emb='https://www.youtube.com/embed/'+m2[1];
        var m3=r.link.match(/youtu\.be\/([^?]+)/);if(m3)emb='https://www.youtube.com/embed/'+m3[1];
        b.innerHTML=emb!==r.link?'<iframe src="'+emb+'" allowfullscreen></iframe>':'<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:400px;color:#9ca3af;font-size:14px"><p>外部视频链接</p><a href="'+r.link+'" target="_blank" style="margin-top:16px;padding:10px 24px;background:#111827;color:#fff;border-radius:12px;font-size:13px;font-weight:500">打开链接</a></div>';
      }else if(r.resourceType==='图片'&&r.fileUrl){b.innerHTML='<div class="iw"><img src="'+r.fileUrl+'"></div>'}
      else if(r.resourceType==='文档'&&r.fileUrl){
        var ext=fx(r.fileName);
        if(ext==='pdf')b.innerHTML='<iframe src="'+r.fileUrl+'"></iframe>';
        else if(['doc','docx','xls','xlsx','csv','ppt','pptx'].indexOf(ext)>=0)b.innerHTML='<iframe src="https://view.officeapps.live.com/op/embed.aspx?src='+encodeURIComponent(r.fileUrl)+'"></iframe>';
        else if(['txt','md'].indexOf(ext)>=0){b.innerHTML='<div class="tw" id="tc">加载中...</div>';fetch(r.fileUrl).then(function(x){return x.text()}).then(function(t){var e=document.getElementById('tc');if(e)e.textContent=t}).catch(function(){var e=document.getElementById('tc');if(e)e.textContent='加载失败'})}
        else if(['jpg','jpeg','png','gif','webp','svg','bmp'].indexOf(ext)>=0)b.innerHTML='<div class="iw"><img src="'+r.fileUrl+'"></div>';
        else b.innerHTML='<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:400px;color:#9ca3af;font-size:14px"><p>该格式暂不支持在线预览</p><a href="'+r.fileUrl+'" target="_blank" download style="margin-top:16px;padding:10px 24px;background:#111827;color:#fff;border-radius:12px;font-size:13px;font-weight:500">下载文件</a></div>';
      }
      document.getElementById('fov').classList.add('show');
    }
    function closePv(){document.getElementById('fov').classList.remove('show');document.getElementById('pBody').innerHTML='';currentPvRes=null}

    function delResFromPv(){
      if(!currentPvRes)return;
      delRes(currentPvRes.id);
    }

    async function delRes(id){
      var r=res.find(function(x){return x.id===id});if(!r)return;
      if(!cu){alert('请先登录');return}
      var canDel=(r.authorUid===cu.uid||r.author===cu.username||isAdmin());
      if(!canDel){alert('无权删除此资源');return}
      if(!confirm('确定删除资源「'+r.title+'」？此操作不可恢复。'))return;
      res=res.filter(function(x){return x.id!==id});
      try{
        var sha=null;var gr=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+LF+'?ref=main',{headers:{'Authorization':'token '+TK(),'Accept':'application/vnd.github.v3+json'}});
        if(gr.ok){var gd=await gr.json();sha=gd.sha}
        var bd={message:'Delete resource: '+r.title,content:b64e(new TextEncoder().encode(JSON.stringify(res,null,2)))};if(sha)bd.sha=sha;
        var sr=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+LF,{method:'PUT',headers:{'Authorization':'token '+TK(),'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify(bd)});
        if(sr.ok){closePv();renderRes()}else throw new Error('保存失败');
      }catch(err){alert('删除失败: '+err.message);res.unshift(r);renderRes()}
    }

    function showUploadModal(){
      selFile=null;document.getElementById('rT').value='';document.getElementById('rD').value='';document.getElementById('rL').value='';
      document.getElementById('fI').value='';document.getElementById('sF').style.display='none';document.getElementById('uP').style.display='none';
      document.getElementById('imgPrev').style.display='none';document.getElementById('uT').value='file';tum();
      document.getElementById('upModal').classList.add('show');
    }
    function closeUp(){document.getElementById('upModal').classList.remove('show');selFile=null}
    async function subRes(){
      var t=document.getElementById('rT').value.trim(),d=document.getElementById('rD').value.trim(),c=document.getElementById('rC').value,m=document.getElementById('uT').value,l=document.getElementById('rL').value.trim();
      if(!t){alert('请输入标题');return}if(!d){alert('请输入描述');return}
      var btn=document.getElementById('sB');btn.disabled=true;btn.textContent='上传中...';
      try{
        var rt='文档',fu='',fn='',fz=0;
        if(m==='link'){if(!l){alert('请输入链接');btn.disabled=false;btn.textContent='上传';return}rt='链接'}
        else{if(!selFile){alert('请选择文件');btn.disabled=false;btn.textContent='上传';return}
          rt=m==='video'?'视频':m==='image'?'图片':'文档';
          document.getElementById('uP').style.display='block';document.getElementById('pN').textContent=selFile.name;
          var ab=await selFile.arrayBuffer(),b64=b64e(ab),fp=LD+'/'+cu.uid+'_'+Date.now()+'_'+selFile.name;
          document.getElementById('pP').textContent='50%';document.getElementById('pB').style.width='50%';
          var ur=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+fp,{method:'PUT',headers:{'Authorization':'token '+TK(),'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify({message:'Upload: '+t,content:b64})});
          if(ur.ok){var ud=await ur.json();fu=ud.content.download_url;fn=selFile.name;fz=selFile.size;document.getElementById('pP').textContent='100%';document.getElementById('pB').style.width='100%'}else throw new Error('上传失败')}
        var nr={id:'learn_'+Date.now(),title:t,description:d,category:c,resourceType:rt,fileUrl:fu,fileName:fn,fileSize:fz,link:m==='link'?l:'',author:cu.username,authorUid:cu.uid,createdAt:new Date().toISOString(),downloads:0};
        res.unshift(nr);var sha=null;var gr=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+LF+'?ref=main',{headers:{'Authorization':'token '+TK(),'Accept':'application/vnd.github.v3+json'}});
        if(gr.ok){var gd=await gr.json();sha=gd.sha}
        var bd={message:'Add: '+t,content:b64e(new TextEncoder().encode(JSON.stringify(res,null,2)))};if(sha)bd.sha=sha;
        var sr=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+LF,{method:'PUT',headers:{'Authorization':'token '+TK(),'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify(bd)});
        if(sr.ok){closeUp();renderRes()}else throw new Error('保存失败');
      }catch(err){alert('上传失败: '+err.message)}finally{btn.disabled=false;btn.textContent='上传'}
    }

  </script>
</body>
