<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学习中心 - Rui Hub</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif}
    body{min-height:100vh;background:#fff;color:#111827;display:flex;flex-direction:column}
    a{text-decoration:none;color:inherit}
    button{cursor:pointer;border:none;background:none;font:inherit}
    input,select,textarea{font:inherit;outline:none}

    .nav{width:100%;padding:16px 24px;border-bottom:1px solid #f3f4f6}
    .nav-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
    .nav-links{display:flex;align-items:center;gap:24px;font-size:14px}
    .nav-links a{color:#6b7280;transition:color .15s}.nav-links a:hover{color:#111827}
    .nav-right{display:flex;align-items:center;gap:10px}
    .btn-reg{padding:6px 14px;background:#f3f4f6;color:#374151;font-size:12px;font-weight:500;border-radius:8px;transition:background .15s}.btn-reg:hover{background:#e5e7eb}
    .btn-login{padding:6px 14px;background:#111827;color:#fff;font-size:12px;font-weight:500;border-radius:8px;transition:background .15s}.btn-login:hover{background:#1f2937}
    .user-menu{position:relative;display:flex;align-items:center;gap:8px}
    .user-btn{display:flex;align-items:center;gap:6px;padding:6px 12px;background:#f3f4f6;border-radius:8px;font-size:13px;color:#374151;transition:background .15s}.user-btn:hover{background:#e5e7eb}
    .dropdown{display:none;position:absolute;right:0;top:100%;margin-top:8px;width:140px;background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.1);border:1px solid #f3f4f6;overflow:hidden;z-index:50}
    .dropdown.show{display:block}
    .dropdown a{display:block;padding:8px 16px;font-size:13px;color:#374151;transition:background .1s}.dropdown a:hover{background:#f9fafb}
    .dropdown .logout{color:#dc2626}.dropdown .logout:hover{background:#fef2f2}
    .dropdown .sep{height:1px;background:#f3f4f6}

    .main{flex:1;max-width:1000px;width:100%;margin:0 auto;padding:32px 24px}
    .page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px}
    .page-head h1{font-size:22px;font-weight:700}.new-badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:#111827;color:#fff;font-weight:700;margin-left:8px;vertical-align:middle}
    .page-head .sub{color:#6b7280;font-size:13px;margin-top:4px}
    .head-btns{display:flex;gap:8px;flex-shrink:0}
    .btn-ghost{padding:8px 16px;background:#f3f4f6;color:#374151;font-size:13px;font-weight:500;border-radius:12px;transition:background .15s;display:flex;align-items:center;gap:6px}.btn-ghost:hover{background:#e5e7eb}
    .btn-dark{padding:8px 16px;background:#111827;color:#fff;font-size:13px;font-weight:500;border-radius:12px;transition:background .15s;display:flex;align-items:center;gap:6px}.btn-dark:hover{background:#1f2937}

    .cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
    .cat-btn{padding:7px 14px;font-size:13px;border-radius:12px;border:1px solid #e5e7eb;color:#6b7280;transition:all .15s;background:#fff}.cat-btn:hover{background:#f9fafb;color:#374151}
    .cat-btn.active{background:#111827;color:#fff;border-color:#111827}

    .search-wrap{position:relative;margin-bottom:20px}
    .search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#9ca3af}
    .search-wrap input{width:100%;padding:10px 14px 10px 38px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;font-size:13px;transition:border .15s,background .15s}.search-wrap input:focus{border-color:#9ca3af;background:#fff}

    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
    @media(max-width:640px){.grid{grid-template-columns:1fr}}
    .card{background:#fff;border:1px solid #f3f4f6;border-radius:16px;padding:18px;cursor:pointer;transition:all .15s}.card:hover{border-color:#e5e7eb;box-shadow:0 4px 16px -4px rgba(0,0,0,.06);transform:translateY(-1px)}
    .card-top{display:flex;align-items:flex-start;gap:12px}
    .card-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .card-icon.doc{background:#eff6ff;color:#2563eb}.card-icon.vid{background:#fef2f2;color:#dc2626}.card-icon.link{background:#f0fdf4;color:#16a34a}
    .card-info{flex:1;min-width:0}
    .card-info h3{font-size:14px;font-weight:600;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .card-info p{font-size:12px;color:#6b7280;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:10px}
    .card-meta{display:flex;flex-wrap:wrap;gap:6px;font-size:11px;color:#9ca3af;align-items:center}
    .tag{padding:2px 8px;border-radius:20px;font-weight:500;font-size:11px}
    .tag.doc{background:#eff6ff;color:#2563eb}.tag.vid{background:#fef2f2;color:#dc2626}.tag.link{background:#f0fdf4;color:#16a34a}
    .tag.cat{background:#f3f4f6;color:#4b5563}

    .empty{text-align:center;padding:60px 20px;color:#9ca3af;font-size:14px}

    /* 全屏预览 */
    .preview-overlay{display:none;position:fixed;inset:0;z-index:100;background:#fff;flex-direction:column}
    .preview-overlay.show{display:flex}
    .preview-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-bottom:1px solid #f3f4f6;flex-shrink:0}
    .preview-bar h2{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;margin-right:12px}
    .preview-bar .right{display:flex;align-items:center;gap:10px;flex-shrink:0}
    .preview-bar .page-info{font-size:12px;color:#9ca3af}
    .btn-sm{padding:5px 12px;background:#f3f4f6;color:#374151;font-size:12px;font-weight:500;border-radius:8px;transition:background .15s}.btn-sm:hover{background:#e5e7eb}

    .preview-body{flex:1;overflow:auto;background:#f9fafb;position:relative}
    .preview-body iframe{width:100%;height:100%;border:none;display:block}
    .preview-body video{width:100%;min-height:80vh;background:#000}
    .preview-body .text-wrap{max-width:800px;margin:0 auto;padding:32px;background:#fff;border-radius:12px;font-size:13px;line-height:1.8;white-space:pre-wrap;font-family:'Courier New',monospace}
    .preview-body .img-wrap{display:flex;align-items:center;justify-content:center;min-height:100%;padding:32px}
    .preview-body .img-wrap img{max-width:100%;border-radius:8px}
    .preview-body .fallback{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:400px;color:#9ca3af;font-size:14px}

    /* 弹窗通用 */
    .modal-bg{display:none;position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.25);backdrop-filter:blur(4px);align-items:center;justify-content:center}
    .modal-bg.show{display:flex}
    .modal{background:#fff;border-radius:16px;box-shadow:0 8px 40px rgba(0,0,0,.12);width:100%;max-width:460px;margin:16px;overflow:hidden}
    .modal-head{padding:18px 20px;border-bottom:1px solid #f3f4f6;display:flex;align-items:center;justify-content:space-between}
    .modal-head h2{font-size:16px;font-weight:600}
    .modal-body{padding:20px}
    .modal-foot{padding:16px 20px;border-top:1px solid #f3f4f6;display:flex;justify-content:flex-end;gap:8px}

    .field{margin-bottom:14px}
    .field label{display:block;font-size:13px;font-weight:500;color:#374151;margin-bottom:6px}
    .field input,.field select,.field textarea{width:100%;padding:10px 14px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;font-size:13px;transition:border .15s,background .15s}
    .field input:focus,.field select:focus,.field textarea:focus{border-color:#9ca3af;background:#fff}
    .field textarea{resize:none}
    .row{display:flex;gap:12px}.row .field{flex:1}

    .drop-zone{border:2px dashed #d1d5db;border-radius:12px;padding:28px;text-align:center;cursor:pointer;transition:border .15s,background .15s}
    .drop-zone:hover,.drop-zone.over{border-color:#111827;background:#f9fafb}
    .drop-zone svg{margin:0 auto 8px;color:#d1d5db}
    .drop-zone p{font-size:13px;color:#6b7280}.drop-zone .hint{font-size:11px;color:#9ca3af;margin-top:4px}
    .drop-zone .selected{font-size:13px;font-weight:500;color:#111827;margin-top:8px;display:none}

    .progress{margin-top:12px;display:none}
    .progress .top{display:flex;justify-content:space-between;font-size:11px;color:#6b7280;margin-bottom:4px}
    .progress .bar{height:6px;background:#f3f4f6;border-radius:3px;overflow:hidden}
    .progress .bar div{height:100%;background:#111827;border-radius:3px;transition:width .3s}

    /* 考试全屏 */
    .exam-overlay{display:none;position:fixed;inset:0;z-index:90;background:#fff;flex-direction:column}
    .exam-overlay.show{display:flex}
    .exam-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid #f3f4f6}
    .exam-bar h2{font-size:16px;font-weight:600}
    .exam-body{flex:1;overflow:auto;padding:24px;max-width:700px;margin:0 auto;width:100%}

    .quiz-opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 14px;border:1px solid #e5e7eb;border-radius:12px;font-size:13px;color:#374151;transition:all .15s;margin-bottom:6px}
    .quiz-opt:hover{border-color:#9ca3af;background:#f9fafb}
    .quiz-opt.sel{border-color:#111827;background:#f3f4f6}
    .quiz-opt.ok{border-color:#16a34a;background:#f0fdf4;color:#16a34a}
    .quiz-opt.no{border-color:#dc2626;background:#fef2f2;color:#dc2626}
    .quiz-circle{width:24px;height:24px;border-radius:50%;border:2px solid #d1d5db;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}

    .q-item{background:#f9fafb;border-radius:14px;padding:16px;border:1px solid #e5e7eb;margin-bottom:14px}
    .q-item .q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;font-weight:500;color:#374151}
    .q-item .q-head button{font-size:11px;color:#dc2626}.q-item .q-head button:hover{color:#b91c1c}
    .q-item input,.q-item select{width:100%;padding:8px 12px;background:#fff;border:1px solid #e5e7eb;border-radius:8px;font-size:12px;margin-bottom:6px}

    /* 登录页 */
    .login-page{position:fixed;inset:0;z-index:50;background:#fff;display:none;align-items:center;justify-content:center}
    .login-page.show{display:flex}
    .login-box{text-align:center}
    .login-box .icon{width:72px;height:72px;margin:0 auto 16px;background:#f3f4f6;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#6b7280}
    .login-box h2{font-size:22px;font-weight:700;margin-bottom:6px}
    .login-box p{color:#6b7280;font-size:14px;margin-bottom:20px}
    .login-box button{padding:12px 32px;background:#111827;color:#fff;font-weight:500;border-radius:12px;transition:background .15s}.login-box button:hover{background:#1f2937}
  </style>
</head>

    function fsize(b){if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';return(b/1048576).toFixed(1)+' MB'}
    function fext(n){return n?n.split('.').pop().toLowerCase():''}
    function ftime(iso){var d=new Date(iso),n=new Date(),df=n-d;if(df<6e4)return'刚刚';if(df<36e5)return Math.floor(df/6e4)+'分钟前';if(df<864e5)return Math.floor(df/36e5)+'小时前';if(df<6048e5)return Math.floor(df/864e5)+'天前';return d.toLocaleDateString('zh-CN')}

    // ====== 登录 ======
    (function(){
      var st=syncLoginState();
      if(st.isLoggedIn){
        curUser={username:st.username,uid:st.uid};
        document.getElementById('loginPage').style.display='none';
        document.getElementById('mainContent').style.display='block';
        document.getElementById('authBtns').style.display='none';
        document.getElementById('userMenu').style.display='flex';
        document.getElementById('userName').textContent=st.username;
        if(UPLOADERS.indexOf(curUser.username)>=0||UPLOADERS.indexOf(curUser.uid)>=0)document.getElementById('uploadWrap').style.display='block';
        loadRes();loadExams();
      }else{
        document.getElementById('loginPage').classList.add('show');
      }
    })();

    document.getElementById('userBtn').onclick=function(e){e.stopPropagation();document.getElementById('dropdown').classList.toggle('show')};
    document.addEventListener('click',function(){document.getElementById('dropdown').classList.remove('show')});

    function showLoginModal(){var m=document.getElementById('loginModal');m.classList.add('show')}
    document.getElementById('loginForm').onsubmit=async function(e){
      e.preventDefault();
      var u=document.getElementById('loginUser').value.trim(),p=document.getElementById('loginPass').value;
      try{
        var auth=await getAuth(),r=await auth.validateUser(u,p);
        if(r.success){sessionStorage.setItem('rui_user',r.user.username);sessionStorage.setItem('rui_uid',r.user.uid);localStorage.setItem('rui_user_remember',r.user.username);localStorage.setItem('rui_uid_remember',r.user.uid);localStorage.setItem('rui_user_expire',''+(Date.now()+6048e5));location.reload()}
        else{document.getElementById('loginErr').textContent=r.error;document.getElementById('loginErr').style.display='block'}
      }catch(err){document.getElementById('loginErr').textContent='登录失败';document.getElementById('loginErr').style.display='block'}
    };
    function logout(){sessionStorage.clear();localStorage.removeItem('rui_user_remember');localStorage.removeItem('rui_uid_remember');localStorage.removeItem('rui_user_expire');location.reload()}

    // ====== 分类 ======
    var CATS=['','文档','视频','编程','数学','物理','英语','其他'];
    var catEl=document.getElementById('cats');
    CATS.forEach(function(c){
      var b=document.createElement('button');
      b.className='cat-btn'+(c===''?' active':'');
      b.textContent=c||'全部';
      b.onclick=function(){curCat=c;document.querySelectorAll('.cat-btn').forEach(function(x){x.classList.remove('active')});b.classList.add('active');renderResources()};
      catEl.appendChild(b);
    });

    // ====== 上传模式 ======
    function toggleUploadMode(){
      var m=document.getElementById('uploadType').value;
      document.getElementById('fileArea').style.display=m==='link'?'none':'block';
      document.getElementById('linkArea').style.display=m==='link'?'block':'none';
      document.getElementById('fileHint').textContent=m==='video'?'支持 MP4、WebM、MOV 等视频格式（最大25MB）':'支持 PDF、DOC、DOCX、PPT、PPTX、XLS、XLSX、TXT 等';
      document.getElementById('fileInput').accept=m==='video'?'video/*':'.pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.md';
    }
    function handleFile(e){var f=e.target.files[0];if(!f)return;if(f.size>25e6){alert('文件不能超过25MB');e.target.value='';return}selFile=f;var el=document.getElementById('selectedFile');el.textContent=f.name+' ('+fsize(f.size)+')';el.style.display='block'}
    var dz=document.getElementById('dropZone');
    dz.ondragover=function(e){e.preventDefault();dz.classList.add('over')};
    dz.ondragleave=function(){dz.classList.remove('over')};
    dz.ondrop=function(e){e.preventDefault();dz.classList.remove('over');var f=e.dataTransfer.files[0];if(!f)return;if(f.size>25e6){alert('文件不能超过25MB');return}selFile=f;document.getElementById('fileInput').files=e.dataTransfer.files;var el=document.getElementById('selectedFile');el.textContent=f.name+' ('+fsize(f.size)+')';el.style.display='block'};

    // ====== 资源加载 ======
    async function loadRes(){
      try{var r=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+LFILE+'?ref=main&_='+Date.now(),{headers:{'Authorization':'token '+TK(),'Accept':'application/vnd.github.v3+json'}});if(r.ok){var d=await r.json();resources=JSON.parse(b64dec(d.content))}else{resources=[]}}catch(e){resources=[]}
      renderResources();
    }

    function renderResources(){
      var s=(document.getElementById('searchInput')?.value||'').toLowerCase();
      var list=resources.slice();
      if(curCat){if(curCat==='文档'||curCat==='视频')list=list.filter(function(r){return r.resourceType===curCat});else list=list.filter(function(r){return r.category===curCat})}
      if(s)list=list.filter(function(r){return r.title.toLowerCase().indexOf(s)>=0||r.description.toLowerCase().indexOf(s)>=0||r.author.toLowerCase().indexOf(s)>=0});
      list.sort(function(a,b){return new Date(b.createdAt)-new Date(a.createdAt)});
      var c=document.getElementById('resourceList');
      if(!list.length){c.innerHTML='<div class="empty" style="grid-column:1/-1"><p>暂无学习资源</p><p style="font-size:12px;margin-top:4px">MA 至 SU 成员可以上传资源</p></div>';return}
      var svgDoc='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>';
      var svgVid='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><circle cx="12" cy="12" r="9"/></svg>';
      var svgLink='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>';
      var icons={'文档':svgDoc,'视频':svgVid,'链接':svgLink};
      var cls={'文档':'doc','视频':'vid','链接':'link'};

      c.innerHTML=list.map(function(r){
        var t=cls[r.resourceType]||'doc';
        var ic=icons[r.resourceType]||svgDoc;
        var fs=r.fileSize?fsize(r.fileSize):'';
        return '<div class="card" onclick="openRes(\''+r.id+'\')"><div class="card-top"><div class="card-icon '+t+'">'+ic+'</div><div class="card-info"><h3>'+esc(r.title)+'</h3><p>'+esc(r.description)+'</p><div class="card-meta"><span class="tag '+t+'">'+r.resourceType+'</span><span class="tag cat">'+r.category+'</span>'+(fs?'<span>'+fs+'</span>':'')+'<span>'+r.author+'</span><span>'+ftime(r.createdAt)+'</span></div></div></div></div>';
      }).join('');
    }

    // ====== 全屏预览 - 核心优化 ======
    function openRes(id){
      var r=resources.find(function(x){return x.id===id});
      if(!r)return;
      document.getElementById('previewTitle').textContent=r.title;
      document.getElementById('dlBtn').href=r.fileUrl||'#';
      var body=document.getElementById('previewBody');
      body.innerHTML='';
      document.getElementById('pageInfo').style.display='none';

      // 视频
      if(r.resourceType==='视频'&&r.fileUrl){
        body.innerHTML='<video controls preload="metadata" src="'+r.fileUrl+'">浏览器不支持视频播放</video>';
      }
      // 链接视频
      else if(r.resourceType==='链接'&&r.link){
        var emb=r.link;
        var m1=r.link.match(/bilibili\.com\/video\/(BV[a-zA-Z0-9]+)/);
        if(m1)emb='https://player.bilibili.com/player.html?bvid='+m1[1]+'&autoplay=0';
        var m2=r.link.match(/[?&]v=([^&]+)/);
        if(m2)emb='https://www.youtube.com/embed/'+m2[1];
        var m3=r.link.match(/youtu\.be\/([^?]+)/);
        if(m3)emb='https://www.youtube.com/embed/'+m3[1];
        if(emb!==r.link){body.innerHTML='<iframe src="'+emb+'" allowfullscreen></iframe>'}
        else{body.innerHTML='<div class="fallback"><p>外部视频链接</p><a href="'+r.link+'" target="_blank">打开链接</a></div>'}
      }
      // 文档预览
      else if(r.resourceType==='文档'&&r.fileUrl){
        var ext=fext(r.fileName);
        if(ext==='pdf'){
          // 浏览器原生PDF渲染 - 零依赖，格式完美，秒开
          body.innerHTML='<iframe src="'+r.fileUrl+'"></iframe>';
        }else if(['doc','docx','xls','xlsx','csv','ppt','pptx'].indexOf(ext)>=0){
          // 微软Office在线嵌入预览 - 格式完美
          var msUrl='https://view.officeapps.live.com/op/embed.aspx?src='+encodeURIComponent(r.fileUrl);
          body.innerHTML='<iframe src="'+msUrl+'"></iframe>';
        }else if(['txt','md'].indexOf(ext)>=0){
          body.innerHTML='<div class="text-wrap" id="txtContent">加载中...</div>';
          fetch(r.fileUrl).then(function(res){return res.text()}).then(function(t){var el=document.getElementById('txtContent');if(el)el.textContent=t}).catch(function(){var el=document.getElementById('txtContent');if(el)el.textContent='内容加载失败'});
        }else if(['jpg','jpeg','png','gif','webp','svg','bmp'].indexOf(ext)>=0){
          body.innerHTML='<div class="img-wrap"><img src="'+r.fileUrl+'"></div>';
        }else{
          body.innerHTML='<div class="fallback"><p>该格式暂不支持在线预览</p><a href="'+r.fileUrl+'" target="_blank" download>下载文件</a></div>';
        }
      }

      document.getElementById('previewOverlay').classList.add('show');
    }

    function closePreview(){
      document.getElementById('previewOverlay').classList.remove('show');
      document.getElementById('previewBody').innerHTML='';
    }

    // ====== 上传 ======
    function showUploadModal(){
      selFile=null;document.getElementById('resTitle').value='';document.getElementById('resDesc').value='';document.getElementById('resLink').value='';
      document.getElementById('selectedFile').style.display='none';document.getElementById('uploadProg').style.display='none';
      document.getElementById('uploadType').value='file';toggleUploadMode();
      document.getElementById('uploadModal').classList.add('show');
    }
    function closeUploadModal(){document.getElementById('uploadModal').classList.remove('show');selFile=null}

    async function submitResource(){
      var title=document.getElementById('resTitle').value.trim(),desc=document.getElementById('resDesc').value.trim(),cat=document.getElementById('resCat').value,mode=document.getElementById('uploadType').value,link=document.getElementById('resLink').value.trim();
      if(!title){alert('请输入资源标题');return}if(!desc){alert('请输入资源描述');return}
      var btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='上传中...';
      try{
        var rtype='文档',furl='',fname='',fsize2=0;
        if(mode==='link'){if(!link){alert('请输入视频链接');btn.disabled=false;btn.textContent='上传';return}rtype='链接'}
        else{
          if(!selFile){alert('请选择文件');btn.disabled=false;btn.textContent='上传';return}
          rtype=mode==='video'?'视频':'文档';
          document.getElementById('uploadProg').style.display='block';document.getElementById('progName').textContent=selFile.name;
          var ab=await selFile.arrayBuffer(),b64=b64enc(ab),fp=LFOLDER+'/'+curUser.uid+'_'+Date.now()+'_'+selFile.name;
          document.getElementById('progPct').textContent='50%';document.getElementById('progBar').style.width='50%';
          var ur=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+fp,{method:'PUT',headers:{'Authorization':'token '+TK(),'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify({message:'Upload: '+title,content:b64})});
          if(ur.ok){var ud=await ur.json();furl=ud.content.download_url;fname=selFile.name;fsize2=selFile.size;document.getElementById('progPct').textContent='100%';document.getElementById('progBar').style.width='100%'}else throw new Error('文件上传失败');
        }
        var nr={id:'learn_'+Date.now(),title:title,description:desc,category:cat,resourceType:rtype,fileUrl:furl,fileName:fname,fileSize:fsize2,link:mode==='link'?link:'',author:curUser.username,authorUid:curUser.uid,createdAt:new Date().toISOString(),downloads:0};
        resources.unshift(nr);
        var sha=null;var gr=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+LFILE+'?ref=main',{headers:{'Authorization':'token '+TK(),'Accept':'application/vnd.github.v3+json'}});
        if(gr.ok){var gd=await gr.json();sha=gd.sha}
        var bd={message:'Add: '+title,content:b64enc(new TextEncoder().encode(JSON.stringify(resources,null,2)))};if(sha)bd.sha=sha;
        var sr=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+LFILE,{method:'PUT',headers:{'Authorization':'token '+TK(),'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify(bd)});
        if(sr.ok){closeUploadModal();renderResources()}else throw new Error('保存失败');
      }catch(err){alert('上传失败: '+err.message)}finally{btn.disabled=false;btn.textContent='上传'}
    }

    // ====== 考试 ======
    async function loadExams(){
      try{var r=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+EFILE+'?ref=main&_='+Date.now(),{headers:{'Authorization':'token '+TK(),'Accept':'application/vnd.github.v3+json'}});if(r.ok){var d=await r.json();exams=JSON.parse(b64dec(d.content))}else{exams=[]}}catch(e){exams=[]}
    }
    function showExamModal(){renderExamList();document.getElementById('examOverlay').classList.add('show')}
    function closeExamModal(){document.getElementById('examOverlay').classList.remove('show')}

    function renderExamList(){
      var c=document.getElementById('examContent');
      var can=UPLOADERS.indexOf(curUser?.username)>=0||UPLOADERS.indexOf(curUser?.uid)>=0;
      var h='';
      if(can){
        h+='<div style="margin-bottom:20px;padding:18px;background:#f9fafb;border-radius:14px;border:1px solid #e5e7eb"><h3 style="font-size:15px;font-weight:600;margin-bottom:14px">创建考试</h3><div class="field"><input id="examTitle" placeholder="考试名称（如：第一章测试）"></div><div class="field"><select id="examCat"><option value="编程">编程</option><option value="数学">数学</option><option value="物理">物理</option><option value="英语">英语</option><option value="其他">其他</option></select></div><div id="qContainer"><div class="q-item"><div class="q-head"><span>第 1 题</span><button onclick="rmQ(this)">删除</button></div><input class="q-title" placeholder="题目"><input class="q-a" placeholder="选项A"><input class="q-b" placeholder="选项B"><input class="q-c" placeholder="选项C"><input class="q-d" placeholder="选项D"><select class="q-ans"><option value="A">正确答案: A</option><option value="B">正确答案: B</option><option value="C">正确答案: C</option><option value="D">正确答案: D</option></select></div></div><button class="btn-ghost" onclick="addQ()" style="margin:8px 0;width:100%">+ 添加题目</button><button class="btn-dark" onclick="createExam()" style="width:100%;padding:10px">创建考试</button></div>';
      }
      if(exams.length){
        h+='<h3 style="font-size:15px;font-weight:600;margin-bottom:14px">可用考试</h3>';
        exams.forEach(function(ex){
          h+='<div style="padding:14px;background:#f9fafb;border-radius:12px;border:1px solid #e5e7eb;margin-bottom:8px;cursor:pointer;transition:border .15s" onclick="startExam(\''+ex.id+'\')"><div style="display:flex;align-items:center;justify-content:space-between"><div><div style="font-weight:500;font-size:14px">'+esc(ex.title)+'</div><div style="font-size:11px;color:#9ca3af;margin-top:4px">'+ex.category+' | '+ex.questions.length+' 题 | '+ex.author+'</div></div><button class="btn-dark" style="font-size:11px;padding:6px 12px">开始考试</button></div></div>';
        });
      }
      if(!h)h='<div class="empty"><p>暂无考试</p></div>';
      c.innerHTML=h;
    }

    function addQ(){
      var c=document.getElementById('qContainer'),n=c.children.length+1,d=document.createElement('div');
      d.className='q-item';d.innerHTML='<div class="q-head"><span>第 '+n+' 题</span><button onclick="rmQ(this)">删除</button></div><input class="q-title" placeholder="题目"><input class="q-a" placeholder="选项A"><input class="q-b" placeholder="选项B"><input class="q-c" placeholder="选项C"><input class="q-d" placeholder="选项D"><select class="q-ans"><option value="A">正确答案: A</option><option value="B">正确答案: B</option><option value="C">正确答案: C</option><option value="D">正确答案: D</option></select>';
      c.appendChild(d);
    }
    function rmQ(b){b.closest('.q-item').remove();document.querySelectorAll('.q-item').forEach(function(el,i){el.querySelector('.q-head span').textContent='第 '+(i+1)+' 题'})}

    async function createExam(){
      var title=document.getElementById('examTitle').value.trim(),cat=document.getElementById('examCat').value;
      if(!title){alert('请输入考试名称');return}
      var qs=[];document.querySelectorAll('.q-item').forEach(function(el){
        var q=el.querySelector('.q-title').value.trim(),a=el.querySelector('.q-a').value.trim(),b=el.querySelector('.q-b').value.trim(),c=el.querySelector('.q-c').value.trim(),d=el.querySelector('.q-d').value.trim(),ans=el.querySelector('.q-ans').value;
        if(q&&a&&b&&c&&d)qs.push({question:q,options:{A:a,B:b,C:c,D:d},answer:ans});
      });
      if(!qs.length){alert('请至少添加一道完整题目');return}
      var ne={id:'exam_'+Date.now(),title:title,category:cat,questions:qs,author:curUser.username,createdAt:new Date().toISOString()};
      exams.unshift(ne);
      try{
        var sha=null;var gr=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+EFILE+'?ref=main',{headers:{'Authorization':'token '+TK(),'Accept':'application/vnd.github.v3+json'}});
        if(gr.ok){var gd=await gr.json();sha=gd.sha}
        var bd={message:'Create exam: '+title,content:b64enc(new TextEncoder().encode(JSON.stringify(exams,null,2)))};if(sha)bd.sha=sha;
        var sr=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+EFILE,{method:'PUT',headers:{'Authorization':'token '+TK(),'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify(bd)});
        if(sr.ok){alert('考试创建成功！');renderExamList()}else throw new Error('保存失败');
      }catch(err){alert('创建失败: '+err.message);exams.shift()}
    }

    function startExam(eid){
      var ex=exams.find(function(e){return e.id===eid});if(!ex)return;
      var c=document.getElementById('examContent'),h='<div style="margin-bottom:20px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h3 style="font-size:18px;font-weight:700">'+esc(ex.title)+'</h3><span style="font-size:12px;color:#9ca3af">'+ex.questions.length+' 题</span></div><div style="display:flex;flex-direction:column;gap:14px">';
      ex.questions.forEach(function(q,i){
        h+='<div style="background:#f9fafb;border-radius:14px;padding:16px;border:1px solid #e5e7eb"><p style="font-weight:500;margin-bottom:12px">'+(i+1)+'. '+esc(q.question)+'</p><div>';
        ['A','B','C','D'].forEach(function(l){
          h+='<button class="quiz-opt" id="q'+i+'_'+l+'" onclick="pickAns(\''+eid+'\','+i+',\''+l+'\')"><span class="quiz-circle">'+l+'</span><span>'+esc(q.options[l])+'</span></button>';
        });
        h+='</div></div>';
      });
      h+='</div></div><button class="btn-dark" onclick="submitExam(\''+eid+'\')" style="width:100%;padding:12px">提交答卷</button>';
      c.innerHTML=h;window._ea={};window._es=false;
    }
    function pickAns(eid,qi,l){if(window._es)return;window._ea[qi]=l;['A','B','C','D'].forEach(function(x){var e=document.getElementById('q'+qi+'_'+x);if(e)e.classList.remove('sel')});var e=document.getElementById('q'+qi+'_'+l);if(e)e.classList.add('sel')}
    function submitExam(eid){
      if(window._es)return;var ex=exams.find(function(e){return e.id===eid});if(!ex)return;window._es=true;var ok=0;
      ex.questions.forEach(function(q,i){var ua=window._ea[i];['A','B','C','D'].forEach(function(l){var e=document.getElementById('q'+i+'_'+l);if(!e)return;if(l===q.answer)e.classList.add('ok');if(ua===l&&l!==q.answer)e.classList.add('no')});if(ua===q.answer)ok++});
      var tot=ex.questions.length,sc=Math.round(ok/tot*100);
      var rh='<div style="margin-top:20px;padding:18px;border-radius:14px;border:1px solid '+(sc>=60?'#bbf7d0':'#fecaca')+';background:'+(sc>=60?'#f0fdf4':'#fef2f2')+';text-align:center"><p style="font-size:36px;font-weight:700;color:'+(sc>=60?'#16a34a':'#dc2626')+'">'+sc+'</p><p style="font-size:13px;color:#6b7280;margin-top:4px">正确 '+ok+'/'+tot+' 题</p><p style="font-size:13px;color:'+(sc>=60?'#16a34a':'#dc2626')+';margin-top:8px">'+(sc>=60?'恭喜通过！':'继续加油！')+'</p></div><button class="btn-ghost" onclick="renderExamList()" style="width:100%;margin-top:10px;padding:10px">返回考试列表</button>';
      document.getElementById('examContent').insertAdjacentHTML('beforeend',rh);
    }
  </script>
</body>
